<body class="min-h-screen text-neutral-200 antialiased">
  <div id="root">
    <div style="min-height:100vh;display:grid;place-items:center;color:#8a8a8a;font-family:Barlow,sans-serif">Carregando o Galoscópia…</div>
  </div>

  <script type="text/babel">
    const { useState, useEffect, useRef, useMemo, useCallback } = React;

    /* =========================================================
       1. CONFIGURAÇÃO
       Dados ao vivo da ESPN (gratuitos, sem chave). A ESPN cobre
       o Galo de 2007 em diante; antes disso, ver LENDAS.
       ========================================================= */
    const GALO_ID = '7632';
    const ESPN = 'https://site.api.espn.com/apis/site/v2/sports/soccer/';
    const ESPN_ATLETA = 'https://site.web.api.espn.com/apis/common/v3/sports/soccer/athletes/';
    const TZ = 'America/Sao_Paulo';
    const ANO_ATUAL = Number(new Intl.DateTimeFormat('en', { timeZone: TZ, year: 'numeric' }).format(new Date()));
    const PRIMEIRO_ANO = 2007;
    const ATUALIZAR_A_CADA = 10 * 60 * 1000;   // próximos jogos e temporada atual
    const ATUALIZAR_AO_VIVO = 60 * 1000;       // jogo em andamento

    const COMPETICOES = [
      { slug: 'bra.1', nome: 'Brasileirão Série A', curto: 'Brasileirão', deslocar: true },
      { slug: 'conmebol.libertadores', nome: 'Copa Libertadores', curto: 'Libertadores', deslocar: true },
      { slug: 'conmebol.sudamericana', nome: 'Copa Sul-Americana', curto: 'Sul-Americana', deslocar: true },
      { slug: 'bra.copa_do_brazil', nome: 'Copa do Brasil', curto: 'Copa do Brasil' },
      { slug: 'bra.camp.mineiro', nome: 'Campeonato Mineiro', curto: 'Mineiro' },
      { slug: 'bra.supercopa_do_brazil', nome: 'Supercopa do Brasil', curto: 'Supercopa' },
      { slug: 'fifa.cwc', nome: 'Mundial de Clubes', curto: 'Mundial' },
    ];
    const COMP = Object.fromEntries(COMPETICOES.map((c) => [c.slug, c]));
    const OURO = '#C69C3E';
    const MAX_POR_TIME = 11;

    /* =========================================================
       2. LENDAS ANTERIORES A 2007 (pesquisa própria, fontes citadas)
       ========================================================= */
    const LENDAS = [
      {
        id: 'reinaldo', gd: 'José Reinaldo de Lima', nome: 'Reinaldo', pos: 'F', periodo: '1973–1985', jogos: 475, gols: 255,
        titulos: 'Campeonato Mineiro (1976, 1978 a 1983 e 1985), Copa dos Campeões da Copa Brasil (1978)',
        texto: 'Maior artilheiro da história do clube. No Brasileirão de 1977 fez 28 gols em 18 jogos, a maior média de uma única edição, e o Galo foi vice invicto, perdendo a final nos pênaltis para o São Paulo. Ganhou a Bola de Prata em 1977 e em 1983.',
        fonte: 'Lance! (Lancepédia)',
      },
      {
        id: 'dada', gd: 'Dario José dos Santos', nome: 'Dadá Maravilha', pos: 'F', periodo: '1968–1979, em mais de uma passagem', jogos: 290, gols: 211,
        titulos: 'Campeonato Brasileiro (1971)',
        texto: 'Segundo maior artilheiro do Galo e referência do título brasileiro de 1971, o primeiro do clube. Ao longo da carreira também atuou por clubes do Nordeste como Sport, Náutico e Santa Cruz.',
        fonte: 'Goal, Lance! e Diario de Pernambuco',
      },
      {
        id: 'mario-de-castro', gd: 'Mário de Castro', nome: 'Mário de Castro', pos: 'F', periodo: '1925–1931', jogos: 100, gols: 195,
        titulos: 'Títulos estaduais nas décadas de 1920 e 1930',
        texto: 'Terceiro maior artilheiro da história, com quase dois gols por jogo nos primeiros anos do clube.',
        fonte: 'Goal e Lance!',
      },
      {
        id: 'joao-leite', gd: 'João Leite da Silva Neto', nome: 'João Leite', pos: 'G', periodo: '1976–1988 e 1991–1992', jogos: 684, gols: 0,
        titulos: '11 Campeonatos Mineiros (recorde entre jogadores do clube) e Copa Conmebol (1992)',
        texto: 'Recordista de jogos oficiais pelo Galo. Ficou sem sofrer gols em 353 partidas.',
        fonte: 'Lance! (Lancepédia)',
      },
      {
        id: 'toninho-cerezo', gd: 'Antônio Carlos Cerezo', nome: 'Toninho Cerezo', pos: 'M', periodo: '1972–1983 e 1997', jogos: null, gols: null,
        titulos: 'Campeonato Mineiro (1976, 1978 a 1983), Copa dos Campeões da Copa Brasil (1978)',
        texto: 'Revelado no Galo, foi emprestado ao Nacional-AM (1973–1974) e saiu em 1983 para a Roma. Depois jogou por Sampdoria (1986–1992), São Paulo, Cruzeiro e América-MG, e encerrou a carreira no Galo em 1997. Disputou as Copas de 1978 e 1982 pela Seleção.',
        fonte: 'Wikipedia',
      },
      {
        id: 'eder-aleixo', gd: 'Éder Aleixo de Assis', nome: 'Éder Aleixo', pos: 'F', periodo: '1980–1985, 1989–1990 e 1994–1995', jogos: null, gols: null,
        titulos: 'Campeonato Mineiro (1980 a 1983, 1985 e 1995)',
        texto: 'Ponta-esquerda de chute forte. Chegou depois de passar por América-MG e Grêmio, rodou por Palmeiras, Santos, Sport, Botafogo, Athletico-PR, Cerro Porteño e Malatyaspor (Turquia), e voltou ao Galo duas vezes. Disputou a Copa de 1982.',
        fonte: 'Wikipedia',
      },
      {
        id: 'marques', gd: 'Marques Batista de Abreu', nome: 'Marques', pos: 'F', periodo: '1997–2002, 2005–2006 e 2008–2010', jogos: 386, gols: 133,
        titulos: 'Copa Conmebol (1997), Campeonato Mineiro (1999, 2000 e 2010)',
        texto: 'Atacante de três passagens pelo clube, entre os dez maiores artilheiros da história. A última passagem também aparece nos dados da ESPN.',
        fonte: 'Lance! (Lancepédia)',
      },
      {
        id: 'guilherme', gd: 'Guilherme de Cássio Alves', nome: 'Guilherme', pos: 'F', periodo: 'Final dos anos 1990 e início dos 2000', jogos: 205, gols: 139,
        titulos: 'Vice-campeão brasileiro (1999)',
        texto: 'Centroavante entre os maiores artilheiros do clube, destaque da campanha do vice-campeonato brasileiro de 1999.',
        fonte: 'Goal e Lance!',
      },
    ];

    /* =========================================================
       3. UTILITÁRIOS
       ========================================================= */
    const fmt = (opts) => new Intl.DateTimeFormat('pt-BR', { timeZone: TZ, ...opts });
    const fData = fmt({ day: '2-digit', month: '2-digit', year: 'numeric' });
    const fDiaMes = fmt({ day: '2-digit', month: '2-digit' });
    const fHora = fmt({ hour: '2-digit', minute: '2-digit' });
    const fLonga = fmt({ weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
    const anoDe = (iso) => Number(new Intl.DateTimeFormat('en', { timeZone: TZ, year: 'numeric' }).format(new Date(iso)));
    const dataNasc = (iso) => (iso ? new Intl.DateTimeFormat('pt-BR', { timeZone: 'UTC' }).format(new Date(iso)) : '');

    const PAISES = {
      Brazil: 'Brasil', Argentina: 'Argentina', Uruguay: 'Uruguai', Colombia: 'Colômbia', Chile: 'Chile',
      Paraguay: 'Paraguai', Ecuador: 'Equador', Venezuela: 'Venezuela', Peru: 'Peru', Bolivia: 'Bolívia',
      Portugal: 'Portugal', Spain: 'Espanha', Italy: 'Itália', France: 'França', Mexico: 'México',
      'United States': 'Estados Unidos', Germany: 'Alemanha', Japan: 'Japão', Haiti: 'Haiti', Guinea: 'Guiné',
    };
    const paisPt = (p) => PAISES[p] || p || '';
    const POSICOES = { G: 'Goleiro', D: 'Defensor', M: 'Meio-campista', F: 'Atacante' };
    const posPt = (abbr) => POSICOES[(abbr || '').charAt(0)] || 'Jogador';
    const semAcento = (s) => (s || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').trim();

    const LS = 'tsg2:';
    const store = {
      get(k, padrao = null) {
        try { const v = localStorage.getItem(LS + k); return v == null ? padrao : JSON.parse(v); } catch (e) { return padrao; }
      },
      set(k, v) {
        const txt = JSON.stringify(v);
        try { localStorage.setItem(LS + k, txt); return true; } catch (e) {
          try { liberarEspaco(); localStorage.setItem(LS + k, txt); return true; } catch (e2) { return false; }
        }
      },
      del(k) { try { localStorage.removeItem(LS + k); } catch (e) {} },
      chaves(prefixo) {
        const out = [];
        try { for (let i = 0; i < localStorage.length; i++) { const k = localStorage.key(i); if (k && k.startsWith(LS + prefixo)) out.push(k.slice(LS.length)); } } catch (e) {}
        return out;
      },
    };
    function liberarEspaco() {
      const ks = store.chaves('cache:sum').concat(store.chaves('cache:atleta:'), store.chaves('cache:ultimo:'), store.chaves('cache:gd:atleta:'), store.chaves('cache:gd:jogo:'), store.chaves('cache:sofa:acoes:'), store.chaves('cache:sofa:lin:'), store.chaves('cache:sofa:est:'), store.chaves('cache:sofasum:'));
      ks.slice(0, Math.ceil(ks.length / 2)).forEach((k) => store.del(k));
    }

    async function buscarJSON(url, ms = 15000) {
      const ctl = new AbortController();
      const t = setTimeout(() => ctl.abort(), ms);
      try {
        const r = await fetch(url, { signal: ctl.signal });
        if (!r.ok) throw new Error('HTTP ' + r.status);
        return await r.json();
      } finally { clearTimeout(t); }
    }

    // Cache com validade. Se a rede falhar, devolve o último dado salvo.
    async function comCache(chave, validade, carregar, forcar = false) {
      const c = store.get('cache:' + chave);
      if (c && !forcar && Date.now() - c.t < validade) return c.v;
      try {
        const v = await carregar();
        store.set('cache:' + chave, { t: Date.now(), v });
        return v;
      } catch (e) {
        if (c) return c.v;
        throw e;
      }
    }

    async function emLotes(itens, limite, fn, aoProgredir) {
      let i = 0, feitos = 0, falhas = 0;
      const res = new Array(itens.length);
      async function trabalhador() {
        while (i < itens.length) {
          const k = i++;
          try { res[k] = await fn(itens[k]); } catch (e) { res[k] = null; falhas++; }
          feitos++;
          if (aoProgredir) aoProgredir(feitos, itens.length);
        }
      }
      await Promise.all(Array.from({ length: Math.min(limite, itens.length) }, trabalhador));
      return { res, falhas };
    }

    function baixarArquivo(href, nome) {
      const a = document.createElement('a');
      a.href = href;
      a.download = nome;
      document.body.appendChild(a);
      a.click();
      a.remove();
    }

    /* =========================================================
       4. CAMADA DE DADOS (ESPN)
       ========================================================= */
    function numOuNull(v) {
      if (v == null) return null;
      if (typeof v === 'object') v = v.value ?? v.displayValue;
      const n = Number(v);
      return Number.isFinite(n) ? n : null;
    }

    const FASES_COMP = [
      [/round of 32/i, '16 avos de final'], [/round of 16/i, 'Oitavas de final'], [/quarter/i, 'Quartas de final'],
      [/semi/i, 'Semifinal'], [/^\s*finals?\s*$/i, 'Final'], [/group/i, 'Fase de grupos'], [/playoff|knockout round/i, 'Playoffs'],
      [/first round|1st round/i, 'Primeira fase'], [/second round|2nd round/i, 'Segunda fase'], [/third round|3rd round/i, 'Terceira fase'],
      [/third place/i, 'Disputa do terceiro lugar'],
    ];
    const fasePt = (nome) => { if (!nome) return ''; for (const [re, pt] of FASES_COMP) if (re.test(nome)) return pt; return ''; };

    // Notas da ESPN em inglês ("2nd Leg - Atlético-MG win 3-2 on aggregate") -> português
    function traduzirNota(h, galoNome) {
      if (!h) return { texto: '', classificado: null };
      const quem = (q) => (q.trim() === galoNome || /Atl[eé]tico-MG|Atl[eé]tico Mineiro/i.test(q) ? 'Galo' : q.trim());
      let classificado = null;
      let t = h.replace(/^1st Leg/i, 'Jogo de ida').replace(/^2nd Leg/i, 'Jogo de volta').replace(/\s+-\s+/, '. ');
      t = t.replace(/([^.]+?)\s+(?:wins?|advances?)\s+(\d+)-(\d+)\s+on aggregate/i, (_, q, a, b) => { classificado = quem(q) === 'Galo'; return `${quem(q)} se classificou com ${a} a ${b} no agregado`; })
        .replace(/([^.]+?)\s+(?:wins?|advances?)\s+(\d+)-(\d+)\s+on penalties/i, (_, q, a, b) => { classificado = quem(q) === 'Galo'; return `${quem(q)} se classificou nos pênaltis, ${a} a ${b}`; })
        .replace(/Aggregate:?\s*(\d+)-(\d+)/i, 'Agregado: $1 a $2').replace(/\bwins?\b/i, 'vence').replace(/\.(?=\S)/g, '. ');
      return { texto: t, classificado };
    }

    function normEvento(e, slug) {
      const comp = e.competitions && e.competitions[0];
      if (!comp) return null;
      const cs = comp.competitors || [];
      const casa = cs.find((c) => c.homeAway === 'home') || cs[0];
      const fora = cs.find((c) => c.homeAway === 'away') || cs[1];
      if (!casa || !fora) return null;
      const st = (comp.status && comp.status.type) || {};
      const estado = st.state || 'pre';
      const time = (c) => ({
        id: String((c.team && c.team.id) ?? c.id),
        nome: (c.team && (c.team.displayName || c.team.name)) || '?',
        logo: (c.team && ((c.team.logos && c.team.logos[0] && c.team.logos[0].href) || c.team.logo)) || '',
        gols: estado === 'pre' ? null : numOuNull(c.score),
        venceu: c.winner === true,
      });
      const m = time(casa), v = time(fora);
      const galoCasa = m.id === GALO_ID;
      if (!galoCasa && v.id !== GALO_ID) return null;
      const galo = galoCasa ? m : v, adv = galoCasa ? v : m;
      const encerrado = !!st.completed;
      let resultado = null, penaltis = false;
      if (encerrado && galo.gols != null && adv.gols != null) {
        if (galo.gols > adv.gols) resultado = 'V';
        else if (galo.gols < adv.gols) resultado = 'D';
        else if (galo.venceu || adv.venceu) { penaltis = true; resultado = galo.venceu ? 'V' : 'D'; }
        else resultado = 'E';
      }
      const nota = traduzirNota(((comp.notes || []).find((n) => n.type === 'event' && n.headline) || {}).headline, galo.nome);
      const faseEn = (e.seasonType && e.seasonType.name) || '';
      return {
        id: String(e.id), slug,
        horaDefinida: e.timeValid !== false && comp.timeValid !== false,
        neutro: !!comp.neutralSite || (/^conmebol/.test(slug) && /^\s*final\s*$/i.test(faseEn)),
        nota: nota.texto, classificado: nota.classificado,
        competicao: (COMP[slug] && COMP[slug].nome) || slug,
        curto: (COMP[slug] && COMP[slug].curto) || slug,
        fase: fasePt(e.seasonType && e.seasonType.name),
        data: e.date, estado, encerrado,
        adiado: /postpon|cancel|suspend|abandon/i.test(st.name || ''),
        relogio: (comp.status && comp.status.displayClock) || '',
        estadio: (comp.venue && comp.venue.fullName) || '',
        cidade: (comp.venue && comp.venue.address && comp.venue.address.city) || '',
        mandante: m, visitante: v, galoCasa, adversario: adv,
        golsGalo: galo.gols, golsAdv: adv.gols, resultado, penaltis,
      };
    }

    function carregarPar(slug, temporada, forcar) {
      const validade = temporada >= ANO_ATUAL - 1 ? 20 * 60e3 : 180 * 864e5;
      return comCache(`sched:${slug}:${temporada}`, validade, async () => {
        try {
          const j = await buscarJSON(`${ESPN}${slug}/teams/${GALO_ID}/schedule?season=${temporada}`);
          return (j.events || []).map((e) => normEvento(e, slug)).filter(Boolean);
        } catch (e) {
          if (/HTTP 4\d\d/.test(e.message)) return []; // o Galo não disputou essa competição
          throw e;
        }
      }, forcar);
    }

    async function carregarProximos(forcar) {
      const { res } = await emLotes(COMPETICOES, 7, (c) =>
        comCache(`fix:${c.slug}`, 10 * 60e3, async () => {
          try {
            const j = await buscarJSON(`${ESPN}${c.slug}/teams/${GALO_ID}/schedule?fixture=true`);
            return (j.events || []).map((e) => normEvento(e, c.slug)).filter(Boolean);
          } catch (e) { if (/HTTP 4\d\d/.test(e.message)) return []; throw e; }
        }, forcar));
      return res.filter(Boolean).flat();
    }

    // As temporadas da ESPN nem sempre batem com o ano civil (ex.: Libertadores,
    // Brasileirão 2020). Por isso buscamos o ano anterior também e filtramos pela data.
    async function carregarAno(ano, forcar) {
      if (ano < PRIMEIRO_ANO) return carregarAnoGD(ano);
      const pares = [];
      COMPETICOES.forEach((c) => {
        pares.push([c.slug, ano]);
        if (c.deslocar && ano - 1 >= PRIMEIRO_ANO - 1) pares.push([c.slug, ano - 1]);
      });
      const { res, falhas } = await emLotes(pares, 6, ([s, t]) => carregarPar(s, t, forcar && t >= ANO_ATUAL - 1));
      const eventos = res.filter(Boolean).flat().filter((e) => anoDe(e.data) === ano);
      return { eventos, falhas };
    }

    // Todas as temporadas: ESPN de 2007 em diante e, antes disso, o que o Galo Digital registra
    async function carregarTudo(aoProgredir) {
      const pares = [];
      for (let t = PRIMEIRO_ANO - 1; t <= ANO_ATUAL; t++) COMPETICOES.forEach((c) => pares.push([c.slug, t]));
      const indice = await gdIndiceHistoria().catch(() => ({}));
      const anosGD = Object.keys(indice).map(Number);
      const total = pares.length + anosGD.length;
      const a = await emLotes(pares, 6, ([s, t]) => carregarPar(s, t, false), (f) => aoProgredir && aoProgredir(f, total));
      const b = await emLotes(anosGD, 3, (ano) => carregarAnoGD(ano), (f) => aoProgredir && aoProgredir(pares.length + f, total));
      const espn = a.res.filter(Boolean).flat().filter((e) => anoDe(e.data) >= PRIMEIRO_ANO);
      return { eventos: espn.concat(b.res.filter(Boolean).flatMap((r) => r.eventos)), falhas: a.falhas + b.falhas };
    }

    /* ---------- Súmula: gols, escalações, substituições, estatísticas e lances ---------- */
    const minutoDe = (seg, periodo) => {
      const m = Math.max(1, Math.ceil((seg || 0) / 60));
      return periodo === 1 ? Math.min(m, 45) : m;
    };
    const rotuloMin = (dv) => (dv || '').replace(/'\s*\+\s*(\d+)'?/, "+$1'").trim();
    // "90'+3'" -> 93
    const minutoDoRotulo = (dv) => {
      const m = /(\d+)\s*'?\s*(?:\+\s*(\d+))?/.exec(dv || '');
      return m ? Number(m[1]) + (m[2] ? Number(m[2]) : 0) : null;
    };
    const fmtMin = (m) => (m > 90 ? `90+${m - 90}'` : `${m}'`);

    const PESOS = [
      [/own/i, 0], [/goal|scored/i, 6], [/saved|on-target/i, 3], [/woodwork|post|crossbar/i, 2.5],
      [/miss|off-target/i, 2], [/blocked/i, 1.5], [/corner/i, 1.2], [/offside/i, 0.6],
    ];
    const pesoDe = (tipo) => { for (const [re, p] of PESOS) if (re.test(tipo)) return p; return 0; };

    // Pressão real: finalizações, escanteios e impedimentos de cada time, minuto a minuto.
    function calcularMomento(lances, ehGaloFn) {
      const pts = [];
      let fim = 90;
      lances.forEach((c) => {
        const p = c.play;
        if (!p || !p.team) return;
        const min = minutoDe(c.time && c.time.value != null ? c.time.value : p.clock && p.clock.value, p.period && p.period.number);
        if (min > fim) fim = Math.min(min, 130);
        const w = pesoDe((p.type && (p.type.type || p.type.text)) || '');
        if (w) pts.push({ min, w, galo: ehGaloFn(p.team) });
      });
      if (pts.length < 8) return { fim, serie: null, dominio: null };
      const sig = 4;
      const serie = [];
      let max = 0;
      for (let m = 0; m <= fim; m++) {
        let g = 0, a = 0;
        pts.forEach((p) => {
          const k = Math.exp(-((m - p.min) ** 2) / (2 * sig * sig)) * p.w;
          if (p.galo) g += k; else a += k;
        });
        serie.push({ m, g, a });
        max = Math.max(max, g, a);
      }
      const somaG = pts.filter((p) => p.galo).reduce((s, p) => s + p.w, 0);
      const somaA = pts.filter((p) => !p.galo).reduce((s, p) => s + p.w, 0);
      return {
        fim,
        dominio: Math.round((somaG / (somaG + somaA || 1)) * 100),
        serie: serie.map((s) => ({ minuto: s.m, galo: Math.round((s.g / (max || 1)) * 100), adversario: -Math.round((s.a / (max || 1)) * 100) })),
      };
    }

    // Finalizações com posição em campo. A ESPN usa X/Y de 0 a 100 do ponto de vista de quem ataca:
    // X = distância do próprio gol; Y < 50 é o lado direito de quem ataca.
    function extrairFinalizacoes(lances, ehGaloFn) {
      const out = [];
      lances.forEach((c) => {
        const p = c.play;
        if (!p || !p.team || p.fieldPositionX == null) return;
        const t = ((p.type && p.type.type) || '').toLowerCase();
        let tipo = null;
        if (/own/.test(t)) return;
        if (/goal|scored/.test(t)) tipo = 'gol';
        else if (/on-target|saved/.test(t)) tipo = 'alvo';
        else if (/blocked/.test(t)) tipo = 'bloqueado';
        else if (/off-target|miss|woodwork|post/.test(t)) tipo = 'fora';
        if (!tipo) return;
        out.push({
          lado: ehGaloFn(p.team) ? 'galo' : 'adv', tipo,
          x: p.fieldPositionX, y: p.fieldPositionY, x2: p.fieldPosition2X, y2: p.fieldPosition2Y,
          jogador: (p.participants && p.participants[0] && p.participants[0].athlete && p.participants[0].athlete.displayName) || '',
          rotulo: rotuloMin(p.clock && p.clock.displayValue),
        });
      });
      return out;
    }

    function statsDe(arr) {
      const o = {};
      (arr || []).forEach((x) => { const n = Number(x.value ?? x.displayValue); if (Number.isFinite(n)) o[x.name] = n; });
      return o;
    }

    function normResumo(s, ev) {
      const nomeGalo = (ev.galoCasa ? ev.mandante : ev.visitante).nome;
      const ehGalo = (team) => (team && team.id != null ? String(team.id) === GALO_ID : !!team && team.displayName === nomeGalo);
      const lado = (team) => (team ? (ehGalo(team) ? 'galo' : 'adv') : null);
      const ke = (s.keyEvents || []).filter((k) => !k.shootout);
      const lances = s.commentary || [];
      const momento = calcularMomento(lances, ehGalo);

      const gols = ke.filter((k) => k.scoringPlay).map((k) => {
        const tipo = (k.type && k.type.text) || '';
        const p = k.participants || [];
        return {
          min: minutoDe(k.clock && k.clock.value, k.period && k.period.number),
          rotulo: rotuloMin(k.clock && k.clock.displayValue),
          time: lado(k.team),
          autor: (p[0] && p[0].athlete && p[0].athlete.displayName) || '',
          contra: /own/i.test(tipo),
          penalti: /penal/i.test(tipo),
        };
      });
      const cartoes = ke.filter((k) => /card/i.test((k.type && k.type.text) || '')).map((k) => ({
        rotulo: rotuloMin(k.clock && k.clock.displayValue),
        time: lado(k.team),
        jogador: (k.participants && k.participants[0] && k.participants[0].athlete && k.participants[0].athlete.displayName) || '',
        vermelho: /red/i.test(k.type.text),
      }));

      const fimJogo = Math.max(90, momento.fim || 90);
      const substituicoes = [];
      const jogadores = { galo: [], adv: [] };
      const escalacoes = (s.rosters || []).map((r) => {
        const ld = lado(r.team);
        const todos = (r.roster || []).map((p) => {
          const plays = p.plays || [];
          const trocas = plays.filter((x) => x.substitution).map((x) => minutoDoRotulo(x.clock && x.clock.displayValue)).filter((x) => x != null).sort((a, b) => a - b);
          const verm = plays.find((x) => x.redCard);
          const entrou = !!p.subbedIn;
          return {
            id: String((p.athlete && p.athlete.id) || ''),
            nome: (p.athlete && p.athlete.displayName) || '',
            numero: p.jersey || '',
            pos: (p.position && p.position.abbreviation) || '',
            lugar: Number(p.formationPlace) || 0,
            titular: !!p.starter, entrou, saiu: !!p.subbedOut,
            substituiu: p.subbedInFor && p.subbedInFor.athlete ? String(p.subbedInFor.athlete.id) : null,
            minEntrada: entrou ? (trocas[0] ?? null) : 0,
            minSaida: p.subbedOut ? (entrou ? trocas[1] : trocas[0]) ?? null : null,
            minVermelho: verm ? minutoDoRotulo(verm.clock && verm.clock.displayValue) : null,
            stats: statsDe(p.stats),
          };
        });
        const porId = new Map(todos.map((p) => [p.id, p]));
        todos.forEach((p) => {
          if (p.entrou && p.substituiu) {
            const saiu = porId.get(p.substituiu);
            substituicoes.push({ min: p.minEntrada, lado: ld, entrou: p.nome, saiu: saiu ? saiu.nome : '' });
          }
          if (p.titular || p.entrou) {
            // Minutos jogados no tempo regulamentar (90, ou 120 com prorrogação), sem os acréscimos
            const regulamentar = fimJogo > 105 ? 120 : 90;
            const ini = Math.min(regulamentar, p.titular ? 0 : p.minEntrada ?? regulamentar);
            const fim = Math.min(regulamentar, p.minSaida ?? p.minVermelho ?? regulamentar);
            jogadores[ld === 'galo' ? 'galo' : 'adv'].push({ ...p, minutos: Math.max(p.entrou ? 1 : 0, fim - ini) });
          }
        });
        return {
          lado: ld,
          formacao: r.formation || '',
          titulares: todos.filter((p) => p.titular),
          reservas: todos.filter((p) => !p.titular),
        };
      }).filter((e) => e.titulares.length);
      substituicoes.sort((a, b) => (a.min ?? 0) - (b.min ?? 0));

      const estatisticas = ((s.boxscore && s.boxscore.teams) || []).map((t) => {
        const o = { lado: lado(t.team) };
        (t.statistics || []).forEach((x) => { const n = Number(x.displayValue); if (Number.isFinite(n)) o[x.name] = n; });
        return o;
      });
      let aoVivo = null;
      const hc = s.header && s.header.competitions && s.header.competitions[0];
      if (hc) {
        const cc = hc.competitors || [];
        const casa = cc.find((c) => c.homeAway === 'home'), fora = cc.find((c) => c.homeAway === 'away');
        const stt = (hc.status && hc.status.type) || {};
        aoVivo = {
          estado: stt.state, detalhe: stt.shortDetail || '', relogio: (hc.status && hc.status.displayClock) || '',
          mandante: casa && stt.state !== 'pre' ? numOuNull(casa.score) : null,
          visitante: fora && stt.state !== 'pre' ? numOuNull(fora.score) : null,
        };
      }
      return {
        gols, cartoes, escalacoes, substituicoes, jogadores, estatisticas, aoVivo, fimJogo,
        momento: momento.serie ? momento : null,
        finalizacoes: extrairFinalizacoes(lances, ehGalo),
        publico: (s.gameInfo && s.gameInfo.attendance) || null,
        arbitro: (s.gameInfo && s.gameInfo.officials && s.gameInfo.officials[0] && s.gameInfo.officials[0].displayName) || '',
      };
    }

    // A ESPN continua corrigindo a súmula por horas depois do apito final. Só guardamos de vez
    // uma súmula de jogo encerrado baixada mais de 24 h depois do início; antes disso, renova a cada 15 min.
    // Faltam menos de 6 h para o jogo (ou ele já devia ter começado): hora de procurar a escalação confirmada
    const pertoDoJogo = (ev) => new Date(ev.data).getTime() - Date.now() < 6 * 3600e3;
    const jogoRecente = (ev, horas = 48) => Date.now() - new Date(ev.data).getTime() < horas * 3600e3;
    function carregarResumo(ev, forcar) {
      const c = store.get(`cache:sum4:${ev.id}`);
      const inicio = new Date(ev.data).getTime();
      const definitiva = c && c.v && c.v.aoVivo && c.v.aoVivo.estado === 'post' && c.t - inicio > 24 * 3600e3;
      let validade = definitiva ? 365 * 864e5 : 15 * 60e3;
      if (ev.estado === 'in') validade = 45e3;
      else if (ev.estado === 'pre') validade = pertoDoJogo(ev) ? 2 * 60e3 : 10 * 60e3;
      return comCache(`sum4:${ev.id}`, validade, async () =>
        normResumo(await buscarJSON(`${ESPN}${ev.slug}/summary?event=${ev.id}`), ev), forcar);
    }

    // Último time escalado por qualquer equipe (usado para o adversário nos próximos jogos).
    function carregarUltimoTime(timeId, slugPreferido) {
      return comCache(`ultimo:${timeId}`, 6 * 3600e3, async () => {
        const slugs = [...new Set([slugPreferido, 'bra.1', 'conmebol.sudamericana', 'conmebol.libertadores', 'bra.copa_do_brazil'])];
        const candidatos = [];
        for (const t of [ANO_ATUAL, ANO_ATUAL - 1]) {
          await Promise.all(slugs.map(async (sl) => {
            try {
              const j = await buscarJSON(`${ESPN}${sl}/teams/${timeId}/schedule?season=${t}`);
              (j.events || []).forEach((e) => {
                const c = e.competitions && e.competitions[0];
                if (c && c.status && c.status.type && c.status.type.completed) candidatos.push({ id: e.id, slug: sl, data: e.date, comp: c });
              });
            } catch (e) { /* sem jogos nessa competição */ }
          }));
          if (candidatos.length) break;
        }
        candidatos.sort((a, b) => new Date(b.data) - new Date(a.data));
        for (const c of candidatos.slice(0, 3)) {
          const s = await buscarJSON(`${ESPN}${c.slug}/summary?event=${c.id}`).catch(() => null);
          const r = s && (s.rosters || []).find((x) => String(x.team && x.team.id) === String(timeId));
          const tit = r && (r.roster || []).filter((p) => p.starter);
          if (tit && tit.length >= 11) {
            const outro = (c.comp.competitors || []).find((x) => String(x.team && x.team.id) !== String(timeId));
            const mapa = (p) => ({ nome: (p.athlete && p.athlete.displayName) || '', id: String((p.athlete && p.athlete.id) || ''), numero: p.jersey || '', pos: (p.position && p.position.abbreviation) || '', lugar: Number(p.formationPlace) || 0 });
            return {
              data: c.data, adversario: (outro && outro.team && outro.team.displayName) || '', formacao: r.formation || '',
              titulares: tit.map(mapa), reservas: (r.roster || []).filter((p) => !p.starter).map(mapa),
            };
          }
        }
        return null;
      });
    }

    /* ---------- Jogadores: elencos por temporada + carreira ---------- */
    function normAtleta(a) {
      const st = {};
      ((a.statistics && a.statistics.splits && a.statistics.splits.categories) || []).forEach((c) =>
        (c.stats || []).forEach((s) => { st[s.name] = s.value; }));
      return {
        id: String(a.id), nome: a.displayName || a.fullName || '?', completo: a.fullName || '',
        pos: (a.position && a.position.abbreviation) || '', nasc: a.dateOfBirth || null,
        nac: a.citizenship || '', bandeira: (a.flag && a.flag.href) || '',
        cidade: [a.birthPlace && a.birthPlace.city, a.birthPlace && a.birthPlace.country].filter(Boolean).join(', '),
        numero: a.jersey || '',
        jogos: st.appearances || 0, gols: st.totalGoals || 0, assist: st.goalAssists || 0,
        amarelos: st.yellowCards || 0, vermelhos: st.redCards || 0,
      };
    }

    function carregarElenco(ano) {
      const validade = ano >= ANO_ATUAL ? 864e5 : 365 * 864e5;
      return comCache(`elenco:${ano}`, validade, async () => {
        try {
          const j = await buscarJSON(`${ESPN}bra.1/teams/${GALO_ID}/roster?season=${ano}`);
          return (j.athletes || []).map(normAtleta);
        } catch (e) { if (/HTTP 4\d\d/.test(e.message)) return []; throw e; }
      });
    }

    async function carregarIndice(aoProgredir) {
      const anos = [];
      for (let a = PRIMEIRO_ANO; a <= ANO_ATUAL; a++) anos.push(a);
      const { res, falhas } = await emLotes(anos, 5, (a) => carregarElenco(a), aoProgredir);
      // A ESPN às vezes tem dois cadastros para o mesmo jogador; une por nome + data de nascimento.
      const chaveDe = (p) => (p.nasc ? `${semAcento(p.nome)}|${p.nasc.slice(0, 10)}` : `id:${p.id}`);
      const mapa = new Map();
      anos.forEach((ano, i) => (res[i] || []).forEach((p) => {
        const k = chaveDe(p);
        let j = mapa.get(k);
        if (!j) { j = { ...p, temporadas: [] }; mapa.set(k, j); }
        Object.assign(j, { id: p.id, ids: [...new Set([...(j.ids || []), p.id])], nome: p.nome, completo: p.completo || j.completo, pos: p.pos || j.pos, nasc: p.nasc || j.nasc, nac: p.nac || j.nac, bandeira: p.bandeira || j.bandeira, cidade: p.cidade || j.cidade });
        const tp = { ano, numero: p.numero, jogos: p.jogos, gols: p.gols, assist: p.assist, amarelos: p.amarelos, vermelhos: p.vermelhos };
        const mesmoAno = j.temporadas.find((t) => t.ano === ano);
        if (!mesmoAno) j.temporadas.push(tp);
        else if (tp.jogos > mesmoAno.jogos) Object.assign(mesmoAno, tp);
      }));
      const lista = [...mapa.values()].map((j) => {
        const anosJ = j.temporadas.map((t) => t.ano);
        return {
          ...j,
          jogos: j.temporadas.reduce((s, t) => s + t.jogos, 0),
          gols: j.temporadas.reduce((s, t) => s + t.gols, 0),
          assist: j.temporadas.reduce((s, t) => s + t.assist, 0),
          amarelos: j.temporadas.reduce((s, t) => s + t.amarelos, 0),
          vermelhos: j.temporadas.reduce((s, t) => s + t.vermelhos, 0),
          primeiro: Math.min(...anosJ), ultimo: Math.max(...anosJ),
          atual: anosJ.includes(ANO_ATUAL),
        };
      });
      return { lista, falhas };
    }

    function carregarCarreira(id) {
      return comCache(`atleta:${id}`, 7 * 864e5, async () => {
        const [a, s] = await Promise.all([
          buscarJSON(ESPN_ATLETA + id).catch(() => null),
          buscarJSON(ESPN_ATLETA + id + '/stats').catch(() => null),
        ]);
        if (!a && !s) throw new Error('sem dados');
        const at = (a && a.athlete) || {};
        const filtro = s && (s.filters || []).find((f) => f.name === 'team');
        const clubes = ((filtro && filtro.options) || []).map((o) => ({ id: String(o.value), nome: o.displayValue }));
        return {
          clubeAtual: (at.team && at.team.displayName) || null,
          clubeAtualId: at.team && at.team.id != null ? String(at.team.id) : null,
          idade: at.age ?? null, altura: at.displayHeight || '', foto: (at.headshot && at.headshot.href) || '',
          clubes,
        };
      });
    }

    // Elenco de qualquer time numa temporada (a ESPN tem os times do Brasileirão)
    function carregarElencoTime(timeId, ano) {
      if (String(timeId) === GALO_ID) return carregarElenco(ano);
      return comCache(`elencoT:${timeId}:${ano}`, ano >= ANO_ATUAL ? 864e5 : 365 * 864e5, async () => {
        try {
          const j = await buscarJSON(`${ESPN}bra.1/teams/${timeId}/roster?season=${ano}`);
          return (j.athletes || []).map(normAtleta);
        } catch (e) { if (/HTTP 4\d\d/.test(e.message)) return []; throw e; }
      });
    }

    // Estatísticas da ESPN por jogador. Rótulos: STRT titular, FC/FA faltas, YC/RC cartões, G, A, SHOT, SOG, OF.
    const ROTULOS_ESPN = { STRT: 'titular', FC: 'faltas', FA: 'sofridas', YC: 'amarelos', RC: 'vermelhos', G: 'gols', A: 'assist', SHOT: 'fin', SOG: 'alvo', OF: 'imp' };
    const mapearLinha = (rotulos, valores) => {
      const o = {};
      (rotulos || []).forEach((n, i) => { const k = ROTULOS_ESPN[n]; if (k) o[k] = Number(valores[i]) || 0; });
      return o;
    };
    const NOMES_LIGA = {
      'Futebol Brasileiro': 'Brasileirão', 'Brasileiro Serie A': 'Brasileirão', 'Brazil Serie A': 'Brasileirão', 'CONMEBOL Libertadores': 'Libertadores',
      'CONMEBOL Sudamericana': 'Sul-Americana', 'Campeonato Mineiro': 'Mineiro', 'Brazilian Campeonato Mineiro': 'Mineiro', 'Copa Do Brazil': 'Copa do Brasil',
    };
    const nomeLiga = (s) => { const t = (s || '').replace(/^\d{4}\s*/, '').trim(); return NOMES_LIGA[t] || t; };
    const alturaCm = (txt) => { const m = /(\d+)'\s*(\d+)/.exec(txt || ''); return m ? Math.round((Number(m[1]) * 12 + Number(m[2])) * 2.54) : null; };
    const pesoKg = (txt) => { const m = /(\d+)\s*lbs/.exec(txt || ''); return m ? Math.round(Number(m[1]) * 0.4536) : null; };

    // Perfil: dados pessoais, clubes e temporada atual por competição (qualquer time)
    function carregarPerfil(id) {
      return comCache(`perfil:${id}`, 2 * 864e5, async () => {
        const [a, ov, st] = await Promise.all([
          buscarJSON(ESPN_ATLETA + id).catch(() => null),
          buscarJSON(ESPN_ATLETA + id + '/overview').catch(() => null),
          buscarJSON(ESPN_ATLETA + id + '/stats').catch(() => null),
        ]);
        if (!a && !ov && !st) throw new Error('sem dados');
        const at = (a && a.athlete) || {};
        const e = ov && ov.statistics;
        const filtro = st && (st.filters || []).find((f) => f.name === 'team');
        return {
          nome: at.displayName || '', completo: at.fullName || '', pos: posPt((at.position && at.position.abbreviation) || ''),
          idade: at.age ?? null, nascimento: at.displayDOB || '', nasc: at.dateOfBirth || null, local: at.displayBirthPlace || '',
          altura: alturaCm(at.displayHeight), peso: pesoKg(at.displayWeight), nac: at.citizenship || '',
          foto: (at.headshot && at.headshot.href) || '', camisa: at.jersey || '',
          clubeAtual: (at.team && at.team.displayName) || null, clubeAtualId: at.team && at.team.id != null ? String(at.team.id) : null,
          clubes: ((filtro && filtro.options) || []).map((o) => ({ id: String(o.value), nome: o.displayValue })),
          temporada: ((e && e.splits) || []).map((s) => ({
            ano: Number(String(s.displayName || '').slice(0, 4)) || null, comp: nomeLiga(s.displayName),
            teamId: String(s.teamId), liga: s.leagueSlug, s: mapearLinha(e.labels, s.stats),
          })),
        };
      });
    }

    // Histórico ano a ano de um jogador num time e numa competição
    function carregarHistoricoNoTime(id, teamId, liga) {
      return comCache(`hist:${id}:${teamId}:${liga}`, 864e5, async () => {
        const j = await buscarJSON(`${ESPN_ATLETA}${id}/stats?team=${teamId}&league=${liga}`);
        const cat = (j.categories || [])[0];
        if (!cat) return [];
        return (cat.statistics || [])
          .filter((r) => String(r.teamId) === String(teamId))
          .map((r) => ({ ano: r.season && r.season.year, liga: r.leagueSlug, comp: (COMP[r.leagueSlug] && COMP[r.leagueSlug].curto) || r.leagueSlug, s: mapearLinha(cat.labels, r.stats) }));
      });
    }

    /* ---------- Galo Digital (Enciclopédia em MediaWiki) ----------
       A API pública responde a páginas abertas pelo arquivo (origem "null") quando a
       URL leva origin=*. Conteúdo sob licença CC BY-NC-ND: uso pessoal, sempre com link. */
    const GD_SITE = 'https://www.galodigital.com.br';
    const GD_API = GD_SITE + '/w/api.php?format=json&formatversion=2&origin=*&';
    const gdUrl = (titulo) => `${GD_SITE}/enciclopedia/${encodeURIComponent((titulo || '').replace(/ /g, '_')).replace(/%2F/g, '/')}`;
    const gdApi = (params) => buscarJSON(GD_API + params, 20000);
    const dataLocal = (iso) => new Intl.DateTimeFormat('en-CA', { timeZone: TZ, year: 'numeric', month: '2-digit', day: '2-digit' }).format(new Date(iso));
    const isoDe = (d, m, a) => `${a}-${String(m).padStart(2, '0')}-${String(d).padStart(2, '0')}`;

    async function gdWikitexto(titulo, secao) {
      const j = await gdApi(`action=parse&prop=wikitext&redirects=1&page=${encodeURIComponent(titulo)}${secao != null ? `&section=${secao}` : ''}`);
      if (j.error) { if (j.error.code === 'missingtitle' || j.error.code === 'invalidtitle') return null; throw new Error(j.error.info || 'erro no Galo Digital'); }
      return { titulo: j.parse.title, texto: j.parse.wikitext || '' };
    }

    // Wikitexto -> texto simples
    function gdLimpar(s) {
      let t = (s || '').replace(/<!--[\s\S]*?-->/g, '').replace(/<br\s*\/?>/gi, ', ').replace(/<[^>]+>/g, '');
      t = t.replace(/\[\[(?:Arquivo|Imagem|File|Image):[^\]]*\]\]/gi, '');
      t = t.replace(/\{\{\s*Tooltip\s*\|([^|}]*)\|[^}]*\}\}/gi, '$1');
      for (let i = 0; i < 3; i++) t = t.replace(/\{\{[^{}]*\}\}/g, '');
      t = t.replace(/\[\[(?:[^\]|]*\|)?([^\]]*)\]\]/g, '$1')
        .replace(/\[https?:\/\/\S+\s+([^\]]*)\]/g, '$1').replace(/\[https?:\/\/\S+\]/g, '')
        .replace(/'{2,}/g, '').replace(/&nbsp;/g, ' ').replace(/\s+/g, ' ')
        .replace(/\s+([,.;])/g, '$1').replace(/;\s*,/g, ';').replace(/(,\s*){2,}/g, ', ').replace(/^[\s,;:.]+|[\s,;:-]+$/g, '');
      return t.trim();
    }
    const gdNumero = (s) => { const m = /-?\d[\d.]*/.exec(gdLimpar(s)); return m ? Number(m[0].replace(/\./g, '')) : null; };

    // Parâmetros de uma predefinição: {{Nome | a = 1 | b = 2}} -> {a: '1', b: '2'}
    function gdParametros(texto, nomeModelo) {
      const i = (texto || '').search(new RegExp('\\{\\{\\s*' + nomeModelo, 'i'));
      if (i < 0) return null;
      let n = 0, j = i;
      for (; j < texto.length - 1; j++) {
        if (texto[j] === '{' && texto[j + 1] === '{') { n++; j++; }
        else if (texto[j] === '}' && texto[j + 1] === '}') { n--; j++; if (n === 0) break; }
      }
      const corpo = texto.slice(i + 2, j - 1);
      const partes = [];
      let prof = 0, ini = 0;
      for (let k = 0; k < corpo.length; k++) {
        const c2 = corpo.substr(k, 2);
        if (c2 === '{{' || c2 === '[[') { prof++; k++; }
        else if (c2 === '}}' || c2 === ']]') { prof--; k++; }
        else if (corpo[k] === '|' && prof === 0) { partes.push(corpo.slice(ini, k)); ini = k + 1; }
      }
      partes.push(corpo.slice(ini));
      const p = {};
      partes.slice(1).forEach((x) => { const e = x.indexOf('='); if (e > 0) p[x.slice(0, e).trim().toLowerCase()] = x.slice(e + 1).trim(); });
      return p;
    }

    // Seções "== Título ==" de uma página
    function gdSecoes(texto) {
      const out = [];
      const re = /^(={1,4})\s*(.+?)\s*\1\s*$/gm;
      let m, ult = null;
      while ((m = re.exec(texto || ''))) {
        if (ult) ult.texto = texto.slice(ult.fim, m.index);
        ult = { titulo: gdLimpar(m[2]), nivel: m[1].length, fim: re.lastIndex };
        out.push(ult);
      }
      if (ult) ult.texto = texto.slice(ult.fim);
      return out;
    }

    // Linhas de uma wikitable com nome + 7 números (Jogos, V, E, D, GP, GC, SG)
    function gdTabelaRetrospecto(texto) {
      const linhas = [];
      (texto || '').split(/\n\|-(?![\d])/).forEach((bloco) => {
        const cel = [];
        bloco.split('\n').forEach((l) => {
          if (!/^[!|]/.test(l) || /^\|\}|^\|\+(?!\d)/.test(l)) return;
          l.slice(1).split(/!!|\|\|/).forEach((c) => {
            let x = c.replace(/\[\[(?:[^\]|]*\|)?([^\]]*)\]\]/g, '$1');
            const k = x.indexOf('|');
            if (k >= 0 && /=/.test(x.slice(0, k))) x = x.slice(k + 1);
            cel.push(gdLimpar(x));
          });
        });
        const nums = cel.slice(-7);
        if (cel.length >= 8 && nums.every((v) => /^[+-]?\d+$/.test(v))) {
          const [jogos, v, e, d, gp, gc, sg] = nums.map(Number);
          linhas.push({ nome: cel[cel.length - 8], jogos, v, e, d, gp, gc, sg });
        }
      });
      return linhas;
    }

    // ---- Atletas ----
    const anoNoTexto = (s) => { const a = (gdLimpar(s || '').match(/\b(19|20)\d{2}\b/g) || []).map(Number).filter((y) => y >= 1900 && y <= ANO_ATUAL); return a.length ? a[a.length - 1] : null; };
    const MESES_PT = ['janeiro', 'fevereiro', 'marco', 'abril', 'maio', 'junho', 'julho', 'agosto', 'setembro', 'outubro', 'novembro', 'dezembro'];
    // Páginas antigas sem o quadro "Info Atletas": seções "Ficha Técnica", "Carreira" e o texto da biografia
    function gdLerAtletaTexto(titulo, texto) {
      const secao = (nome) => { const m = new RegExp('==\\s*' + nome + '\\s*==([\\s\\S]*?)(?=\\n==[^=]|$)', 'i').exec(texto || ''); return m ? m[1] : null; };
      const ficha = secao('Ficha T[ée]cnica'), carreira = secao('Carreira');
      if (!ficha && !carreira) return null;
      const campo = (rot) => { const m = new RegExp("'''\\s*" + rot + "\\s*:?\\s*'''\\s*:?([^\\n]*)", 'i').exec(ficha || ''); return m ? gdLimpar(m[1]) : ''; };
      const anos = [];
      (carreira || '').split('\n').filter((l) => /'''\s*Atl[eé]tico\s*'''/.test(l)).forEach((l) => (gdLimpar(l).match(/\b(19|20)\d{2}\b/g) || []).forEach((y) => anos.push(Number(y))));
      const bio = (secao('Biografia') || (texto || '').split(/\n==/)[0]).replace(/\[\[(?:[^\]|]*\|)?([^\]]*)\]\]/g, '$1');
      const apelido = /mais conhecid[oa]s?\s+(?:como|por)\s+'''([^']+)'''/i.exec(bio);
      const frase = bio.split(/(?<=[.!?])\s+/).find((f) => /\d+\s+(jogos|partidas)/i.test(f)) || '';
      const nj = /(\d+)\s+(?:jogos|partidas)/i.exec(frase);
      const ng = /n[aã]o marcou (?:nenhum )?gols?/i.test(frase) ? ['', '0'] : /\b(\d+|um)\s+gols?\b/i.exec(frase);
      const dn = /(\d{1,2})\s+de\s+([a-zç]+)\s+de\s+(\d{4})/i.exec(semAcento(campo('Data de Nascimento')));
      const mes = dn ? MESES_PT.indexOf(dn[2].replace('ç', 'c')) + 1 : 0;
      const titulos = (secao('T[íi]tulos') || '').split('\n').map((l) => gdLimpar(l).replace(/\s*-\s*Atl[eé]tico\s*$/i, '')).filter((l) => /^\d{4}/.test(l));
      const de = anos.length ? Math.min(...anos) : null, ate = anos.length ? Math.max(...anos) : null;
      return {
        titulo, url: gdUrl(titulo), nome: apelido ? gdLimpar(apelido[1]) : titulo, completo: campo('Nome') || titulo,
        nasc: dn && mes ? isoDe(dn[1], mes, dn[3]) : null, anoNasc: anoNoTexto(campo('Data de Nascimento')),
        cidade: campo('Local'), posicao: campo('Posi[çc][ãa]o'),
        jogos: nj ? Number(nj[1]) : null, gols: ng ? (/^um$/i.test(ng[1]) ? 1 : Number(ng[1] || ng[0].replace(/\D/g, '') || 0)) : null, v: null, e: null, d: null,
        estreia: '', ultimo: '', titulos: titulos.join('; '), obs: '', revelado: '', atual: '',
        periodo: de ? (ate !== de ? `${de} a ${ate}` : String(de)) : '', anoEstreia: de, anoUltimo: ate, doTexto: true,
        arquivo: null, foto: null,
      };
    }
    function gdLerAtleta(titulo, texto) {
      const p = gdParametros(texto, 'Info Atletas');
      if (!p) return gdLerAtletaTexto(titulo, texto);
      const nasc = /(\d{1,2})\s*\|\s*(\d{1,2})\s*\|\s*(\d{4})/.exec(p.data_nascimento || '');
      const arq = /\[\[(?:Arquivo|Imagem|File|Image):([^|\]]+)/i.exec(p.imagem || '');
      const url = /(https?:\/\/[^\s|\]]+\.(?:jpe?g|png|gif))/i.exec(p.imagem || '');
      return {
        titulo, url: gdUrl(titulo),
        nome: gdLimpar(p.apelido) || titulo, completo: gdLimpar(p.nomecompleto) || titulo,
        nasc: nasc ? isoDe(nasc[1], nasc[2], nasc[3]) : null,
        cidade: gdLimpar(p.cidadenatal), posicao: gdLimpar(p['posição'] || p.posicao),
        jogos: gdNumero(p.jogos), gols: gdNumero(p.gols), v: gdNumero(p.vitorias), e: gdNumero(p.empates), d: gdNumero(p.derrotas),
        estreia: gdLimpar(p.estreia), ultimo: gdLimpar(p.ultjogo), titulos: gdLimpar(p.titulos), obs: gdLimpar(p.obs),
        revelado: gdLimpar(p.revelado), atual: gdLimpar(p.atualclube),
        arquivo: arq ? arq[1].trim() : null, foto: url ? url[1].replace(/^http:/, 'https:') : null,
        anoEstreia: anoNoTexto(p.estreia), anoUltimo: anoNoTexto(p.ultjogo), anoNasc: nasc ? Number(nasc[3]) : null,
      };
    }

    async function gdFotoDe(a) {
      if (!a || a.foto || !a.arquivo) return a;
      try {
        const j = await gdApi(`action=query&prop=imageinfo&iiprop=url&iiurlwidth=240&titles=${encodeURIComponent('Arquivo:' + a.arquivo)}`);
        const ii = j.query && j.query.pages && j.query.pages[0] && j.query.pages[0].imageinfo && j.query.pages[0].imageinfo[0];
        if (ii) a.foto = (ii.thumburl || ii.url || '').replace(/^http:/, 'https:') || null;
      } catch (e) {}
      return a;
    }

    // Acha a página do atleta pelo nome (e confere a data de nascimento quando houver)
    function carregarAtletaGD({ titulo, nome, nasc }) {
      const dn = nasc ? String(nasc).slice(0, 10) : null;
      const chave = titulo ? 't:' + titulo : 'n:' + semAcento(nome) + '|' + (dn || '');
      return comCache('gd:atleta:' + chave, 7 * 864e5, async () => {
        const ler = async (t) => { const w = await gdWikitexto(t); return w ? gdLerAtleta(w.titulo, w.texto) : null; };
        if (titulo) return gdFotoDe(await ler(titulo));
        const direto = await ler(nome);
        const bate = (a) => a && (!dn || !a.nasc || a.nasc === dn);
        if (bate(direto)) return gdFotoDe(direto);
        const busca = await gdApi(`action=query&list=search&srlimit=8&srnamespace=0&srsearch=${encodeURIComponent(nome)}`);
        const cands = ((busca.query && busca.query.search) || []).map((x) => x.title)
          .filter((t) => !/^\d/.test(t) && !/^Estat[ií]sticas/i.test(t) && !/Desambigua/i.test(t) && (!direto || t !== direto.titulo));
        const alvo = semAcento(nome);
        for (const t of cands.slice(0, 4)) {
          const b = await ler(t);
          if (!b) continue;
          if (dn ? b.nasc === dn : semAcento(b.nome).split(/,\s*/).includes(alvo) || semAcento(b.completo) === alvo) return gdFotoDe(b);
        }
        return null;
      });
    }

    // ---- Partidas ----
    function gdLerPartidas(texto) {
      const vistos = new Set(), out = [];
      (texto || '').split(/\n\|-/).forEach((linha) => {
        const t = /\[\[(\d{6}[A-Z0-9]*\s[^\]|]+?)\s*(?:\||\]\])/.exec(linha);
        const d = /(\d{1,2})\/(\d{1,2})\]\]\s*\/\s*\[\[(\d{4})/.exec(linha) || /(\d{1,2})\/(\d{1,2})\/(\d{4})/.exec(linha);
        if (t && d && !vistos.has(t[1])) { vistos.add(t[1]); out.push({ titulo: t[1].trim(), data: isoDe(d[1], d[2], d[3]) }); }
      });
      return out;
    }

    function gdPartidasDaTemporada(ano) {
      return comCache('gd:temp:' + ano, ano >= ANO_ATUAL ? 6 * 3600e3 : 30 * 864e5, async () => {
        const titulo = `Futebol Profissional - Temporada ${ano}`;
        const s = await gdApi(`action=parse&prop=sections&redirects=1&page=${encodeURIComponent(titulo)}`);
        if (s.error) return [];
        const sec = (s.parse.sections || []).find((x) => /Partidas Realizadas/i.test(x.line)) || (s.parse.sections || []).find((x) => /Partidas/i.test(x.line));
        const w = await gdWikitexto(titulo, sec ? sec.index : undefined);
        return gdLerPartidas(w ? w.texto : '');
      });
    }

    async function gdAcharPartida(ev) {
      const dia = dataLocal(ev.data);
      const ano = Number(dia.slice(0, 4));
      const palavras = semAcento(ev.adversario.nome).split(/[\s/-]+/).filter((p) => p.length >= 4);
      const bateNome = (t) => !palavras.length || palavras.some((p) => semAcento(t).includes(p));
      for (const a of [ano, ano - 1]) {
        if (a < 1908) break;
        const lista = await gdPartidasDaTemporada(a);
        const exata = lista.find((p) => p.data === dia && bateNome(p.titulo)) || lista.find((p) => p.data === dia);
        if (exata) return exata;
        const perto = lista.find((p) => Math.abs(new Date(p.data) - new Date(dia)) <= 864e5 && bateNome(p.titulo));
        if (perto) return perto;
      }
      return null;
    }

    // Uma linha da ficha: "'''7.''' [[Página|Nome]] {{Subst}} ('''23.''' [[Outro|Índio]], 77')"
    function gdMarcas(txt) {
      let gols = 0;
      (txt.match(/\{\{\s*Bola(\d)?/gi) || []).forEach((m) => { const n = /(\d)$/.exec(m); gols += n ? Number(n[1]) : 1; });
      const contra = /\(\s*contra\s*\)/i.test(txt) ? Math.min(gols, 1) : 0;
      return {
        gols: gols - contra, contra,
        amarelo: /\{\{\s*(?:Bola)?CA/i.test(txt),
        vermelho: /\{\{\s*[A-Za-z]*(?:CAAV|CAV|CV)\b|\{\{\s*Vermelho/i.test(txt),
      };
    }
    function gdPessoa(txt) {
      const num = /'''\s*([\d?]+)\s*\.?\s*'''/.exec(txt);
      const link = /\[\[([^\]|]+)(?:\|([^\]]+))?\]\]/.exec(txt);
      let nome = link ? gdLimpar(link[2] || link[1]) : gdLimpar(txt.replace(/'''[^']*'''/, '').replace(/\{\{[^}]*\}\}/g, ''));
      nome = nome.replace(/,?\s*\d+\s*(?:\+\s*\d+)?\s*'.*$/, '').replace(/\(.*$/, '').replace(/^\?\s*\.?\s*/, '').trim();
      return { numero: num && num[1] !== '?' ? num[1] : '', nome, gd: link ? link[1].trim() : null };
    }
    function gdLerLinhaJogador(valor) {
      const k = valor.search(/\(\s*'''/);
      if (k < 0) return { ...gdPessoa(valor), ...gdMarcas(valor), sub: null };
      let prof = 0, fim = valor.length;
      for (let i = k; i < valor.length; i++) {
        if (valor[i] === '(') prof++;
        else if (valor[i] === ')') { prof--; if (prof === 0) { fim = i; break; } }
      }
      const dentro = valor.slice(k + 1, fim), depois = valor.slice(fim + 1);
      const min = /(\d+)\s*(?:\+\s*(\d+))?\s*'/.exec(dentro.replace(/\[\[[^\]]*\]\]/g, ''));
      return {
        ...gdPessoa(valor.slice(0, k)), ...gdMarcas(valor.slice(0, k)),
        sub: { ...gdPessoa(dentro), ...gdMarcas(dentro + depois), min: min ? Number(min[1]) + (min[2] ? Number(min[2]) : 0) : null },
      };
    }

    function gdLerFicha(titulo, texto) {
      const p = gdParametros(texto, 'Ficha T');
      if (!p) return null;
      const time = (prefixo, reservas) => {
        const tit = [];
        for (let i = 1; i <= 11; i++) if (p[prefixo + i] && gdLimpar(p[prefixo + i])) tit.push(gdLerLinhaJogador(p[prefixo + i]));
        const usados = new Set(tit.filter((t) => t.sub).map((t) => semAcento(t.sub.nome)));
        const res = (p[reservas] || '').split(/<br\s*\/?>|\n/i).map((x) => x.trim()).filter((x) => gdLimpar(x))
          .map(gdPessoa).filter((r) => r.nome && !usados.has(semAcento(r.nome)));
        return { titulares: tit, banco: res };
      };
      const advLink = /\[\[([^\]|]+)/.exec(p.adversario || '');
      let advPagina = advLink ? advLink[1].trim() : null;
      if (!advPagina) {
        const lados = titulo.replace(/^\S+\s+/, '').split(/\s+x\s+/).map((s) => s.replace(/\s*\d+\s*$/, '').replace(/^\s*\d+\s*/, '').trim());
        advPagina = lados.find((s) => !/^Atl[eé]tico$/i.test(s)) || null;
      }
      return {
        titulo, url: gdUrl(titulo), resultado: gdLimpar(p.resultado), motivo: gdLimpar(p.motivo),
        estadio: gdLimpar(p['estádio'] || p.estadio), local: gdLimpar(p.local), arbitro: gdLimpar(p.arbitro || p['árbitro']),
        publico: gdLimpar(p.publicopagante || p['público'] || p.publico), renda: gdLimpar(p.renda),
        tecnicoGalo: gdLimpar(p.tecnicogalo), tecnicoAdv: gdLimpar(p.tecnicoadversario),
        advPagina, galo: time('galo', 'rgalo'), adv: time('adversario', 'radversario'),
      };
    }

    // Ficha técnica do jogo no Galo Digital. Sem ficha (jogo recente ainda não escrito): tenta de novo em 6 h
    async function carregarJogoGD(ev) {
      const chave = 'cache:gd:jogo:' + ev.id;
      const c = store.get(chave);
      const validade = !c || !c.v ? 6 * 3600e3 : Date.now() - new Date(ev.data).getTime() < 10 * 864e5 ? 12 * 3600e3 : 30 * 864e5;
      if (c && Date.now() - c.t < validade) return c.v;
      try {
        const par = ev.gdTitulo ? { titulo: ev.gdTitulo } : ev.fonte === 'gd' ? null : await gdAcharPartida(ev);
        const w = par ? await gdWikitexto(par.titulo) : null;
        const f = w ? gdLerFicha(w.titulo, w.texto) : null;
        if (f && f.advPagina) store.set('gdadv:' + ev.adversario.id, f.advPagina);
        store.set(chave, { t: Date.now(), v: f });
        return f;
      } catch (e) {
        if (c) return c.v;
        throw e;
      }
    }

    // Converte a ficha do Galo Digital no mesmo formato das escalações da ESPN
    function formacaoPadraoGD(ano) { return ano >= 2005 ? '4-2-3-1' : ano >= 1985 ? '4-4-2' : '4-3-3'; }
    function gdEscalacao(t, lado, formacao) {
      const contagens = (formacao || '').split('-').map(Number).filter((n) => n > 0);
      const codigo = (li) => (li === 0 ? 'D' : li === contagens.length - 1 ? 'F' : contagens.length === 3 ? 'M' : li === 1 ? 'DM' : 'AM');
      const linhaDe = [];
      contagens.forEach((n, li) => { for (let k = 0; k < n; k++) linhaDe.push(codigo(li)); });
      const titulares = t.titulares.map((j, i) => ({
        id: `gd-${lado}-${i}`, nome: j.nome, numero: j.numero, gd: j.gd,
        pos: i === 0 ? 'G' : linhaDe[i - 1] || 'M', lugar: -i,
        titular: true, entrou: false, saiu: !!j.sub, substituiu: null, minEntrada: 0, minSaida: j.sub ? j.sub.min : null,
        minVermelho: j.vermelho ? 90 : null, semMinuto: false, gdJogo: { gols: j.gols, contra: j.contra, amarelo: j.amarelo, vermelho: j.vermelho },
      }));
      const reservas = [], substituicoes = [];
      t.titulares.forEach((j, i) => {
        if (!j.sub) return;
        reservas.push({
          id: `gd-${lado}-e${i}`, nome: j.sub.nome, numero: j.sub.numero, gd: j.sub.gd, pos: titulares[i].pos, lugar: -i,
          titular: false, entrou: true, saiu: false, substituiu: titulares[i].id, minEntrada: j.sub.min, semMinuto: j.sub.min == null,
          minVermelho: j.sub.vermelho ? 90 : null, gdJogo: { gols: j.sub.gols, contra: j.sub.contra, amarelo: j.sub.amarelo, vermelho: j.sub.vermelho },
        });
        substituicoes.push({ min: j.sub.min, lado, entrou: j.sub.nome, saiu: j.nome });
      });
      t.banco.forEach((j, k) => reservas.push({ id: `gd-${lado}-b${k}`, nome: j.nome, numero: j.numero, gd: j.gd, pos: '', lugar: 0, titular: false, entrou: false }));
      return { esc: { lado, formacao, titulares, reservas, fonte: 'gd' }, substituicoes };
    }
    function resumoComGD(resumo, ficha, formGalo, formAdv) {
      const g = gdEscalacao(ficha.galo, 'galo', formGalo), a = gdEscalacao(ficha.adv, 'adv', formAdv);
      const escalacoes = [g.esc, a.esc].filter((e) => e.titulares.length >= 7);
      return {
        ...(resumo || {}), escalacoes, fonteEscalacao: 'gd', fimJogo: Math.max(90, (resumo && resumo.fimJogo) || 90),
        substituicoes: g.substituicoes.concat(a.substituicoes).sort((x, y) => (x.min ?? 99) - (y.min ?? 99)),
      };
    }

    // ---- Confrontos ----
    const GD_PREFERENCIA_UF = ['RJ', 'SP', 'RS', 'PR', 'BA', 'PE', 'CE', 'GO', 'SC', 'ARG', 'URU', 'PAR', 'CHI', 'COL', 'EQU', 'PER', 'BOL', 'VEN', 'MT', 'MS', 'DF', 'ES', 'PA', 'AM', 'MG'];
    const GD_APELIDOS = { 'vasco da gama': 'Vasco-RJ', 'red bull bragantino': 'Bragantino-SP', 'athletico paranaense': 'Athlético-PR', 'atletico paranaense': 'Athlético-PR', 'athletico-pr': 'Athlético-PR', 'atletico goianiense': 'Atlético-GO', 'sport recife': 'Sport-PE', 'america mineiro': 'América-MG' };
    function gdListaConfrontos() {
      return comCache('gd:confrontos', 30 * 864e5, async () => {
        const out = [];
        let cont = '';
        for (let i = 0; i < 4; i++) {
          const j = await gdApi(`action=query&list=categorymembers&cmtitle=${encodeURIComponent('Categoria:Confrontos - Futebol Profissional')}&cmlimit=500&cmnamespace=0${cont}`);
          ((j.query && j.query.categorymembers) || []).forEach((m) => out.push(m.title));
          if (!j.continue) break;
          cont = '&cmcontinue=' + encodeURIComponent(j.continue.cmcontinue);
        }
        return out;
      });
    }
    async function gdPaginaAdversario(adv) {
      const salvo = store.get('gdadv:' + adv.id);
      if (salvo) return salvo;
      const lista = await gdListaConfrontos();
      const alvo = semAcento(adv.nome);
      if (GD_APELIDOS[alvo]) return GD_APELIDOS[alvo];
      const base = (t) => semAcento(t.replace(/\s*-\s*[A-Z]{2,3}$/, ''));
      let c = lista.filter((t) => base(t) === alvo || semAcento(t) === alvo);
      if (!c.length) c = lista.filter((t) => base(t).startsWith(alvo) || alvo.startsWith(base(t) + ' '));
      if (!c.length) return null;
      const uf = (t) => { const m = /-([A-Z]{2,3})$/.exec(t); const i = m ? GD_PREFERENCIA_UF.indexOf(m[1]) : -1; return i < 0 ? 99 : i; };
      return [...c].sort((a, b) => uf(a) - uf(b))[0];
    }
    function carregarConfrontoGD(pagina) {
      return comCache('gd:conf:' + pagina, 7 * 864e5, async () => {
        const w = await gdWikitexto(pagina);
        if (!w) return null;
        const secs = gdSecoes(w.texto);
        const sec = (re) => secs.find((s) => re.test(s.titulo));
        const hist = sec(/Retrospecto na Hist/i);
        const total = hist ? gdTabelaRetrospecto(hist.texto)[0] : null;
        const torneios = sec(/Retrospecto em (Torneios|Campeonatos|Competi)/i);
        const atual = /Atualizado em:?\s*'*\s*'*\s*([^\n]+)/i.exec(w.texto);
        return {
          titulo: w.titulo, url: gdUrl(w.titulo), total,
          torneios: torneios ? gdTabelaRetrospecto(torneios.texto).filter((l) => !/^total/i.test(l.nome)) : [],
          atualizado: atual ? gdLimpar(atual[1]).replace(/[.,]$/, '') : '',
        };
      });
    }

    /* ---------- Sofascore: mapa de calor e passes de cada jogador ----------
       A API do site responde a páginas abertas pelo arquivo (origem "null").
       Mapa de calor nos jogos do Galo desde 2016; cada passe com origem e destino, desde 2026.
       Coordenadas de 0 a 100 do ponto de vista de quem ataca: x = 0 no próprio gol, y < 50 = lado direito. */
    const SOFA_API = 'https://www.sofascore.com/api/v1/';
    const SOFA_GALO = 1977;
    // O Sofascore recusa (403) pedidos vindos de sites publicados; depois do primeiro 403 o app para de tentar
    let sofaBloqueado = false;
    const sofaApi = async (p) => {
      if (sofaBloqueado) throw new Error('HTTP 403');
      try { return await buscarJSON(SOFA_API + p, 15000); } catch (e) { if (/HTTP 403/.test(e.message)) sofaBloqueado = true; throw e; }
    };
    const nuloSe404 = (e) => { if (/HTTP 404/.test(e.message)) return null; throw e; };
    const sofaParaCampo = (time, x, y) => espelhar(time, (x / 100) * L, (1 - y / 100) * A);

    // Páginas de jogos do Galo (30 por página, da mais recente para trás); só em memória
    const sofaPaginas = new Map();
    async function sofaPagina(p) {
      const c = sofaPaginas.get(p);
      if (c && Date.now() - c.t < 30 * 60e3) return c.v;
      const j = await sofaApi(`team/${SOFA_GALO}/events/${p < 0 ? 'next/0' : 'last/' + p}`).catch(nuloSe404);
      const v = ((j && j.events) || []).map((e) => {
        const casa = e.homeTeam.id === SOFA_GALO, adv = casa ? e.awayTeam : e.homeTeam;
        return { id: e.id, ts: e.startTimestamp * 1000, casa, adv: `${adv.name || ''} ${adv.shortName || ''}`, estado: (e.status && e.status.type) || '' };
      });
      sofaPaginas.set(p, { t: Date.now(), v });
      return v;
    }

    async function sofaAcharEvento(ev) {
      const ts = new Date(ev.data).getTime();
      const palavras = semAcento(ev.adversario.nome).split(/[\s/-]+/).filter((p) => p.length >= 4);
      const bate = (e) => (palavras.some((p) => semAcento(e.adv).includes(p)) ? 1 : 0);
      const escolher = (lista) => {
        const c = lista.filter((e) => Math.abs(e.ts - ts) < 36 * 3600e3);
        c.sort((a, b) => bate(b) - bate(a) || Math.abs(a.ts - ts) - Math.abs(b.ts - ts));
        return c[0] && (bate(c[0]) || Math.abs(c[0].ts - ts) < 3 * 3600e3) ? c[0] : null;
      };
      if (ts > Date.now() - 8 * 3600e3) {
        const e = escolher((await sofaPagina(-1)).concat(await sofaPagina(0)));
        if (e) return e;
      }
      // Primeira página cujo jogo mais antigo é anterior ao alvo (página vazia = antes do começo da cobertura)
      const passou = async (p) => { const v = await sofaPagina(p); return !v.length || v[0].ts <= ts + 36 * 3600e3; };
      let lo = -1, hi = 0;
      while (!(await passou(hi))) { lo = hi; hi = hi ? hi * 2 : 1; if (hi > 256) return null; }
      while (hi - lo > 1) { const m = Math.floor((lo + hi) / 2); if (await passou(m)) hi = m; else lo = m; }
      const lista = (await sofaPagina(hi)).concat(hi > 0 ? await sofaPagina(hi - 1) : []);
      return escolher(lista);
    }

    // Evento do Sofascore correspondente ao jogo da ESPN. Sem correspondência: tenta de novo em 6 h
    async function carregarEventoSofa(ev) {
      const chave = 'cache:sofa:ev:' + ev.id;
      const c = store.get(chave);
      if (c && Date.now() - c.t < (c.v ? 365 * 864e5 : 6 * 3600e3)) return c.v;
      const e = await sofaAcharEvento(ev);
      const v = e ? { id: e.id, casa: e.casa } : null;
      store.set(chave, { t: Date.now(), v });
      return v;
    }

    const SOFA_STATS = ['totalPass', 'accuratePass', 'totalLongBalls', 'accurateLongBalls', 'keyPass', 'totalCross', 'accurateCross',
      'totalOppositionHalfPasses', 'accurateOppositionHalfPasses', 'totalOwnHalfPasses', 'accurateOwnHalfPasses', 'touches', 'minutesPlayed', 'rating', 'expectedAssists', 'goalAssist'];
    const validadeSofa = (modo) => (modo === 'vivo' ? 60e3 : modo === 'recente' ? 15 * 60e3 : 30 * 864e5);
    function carregarEscalacaoSofa(sid, modo) {
      return comCache('sofa:lin:' + sid, validadeSofa(modo), async () => {
        const l = await sofaApi(`event/${sid}/lineups`);
        const lado = (t) => ((t && t.players) || []).map((p) => {
          const s = {};
          SOFA_STATS.forEach((k) => { if (p.statistics && p.statistics[k] != null) s[k] = p.statistics[k]; });
          return { id: p.player.id, nome: p.player.name || '', curto: p.player.shortName || '', numero: String(p.shirtNumber ?? p.jerseyNumber ?? ''), reserva: !!p.substitute, s };
        });

    }

    function carregarAcoesSofa(sid, pid, modo) {
      return comCache(`sofa:acoes:${sid}:${pid}`, validadeSofa(modo), async () => {
        const [h, rb] = await Promise.all([

                p.playerCoordinates.x, p.playerCoordinates.y, p.passEndCoordinates.x, p.passEndCoordinates.y,
                p.outcome ? 1 : 0, p.keypass ? 1 : 0, p.isAssist || p.assist ? 1 : 0])

        };

    }

    // Calendário do Galo no Sofascore (últimos e próximos), para conferir datas e placares da ESPN
    function carregarCalendarioSofa(forcar) {
      return comCache('sofa:cal', 20 * 60e3, async () => {
        const [ult, prox] = await Promise.all([sofaApi(`team/${SOFA_GALO}/events/last/0`).catch(nuloSe404), sofaApi(`team/${SOFA_GALO}/events/next/0`).catch(nuloSe404)]);
        return [...((ult && ult.events) || []), ...((prox && prox.events) || [])].map((e) => {
          const casa = e.homeTeam.id === SOFA_GALO, adv = casa ? e.awayTeam : e.homeTeam;

          return { id: e.id, ts: e.startTimestamp * 1000, adv: `${adv.name || ''} ${adv.shortName || ''}`, casa, estado: (e.status && e.status.type) || '',
            golsGalo: g(casa ? e.homeScore : e.awayScore), golsAdv: g(casa ? e.awayScore : e.homeScore) };
        });
      }, forcar);
    }
    function conferirComSofa(ev, cal) {
      if (!cal || !ev) return null;
      const palavras = semAcento(ev.adversario.nome).split(/[\s/-]+/).filter((p) => p.length >= 4);
      const ts = new Date(ev.data).getTime();
      const c = cal.filter((e) => palavras.some((p) => semAcento(e.adv).includes(p)) && Math.abs(e.ts - ts) < 4 * 864e5)
        .sort((a, b) => Math.abs(a.ts - ts) - Math.abs(b.ts - ts))[0];
      if (!c) return null;
      const iso = new Date(c.ts).toISOString();
      return {
        ...c, iso,
        outroDia: dataLocal(iso) !== dataLocal(ev.data),
        outraHora: Math.abs(c.ts - ts) >= 60e3,
        placarDiferente: ev.estado === 'post' && c.estado === 'finished' && c.golsGalo != null && ev.golsGalo != null && (c.golsGalo !== ev.golsGalo || c.golsAdv !== ev.golsAdv),
      };
    }

    // Liga a ficha do quadro ao jogador do Sofascore (camisa + nome)
    function acharJogadorSofa(lista, ent) {
      const toks = (s) => semAcento(s).replace(/[^a-z\s]/g, ' ').split(/\s+/).filter((t) => t.length >= 3);
      const alvo = toks(ent.nome);
      let melhor = null, nota = 0;
      (lista || []).forEach((p) => {
        const tp = toks(`${p.nome} ${p.curto}`);
        let n = alvo.filter((t) => tp.includes(t)).length * 2;
        if (ent.numero && String(ent.numero) === p.numero) n += 3;
        if (n > nota) { nota = n; melhor = p; }
      });
      return nota >= 2 ? melhor : null;
    }

    // Mapa de calor numa imagem do tamanho do campo (escala = pixels por metro)
    function pintarCalor(pontos, time, escala = 4) {
      const W = Math.round(L * escala), H = Math.round(A * escala);
      const cv = document.createElement('canvas');
      cv.width = W; cv.height = H;
      const ctx = cv.getContext('2d');
      if (!pontos || !pontos.length) return cv;
      const r = 9 * escala;
      pontos.forEach(({ x, y }) => {
        const px = x * escala, py = y * escala;
        const g = ctx.createRadialGradient(px, py, 0, px, py, r);
        g.addColorStop(0, 'rgba(0,0,0,0.2)');
        g.addColorStop(1, 'rgba(0,0,0,0)');
        ctx.fillStyle = g;
        ctx.fillRect(px - r, py - r, 2 * r, 2 * r);
      });
      const img = ctx.getImageData(0, 0, W, H), d = img.data;
      let max = 0;
      for (let i = 3; i < d.length; i += 4) if (d[i] > max) max = d[i];
      // Escala sequencial de um só tom: claro e transparente onde ele pouco passou, forte onde mais esteve
      const [c0, c1] = time === 'galo' ? [[240, 222, 170], [176, 128, 30]] : [[250, 250, 250], [150, 150, 150]];
      for (let i = 0; i < d.length; i += 4) {
        const v = max ? d[i + 3] / max : 0;
        if (v < 0.06) { d[i + 3] = 0; continue; }
        d[i] = Math.round(c0[0] + (c1[0] - c0[0]) * v);
        d[i + 1] = Math.round(c0[1] + (c1[1] - c0[1]) * v);
        d[i + 2] = Math.round(c0[2] + (c1[2] - c0[2]) * v);
        d[i + 3] = Math.round(255 * (0.12 + 0.72 * Math.pow(v, 0.8)));
      }
      ctx.putImageData(img, 0, 0);
      return cv;
    }

    /* ---------- Jogadores: números por temporada e competição ----------
       Sofascore primeiro (competições que ele cobre: Brasileirão desde 2013, Libertadores, Sul-Americana,
       Copa do Brasil e Mineiro nos anos recentes). O que ele não tiver vem do Galo Digital, que tem a tabela
       "Estatísticas de cada atleta" desde 2010, com amistosos e estaduais. Antes disso, só a ESPN. */
    const PRIMEIRO_ANO_COMPLETO = 2010;
    const COMP_NOMES = {
      brasileirao: 'Brasileirão', libertadores: 'Libertadores', sulamericana: 'Sul-Americana', copadobrasil: 'Copa do Brasil',
      mineiro: 'Mineiro', supercopa: 'Supercopa', recopa: 'Recopa', mundial: 'Mundial', amistosos: 'Amistosos', primeiraliga: 'Primeira Liga',
    };
    function chaveComp(nome) {
      const n = semAcento(nome);
      if (/brasileir/.test(n)) return 'brasileirao';
      if (/libertadores/.test(n)) return 'libertadores';
      if (/sul.?americana|sudamericana/.test(n)) return 'sulamericana';
      if (/copa do brasil/.test(n)) return 'copadobrasil';
      if (/mineiro|modulo i\b/.test(n)) return 'mineiro';
      if (/supercopa/.test(n)) return 'supercopa';
      if (/recopa/.test(n)) return 'recopa';
      if (/mundial|club world|mundo de clubes/.test(n)) return 'mundial';
      if (/amistos/.test(n)) return 'amistosos';
      if (/primeira liga/.test(n)) return 'primeiraliga';
      return 'outra:' + n;
    }
    const nomeComp = (k) => COMP_NOMES[k] || k.replace(/^outra:/, '').replace(/(^|\s)\S/g, (c) => c.toUpperCase());

    // Casamento de nomes entre fontes (ESPN "Gustavo Scarpa", Sofascore "Gustavo Scarpa", Galo Digital "Scarpa")
    const NOMES_COMUNS = new Set(['junior', 'junio', 'silva', 'santos', 'souza', 'sousa', 'oliveira', 'pereira', 'filho', 'neto', 'costa', 'lima', 'alves', 'rodrigues', 'ferreira', 'gomes', 'dos', 'das', 'de', 'da', 'do', 'e']);
    const tokensNome = (s) => semAcento(s).replace(/[^a-z\s]/g, ' ').split(/\s+/).filter((t) => t.length >= 2);
    // Grafias diferentes do mesmo nome: Reiner/Reinier, Casierra/Cassierra, Léo/Leonardo
    const FORMAS_CURTAS = { leo: 'leonardo', gui: 'guilherme', edu: 'eduardo', rafa: 'rafael', fabinho: 'fabio', juninho: 'junior' };
    function quaseIgual(a, b) {
      if (Math.abs(a.length - b.length) > 1) return false;
      let i = 0, j = 0, dif = 0;
      while (i < a.length && j < b.length) {
        if (a[i] === b[j]) { i++; j++; continue; }
        if (++dif > 1) return false;
        if (a.length > b.length) i++; else if (b.length > a.length) j++; else { i++; j++; }
      }
      return dif + (a.length - i) + (b.length - j) <= 1;
    }
    const mesmoToken = (a, b) => a === b || FORMAS_CURTAS[a] === b || FORMAS_CURTAS[b] === a || (a.length >= 5 && b.length >= 5 && quaseIgual(a, b));
    function notaNome(a, b) {
      const ta = tokensNome(a), tb = tokensNome(b);
      if (!ta.length || !tb.length) return 0;
      if (ta.join(' ') === tb.join(' ')) return 100;
      const [menor, maior] = ta.length <= tb.length ? [ta, tb] : [tb, ta];
      const tem = (t) => maior.some((u) => mesmoToken(t, u));
      if (ta.length === tb.length && ta.every((t, k) => mesmoToken(t, tb[k]))) return 90;
      if (menor.every(tem) && menor.some((t) => !NOMES_COMUNS.has(t))) return 60 + menor.length;
      const raros = menor.filter((t) => t.length >= 4 && !NOMES_COMUNS.has(t) && tem(t));
      return raros.length ? 20 * raros.length : 0;
    }
    function casarJogador(lista, nomes, minimo = 20) {
      let melhor = null, nota = 0, empate = false;
      const alvos = nomes.filter(Boolean);
      lista.forEach((j) => {
        const cands = [j.nome, j.gd, j.sofaNome].filter(Boolean);
        const v = Math.max(0, ...alvos.flatMap((x) => cands.map((c) => notaNome(x, c))));
        if (v > nota) { nota = v; melhor = j; empate = false; } else if (v === nota && v > 0 && j !== melhor) empate = true;
      });
      if (!melhor || nota < minimo || (empate && nota < 100)) return null;
      return melhor;
    }

    // Sofascore: em quais competições e temporadas há números de jogadores do Galo
    const anoTemporada = (y) => { const s = String(y); const m = /^(\d{2})\/(\d{2})$/.exec(s); return m ? 2000 + Number(m[1]) : Number(s.slice(0, 4)); };
    function temporadasSofaDoGalo() {
      return comCache('sofa:temps', 864e5, async () => {
        const r = await sofaApi(`team/${SOFA_GALO}/player-statistics/seasons`);
        const out = {};
        (r.uniqueTournamentSeasons || []).forEach((u) => (u.seasons || []).forEach((se) => {
          const ano = anoTemporada(se.year);
          if (!ano) return;
          (out[ano] = out[ano] || []).push({ ut: u.uniqueTournament.id, sid: se.id, chave: chaveComp(u.uniqueTournament.name) });
        }));
        return out;
      });
    }
    function estatSofaTemporada(ut, sid, ano) {
      return comCache(`sofa:est:${ut}:${sid}`, ano >= ANO_ATUAL ? 6 * 3600e3 : 180 * 864e5, async () => {
        const campos = encodeURIComponent('goals,assists,appearances,matchesStarted,minutesPlayed,yellowCards,redCards,rating');
        const out = [];
        for (let pagina = 0; pagina < 4; pagina++) {
          const r = await sofaApi(`unique-tournament/${ut}/season/${sid}/statistics?limit=100&offset=${pagina * 100}&order=-appearances&accumulation=total&fields=${campos}&filters=team.in.${SOFA_GALO}`);
          (r.results || []).forEach((x) => out.push({
            id: x.player.id, nome: x.player.name || '', jogos: x.appearances || 0, titular: x.matchesStarted || 0, minutos: x.minutesPlayed || 0,
            gols: x.goals || 0, assist: x.assists || 0, amarelos: x.yellowCards || 0, vermelhos: x.redCards || 0, nota: x.rating || null,
          }));
          if (!r.pages || pagina + 1 >= r.pages) break;
        }
        return out;
      });
    }

    // Galo Digital: tabela "Estatísticas de cada atleta na Temporada"
    function gdTabelaAtletas(texto) {
      const blocos = (texto || '').split(/\n\|-(?![\d])/);
      const celulas = (bloco) => {
        const out = [];
        bloco.split('\n').forEach((l) => {
          if (!/^[!|]/.test(l) || /^\|\}|^\|\+(?!\d)/.test(l)) return;
          l.slice(1).split(/!!|\|\|/).forEach((c) => {
            let x = c.replace(/\[\[([^\]|]*)\|([^\]]*)\]\]/g, '[[$1¦$2]]');
            const k = x.indexOf('|');
            if (k >= 0 && /=/.test(x.slice(0, k))) x = x.slice(k + 1);
            out.push(x.replace(/¦/g, '|'));
          });
        });
        return out;
      };
      let comps = null, ordem = null;
      const atletas = [];
      const num = (v) => { const t = gdLimpar(v).replace(/\s+/g, ''); const m = /^-?\d+/.exec(t); return m ? Number(m[0]) : 0; };
      blocos.forEach((b) => {
        const cel = celulas(b);
        if (!comps && /colspan/i.test(b) && /Total/i.test(b)) {
          const cab = [];
          b.split('\n').forEach((l) => {
            if (!/^!/.test(l)) return;
            l.slice(1).split('!!').forEach((c) => {
              const x = c.replace(/\[\[([^\]|]*)\|([^\]]*)\]\]/g, '[[$1\u00a6$2]]');
              const k = x.indexOf('|');
              const attr = k >= 0 && /=/.test(x.slice(0, k)) ? x.slice(0, k) : '';
              const val = (attr ? x.slice(k + 1) : x).replace(/\u00a6/g, '|');
              if (/colspan\s*=\s*"?3/i.test(attr)) cab.push(gdLimpar(val.replace(/<br\s*\/?>/gi, ' ')));
            });
          });
          comps = cab.filter((c) => c && !/^total$/i.test(c));
          return;
        }
        if (comps && !ordem && /Nome/i.test(b)) {
          ordem = cel.slice(2, 5).map((c) => { const t = semAcento(gdLimpar(c)); return /^j/.test(t) ? 'jogos' : /^a/.test(t) ? 'assist' : 'gols'; });
          return;
        }
        if (!comps || !ordem || cel.length < 2 + 3 * comps.length) return;
        const link = /\[\[([^\]|]+)(?:\|([^\]]+))?\]\]/.exec(cel[0]);
        const nome = link ? gdLimpar(link[2] || link[1]) : gdLimpar(cel[0]);
        if (!nome || /^total/i.test(nome)) return;
        const pos = gdLimpar(cel[1]).toUpperCase();
        const porComp = {};
        comps.forEach((cn, i) => {
          const v = {};
          ordem.forEach((campo, k) => { v[campo] = cel[2 + 3 * i + k] || ''; });
          const jg = /(\d+)\s*(?:\(\s*(\d+))?/.exec(gdLimpar(v.jogos));
          const jogos = jg ? Number(jg[1]) : 0;
          if (!jogos) return;
          const g = num(v.gols);
          const chave = chaveComp(cn);
          const atual = porComp[chave] || { jogos: 0, titular: 0, gols: 0, assist: 0, sofridos: 0 };
          porComp[chave] = {
            jogos: atual.jogos + jogos, titular: atual.titular + (jg && jg[2] != null ? Number(jg[2]) : 0),
            gols: atual.gols + Math.max(0, g), assist: atual.assist + Math.max(0, num(v.assist)), sofridos: atual.sofridos + Math.max(0, -g),
          };
        });
        atletas.push({ nome, pagina: link ? link[1].trim().replace(/‎/g, '') : null, pos, comps: porComp });
      });
      return { comps: (comps || []).map(chaveComp), atletas };
    }
    function gdAtletasDaTemporada(ano) {
      return comCache('gd:atl:' + ano, ano >= ANO_ATUAL ? 12 * 3600e3 : 90 * 864e5, async () => {
        const titulo = `Futebol Profissional - Temporada ${ano}`;
        const s = await gdApi(`action=parse&prop=sections&redirects=1&page=${encodeURIComponent(titulo)}`);
        if (s.error) return null;
        const sec = (s.parse.sections || []).find((x) => /Estat[ií]sticas de cada atleta/i.test(x.line));
        if (!sec) return null;
        const w = await gdWikitexto(titulo, sec.index);
        const t = gdTabelaAtletas(w ? w.texto : '');
        return t.atletas.length ? t : null;
      });
    }

    const POS_GD = (p) => (/^G/.test(p) ? 'G' : /^(Z|L|D)/.test(p) ? 'D' : /^(V|M)/.test(p) ? 'M' : /^(A|C|P)/.test(p) ? 'F' : '');
    function somarComps(comps) {
      const t = { jogos: 0, titular: 0, minutos: 0, gols: 0, assist: 0, amarelos: 0, vermelhos: 0, sofridos: 0 };
      let notas = 0, pesos = 0;
      Object.values(comps).forEach((c) => {
        Object.keys(t).forEach((k) => { t[k] += c[k] || 0; });
        if (c.nota && c.jogos) { notas += c.nota * c.jogos; pesos += c.jogos; }
      });
      t.nota = pesos ? notas / pesos : null;
      return t;
    }

    // Uma temporada inteira: jogadores com números por competição e a fonte de cada número
    function carregarTemporadaCompleta(ano) {
      return comCache('temp:jog2:' + ano, ano >= ANO_ATUAL ? 6 * 3600e3 : 30 * 864e5, async () => {
        const [gd, temps] = await Promise.all([gdAtletasDaTemporada(ano).catch(() => null), temporadasSofaDoGalo().catch(() => ({}))]);
        const listas = [];
        for (const c of temps[ano] || []) listas.push({ ...c, l: await estatSofaTemporada(c.ut, c.sid, ano).catch(() => null) });
        const jogadores = (gd ? gd.atletas : []).map((a) => ({
          nome: a.nome, gd: a.pagina, pos: POS_GD(a.pos),
          comps: Object.fromEntries(Object.entries(a.comps).map(([k, v]) => [k, { ...v, fonte: 'gd' }])),
        }));
        const doSofa = new Set();
        listas.filter((x) => x.l).forEach(({ chave, l }) => {
          doSofa.add(chave);
          l.filter((p) => p.jogos > 0).forEach((p) => {
