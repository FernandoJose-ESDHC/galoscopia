          q.entidades[chave] = { chave, time, numero: p.numero, nome: p.nome, atletaId: p.id, entrou: p.entrou, expulso: p.expulso, gd: p.gd || null, gdJogo: p.gdJogo || null };
          q.fases[0].pos[chave] = pos[i];
        });
      });
      return q;
    }

    // Escalação provável: escolhe 11 do elenco para os encaixes da formação
    function sugerirProvavel(formacao, elenco, ultimoGalo) {
      const modelo = FORMACOES[formacao];
      const usados = new Set();
      if (ultimoGalo && ultimoGalo.titulares.length >= 11) {
        const pos = posicionarEscalacao(ultimoGalo.titulares, 'galo', ultimoGalo.formacao);
        return modelo.map(([, , x, y]) => {
          let melhor = -1, dist = Infinity;
          ultimoGalo.titulares.forEach((p, i) => {
            if (usados.has(i)) return;
            const d = Math.hypot(pos[i].x - x, pos[i].y - y);
            if (d < dist) { dist = d; melhor = i; }
          });
          usados.add(melhor);
          return ultimoGalo.titulares[melhor].id;
        });
      }
      const lista = [...(elenco || [])].sort((a, b) => b.jogos - a.jogos);
      return modelo.map(([, cat]) => {
        let p = lista.find((j) => !usados.has(j.id) && (j.pos || '').charAt(0) === cat);
        if (!p) p = lista.find((j) => !usados.has(j.id));
        if (!p) return null;
        usados.add(p.id);
        return p.id;
      });
    }
    // Ao trocar de formação, mantém os mesmos jogadores, encaixando cada um pela posição
    function reencaixar(formacao, ids, catDe) {
      const restantes = [...ids];
      const modelo = FORMACOES[formacao];
      const out = modelo.map(([, cat]) => {
        const i = restantes.findIndex((id) => id && catDe(id) === cat);
        return i >= 0 ? restantes.splice(i, 1)[0] : undefined;
      });
      return out.map((id) => (id === undefined ? restantes.shift() ?? null : id));
    }
    function entidadesProvaveis(formacao, ids, buscar, time = 'galo') {
      return FORMACOES[formacao].map(([rot, , x, y], i) => {
        const p = ids[i] ? buscar(ids[i]) : null;
        return { chave: `${time}-s${i}`, time, numero: (p && p.numero) || '', nome: (p && p.nome) || rot, atletaId: ids[i] || null, entrou: false, expulso: false, ...espelhar(time, x, y) };
      });
    }
    function entidadesModelo(formacao, time) {
      return FORMACOES[formacao].map(([rot, , x, y], i) => ({ chave: `${time}-s${i}`, time, numero: i + 1, nome: '', atletaId: null, entrou: false, expulso: false, ...espelhar(time, x, y) }));
    }
    const entidadesModeloAdv = (formacao) => entidadesModelo(formacao, 'adv');

    /* =========================================================
       6. COMPONENTES COMPARTILHADOS
       ========================================================= */
    function Escudo({ src, nome, tamanho = 28 }) {
      const [ok, setOk] = useState(true);
      useEffect(() => setOk(true), [src]);
      if (!src || !ok) {
        return <span className="grid place-items-center rounded-full bg-grafite text-[10px] font-semibold text-neutral-400 shrink-0" style={{ width: tamanho, height: tamanho }} aria-hidden="true">{(nome || '?').slice(0, 3)}</span>;
      }
      return <img src={src} alt="" loading="lazy" onError={() => setOk(false)} className="shrink-0 object-contain" style={{ width: tamanho, height: tamanho }} />;
    }

    const ESTILO_RES = {
      V: ['Vitória', 'text-ouro border-ouro/50 bg-ouro/10'],
      E: ['Empate', 'text-neutral-300 border-neutral-500/50 bg-neutral-500/10'],
      D: ['Derrota', 'text-red-300 border-red-400/40 bg-red-500/10'],
    };
    function Selo({ ev }) {
      if (ev.estado === 'in') {
        return <span className="inline-flex items-center gap-1.5 text-[11px] px-2 py-0.5 rounded border border-red-400/50 bg-red-500/10 text-red-200"><span className="ao-vivo" aria-hidden="true"></span>Ao vivo</span>;
      }
      if (ev.adiado) return <span className="text-[11px] px-2 py-0.5 rounded border border-white/15 text-neutral-400">Adiado</span>;
      if (!ev.resultado) return <span className="text-[11px] px-2 py-0.5 rounded border border-white/15 text-neutral-300">Próximo</span>;
      const [txt, cor] = ESTILO_RES[ev.resultado];
      return <span className={'text-[11px] px-2 py-0.5 rounded border ' + cor}>{txt}{ev.penaltis ? ' nos pênaltis' : ''}</span>;
    }

    function Carregando({ texto, progresso }) {
      return (
        <div className="py-8 text-center text-sm text-neutral-400">
          <p>{texto}</p>
          {progresso && (
            <div className="mx-auto mt-3 h-1.5 w-48 overflow-hidden rounded bg-white/10">
              <div className="h-full bg-ouro transition-[width]" style={{ width: `${Math.round((progresso.feitos / (progresso.total || 1)) * 100)}%` }}></div>
            </div>
          )}
        </div>
      );
    }

    function Cartao({ titulo, subtitulo, direita, children, className = '' }) {
      return (
        <section className={'bg-carvao rounded-xl border border-white/5 p-5 min-w-0 ' + className}>
          {(titulo || direita) && (
            <div className="mb-4 flex flex-wrap items-start justify-between gap-3">
              <div>
                <h3 className="font-placar text-xl font-semibold text-white">{titulo}</h3>
                {subtitulo && <p className="text-sm text-neutral-400">{subtitulo}</p>}
              </div>
              {direita}
            </div>
          )}
          {children}
        </section>
      );
    }

    // Ícones das ferramentas (SVG simples, 18px)
    const ICONES = {
      mover: <path d="M5 3l11 6-4.6 1.4L13.6 16l-2 1-2.4-5.6L5 14z" fill="currentColor" stroke="none" />,
      passe: <g><path d="M3 15L14 4" /><path d="M8 4h6v6" /></g>,
      movimento: <g><path d="M3 15L14 4" strokeDasharray="2.6 2" /><path d="M8 4h6v6" /></g>,
      conducao: <g><path d="M3 15L14 4" strokeDasharray="0.4 2.2" strokeWidth="2.2" /><path d="M8 4h6v6" /></g>,
      livre: <g><path d="M3 15c2-8 7 0 10-9" strokeDasharray="2.6 2" /><path d="M9.5 5.5L13 6l.5 3.6" /></g>,
      linha: <path d="M3 15L15 3" />,
      zona: <rect x="3" y="4" width="12" height="10" rx="1" strokeDasharray="2.4 1.8" />,
      elipse: <ellipse cx="9" cy="9" rx="6.5" ry="4.8" strokeDasharray="2.4 1.8" />,
      texto: <path d="M4 4h10M9 4v11" />,
      regua: <g><rect x="2.5" y="6" width="13" height="6" rx="1" /><path d="M5.5 6v2.5M8.5 6v3.5M11.5 6v2.5" /></g>,
      bola: <g><circle cx="9" cy="9" r="6" /><circle cx="9" cy="9" r="2" fill="currentColor" /></g>,
    };
    function Icone({ nome }) {
      return (
        <svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" strokeWidth="1.6" strokeLinecap="round" strokeLinejoin="round" aria-hidden="true">
          {ICONES[nome]}
        </svg>
      );
    }

    /* =========================================================
       7. ABA JOGOS
       ========================================================= */
    function ItemJogo({ ev, ativo, onClick, conf }) {
      const pre = ev.estado === 'pre';
      const placar = pre ? (ev.horaDefinida === false ? 'a definir' : fHora.format(new Date(ev.data))) : ev.golsGalo != null ? `${ev.golsGalo}–${ev.golsAdv}` : '–';
      const avisos = [];
      if (ev.classificado != null && ev.nota) avisos.push([ev.classificado ? 'text-ouro' : 'text-red-300', ev.classificado ? 'Classificado' + (/agregado/.test(ev.nota) ? ' no agregado' : ' nos pênaltis') : 'Eliminado']);
      if (pre && conf && conf.outroDia) avisos.push(['text-amber-200', `Sofascore marca ${fDiaMes.format(new Date(conf.iso))}`]);
      if (conf && conf.placarDiferente) avisos.push(['text-amber-200', `Sofascore: ${conf.golsGalo}–${conf.golsAdv}`]);
      return (
        <button
          onClick={onClick}
          aria-pressed={ativo}
          className={'w-full text-left rounded-lg px-3 py-2.5 border transition-colors ' + (ativo ? 'bg-breu border-ouro/70' : 'bg-grafite/40 border-transparent hover:bg-grafite hover:border-white/10')}
        >
          <div className="flex items-center justify-between gap-2 text-xs text-neutral-400">
            <span className="truncate">{fDiaMes.format(new Date(ev.data))}, {ev.curto}</span>
            <Selo ev={ev} />
          </div>
          <div className="mt-1.5 flex items-center gap-2">
            <Escudo src={ev.adversario.logo} nome={ev.adversario.nome} tamanho={22} />
            <span className="flex-1 truncate font-placar text-lg leading-tight text-white">{ev.adversario.nome}</span>
            <span className="text-[11px] text-neutral-500">{ev.neutro ? 'neutro' : ev.galoCasa ? 'casa' : 'fora'}</span>
            <span className={'font-placar tabular-nums ' + (pre && ev.horaDefinida === false ? 'text-sm text-neutral-500' : 'text-lg ') + (pre ? ' text-neutral-300' : ' text-ouro')}>{placar}</span>
          </div>
          {avisos.length > 0 && (
            <div className="mt-1 flex flex-wrap gap-x-3 text-[11px]">{avisos.map(([cl, t]) => <span key={t} className={cl}>{t}</span>)}</div>
          )}
        </button>
      );
    }

    function Sidebar({ temporada, setTemporada, comp, setComp, proximos, resultados, selId, onSelecionar, carregando, progresso, erro, onTentar, confDe }) {
      const resumo = useMemo(() => {
        const fin = resultados.filter((e) => e.resultado);
        return {
          j: fin.length, v: fin.filter((e) => e.resultado === 'V').length, e: fin.filter((e) => e.resultado === 'E').length,
          d: fin.filter((e) => e.resultado === 'D').length,
          gp: fin.reduce((s, e) => s + (e.golsGalo || 0), 0), gc: fin.reduce((s, e) => s + (e.golsAdv || 0), 0),
        };
      }, [resultados]);
      const anos = [];
      for (let a = ANO_ATUAL; a > PRIMEIRO_ANO_HISTORIA; a--) anos.push(a);
      const todas = temporada === 'todas';
      const [limite, setLimite] = useState(150);
      useEffect(() => setLimite(150), [temporada, comp]);
      let anoAnterior = null;

      return (
        <aside className="lg:w-80 shrink-0 bg-carvao border-b lg:border-b-0 lg:border-r border-white/5 flex flex-col lg:h-[calc(100vh-57px)] lg:sticky lg:top-[57px]">
          <div className="p-4 space-y-3 border-b border-white/5">
            <div className="grid grid-cols-2 gap-2">
              <label className="text-xs text-neutral-400">
                Temporada
                <select value={temporada} onChange={(e) => setTemporada(e.target.value === 'todas' ? 'todas' : Number(e.target.value))} className="mt-1 w-full rounded-md border border-white/10 px-2 py-1.5 text-sm text-white">
                  {anos.map((a) => <option key={a} value={a}>{a}</option>)}
                  <option value="todas">Todas (toda a história)</option>
                </select>
              </label>
              <label className="text-xs text-neutral-400">
                Competição
                <select value={comp} onChange={(e) => setComp(e.target.value)} className="mt-1 w-full rounded-md border border-white/10 px-2 py-1.5 text-sm text-white">
                  <option value="todas">Todas</option>
                  {COMPETICOES.map((c) => <option key={c.slug} value={c.slug}>{c.curto}</option>)}
                  <option value="outras">Amistosos e outros torneios</option>
                </select>
              </label>
            </div>
            {resumo.j > 0 && (
              <div className="grid grid-cols-5 gap-1 text-center">
                {[['Jogos', resumo.j], ['V', resumo.v], ['E', resumo.e], ['D', resumo.d], ['Gols', `${resumo.gp}:${resumo.gc}`]].map(([r, v]) => (
                  <div key={r} className="rounded bg-breu/60 py-1.5">
                    <div className="font-placar text-lg leading-none text-white tabular-nums">{v}</div>
                    <div className="mt-0.5 text-[10px] text-neutral-500">{r}</div>
                  </div>
                ))}
              </div>
            )}
          </div>

          <div className="flex-1 overflow-y-auto px-3 py-3 space-y-4 max-h-[60vh] lg:max-h-none">
            {proximos.length > 0 && (
              <section>
                <h2 className="px-1 pb-2 text-sm text-neutral-400">Próximos jogos</h2>
                <div className="space-y-2">
                  {proximos.map((ev) => <ItemJogo key={ev.id} ev={ev} conf={confDe && confDe(ev)} ativo={ev.id === selId} onClick={() => onSelecionar(ev.id)} />)}
                </div>
              </section>
            )}
            <section>
              <h2 className="px-1 pb-2 text-sm text-neutral-400">{todas ? 'Todos os resultados' : `Resultados de ${temporada}`}</h2>
              {carregando && <Carregando texto={todas ? 'Buscando todas as temporadas na ESPN e, antes de 2007, no Galo Digital. Na primeira vez leva alguns minutos.' : 'Buscando jogos…'} progresso={progresso} />}
              {!carregando && !todas && temporada < PRIMEIRO_ANO && resultados.length > 0 && (
                <p className="mb-2 px-1 text-xs text-neutral-500">Jogos de {temporada} registrados no Galo Digital. Podem faltar partidas que a enciclopédia ainda não tem.</p>
              )}
              {!carregando && erro && (
                <div className="mb-2 rounded-lg border border-red-400/30 bg-red-500/10 p-3 text-sm text-red-100">
                  {erro}
                  <button onClick={onTentar} className="mt-2 block rounded border border-red-300/40 px-3 py-1 text-xs hover:bg-red-500/20">Tentar de novo</button>
                </div>
              )}
              {!carregando && !erro && resultados.length === 0 && (
                <p className="px-1 text-sm text-neutral-500">Nenhum jogo encontrado com esses filtros.</p>
              )}
              <div className="space-y-2">
                {resultados.slice(0, limite).map((ev) => {
                  const ano = anoDe(ev.data);
                  const cab = todas && ano !== anoAnterior;
                  anoAnterior = ano;
                  return (
                    <React.Fragment key={ev.id}>
                      {cab && <div className="px-1 pt-2 font-placar text-base text-ouro">{ano}</div>}
                      <ItemJogo ev={ev} conf={confDe && confDe(ev)} ativo={ev.id === selId} onClick={() => onSelecionar(ev.id)} />
                    </React.Fragment>
                  );
                })}
              </div>
              {resultados.length > limite && (
                <button onClick={() => setLimite((l) => l + 200)} className="mt-3 w-full rounded-md border border-white/10 py-2 text-sm text-neutral-300 hover:border-white/30">
                  Mostrar mais ({resultados.length - limite} restantes)
                </button>
              )}
            </section>
          </div>
          <p className="hidden lg:block px-4 py-3 text-xs text-neutral-500 border-t border-white/5">Calendário da ESPN, de 2007 até hoje. Súmulas (escalação, trocas, estatísticas), mapas de calor e passes do <a href="https://www.sofascore.com" target="_blank" rel="noopener noreferrer" className="text-ouro hover:underline">Sofascore</a>. Fichas técnicas, retrospectos e números históricos da <a href="https://www.galodigital.com.br/enciclopedia/P%C3%A1gina_principal" target="_blank" rel="noopener noreferrer" className="text-ouro hover:underline">Enciclopédia Galo Digital</a>.</p>
        </aside>
      );
    }

    function Contagem({ data }) {
      const [agora, setAgora] = useState(Date.now());
      useEffect(() => { const t = setInterval(() => setAgora(Date.now()), 30000); return () => clearInterval(t); }, []);
      const ms = new Date(data).getTime() - agora;
      if (ms <= 0) return <span>Começando agora</span>;
      const d = Math.floor(ms / 864e5), h = Math.floor((ms % 864e5) / 36e5), m = Math.floor((ms % 36e5) / 6e4);
      return <span>Faltam {d > 0 ? `${d} ${d === 1 ? 'dia' : 'dias'} e ` : ''}{h} h{d === 0 ? ` ${m} min` : ''}</span>;
    }

    function Placar({ ev, resumo, contagem, onAddGalo, onAddAdv, onRecomecar, rotuloRecomecar, conf }) {
      const av = resumo && resumo.aoVivo;
      const aoVivo = (av && av.estado === 'in') || ev.estado === 'in';
      const usarAv = aoVivo && av && av.mandante != null && av.visitante != null;
      const gm = usarAv ? av.mandante : ev.mandante.gols;
      const gv = usarAv ? av.visitante : ev.visitante.gols;
      const temPlacar = gm != null && gv != null && (ev.estado !== 'pre' || aoVivo);
      const comecou = ev.estado !== 'pre' || aoVivo;
      const gols = comecou ? (resumo && resumo.gols) || [] : [];
      const time = (t, direita) => (
        <div className={'flex min-w-0 flex-col items-center gap-2 text-center sm:flex-row sm:gap-3 ' + (direita ? 'sm:flex-row-reverse sm:text-right' : 'sm:text-left')}>
          <Escudo src={t.logo} nome={t.nome} tamanho={44} />
          <span className={'min-w-0 break-words font-placar text-xl sm:text-2xl md:text-4xl font-bold leading-tight ' + (t.id === GALO_ID ? 'text-white' : 'text-neutral-400')}>{t.nome}</span>
        </div>
      );
      return (
        <header className="listras bg-breu border-b border-white/5 px-5 md:px-6 py-5">
          <p className="text-sm text-neutral-400">{ev.competicao}{ev.fase ? `, ${ev.fase}` : ''}{ev.neutro ? ', em campo neutro' : ''}</p>
          {ev.nota && <p className={'mt-0.5 text-sm ' + (ev.classificado === true ? 'text-ouro' : ev.classificado === false ? 'text-red-200' : 'text-neutral-300')}>{ev.nota}.</p>}
          <div className="mt-2 grid grid-cols-[1fr_auto_1fr] items-center gap-3 md:gap-6">
            {time(ev.mandante, false)}
            <div className="text-center">
              <div className="font-placar text-4xl sm:text-5xl md:text-6xl font-extrabold text-ouro tabular-nums leading-none">{temPlacar ? `${gm}–${gv}` : 'vs'}</div>
              {aoVivo && <div className="mt-1 inline-flex items-center gap-1.5 text-sm text-red-200"><span className="ao-vivo" aria-hidden="true"></span>{(av && av.detalhe) || ev.relogio || 'Ao vivo'}</div>}
              {ev.penaltis && <div className="mt-1 text-xs text-neutral-400">decidido nos pênaltis</div>}
            </div>
            {time(ev.visitante, true)}
          </div>
          <p className="mt-3 text-sm text-neutral-500">
            {[ev.estadio, ev.cidade].filter(Boolean).join(', ')}{ev.estadio ? '. ' : ''}
            <span className="capitalize">{fLonga.format(new Date(ev.data))}</span>{ev.semHora ? '' : ev.horaDefinida === false && ev.estado === 'pre' ? ', horário a definir' : ` às ${fHora.format(new Date(ev.data))}`}
            {comecou && resumo && resumo.publico ? `. Público: ${resumo.publico.toLocaleString('pt-BR')}` : ''}
            {resumo && resumo.arbitro ? `. Árbitro: ${resumo.arbitro}` : ''}
          </p>
          {ev.estado === 'pre' && !ev.adiado && !aoVivo && ev.horaDefinida !== false && <p className="mt-1 text-sm text-ouro"><Contagem data={ev.data} /></p>}
          {ev.estado === 'pre' && ev.horaDefinida === false && <p className="mt-1 text-sm text-amber-200">Data e horário ainda não confirmados pela organização; a ESPN usa uma data provisória.</p>}
          {ev.estado === 'pre' && conf && (conf.outroDia || (ev.horaDefinida !== false && conf.outraHora)) && (
            <p className="conferencia mt-1 text-sm text-amber-200">O Sofascore marca <span className="capitalize">{fLonga.format(new Date(conf.iso))}</span> às {fHora.format(new Date(conf.iso))}{ev.horaDefinida === false ? ', também provisório' : ''}.</p>
          )}
          {conf && conf.placarDiferente && <p className="conferencia mt-1 text-sm text-amber-200">O Sofascore registra outro placar: Galo {conf.golsGalo} x {conf.golsAdv}. Pode ser correção ainda não feita pela ESPN.</p>}
          {gols.length > 0 && (
            <ul className="mt-3 flex flex-wrap gap-x-4 gap-y-1 text-sm">
              {gols.map((g, i) => (
                <li key={i} className={g.time === 'galo' ? 'text-ouro' : 'text-neutral-400'}>
                  <span aria-hidden="true">⚽ </span>{g.autor}{g.contra ? ' (contra)' : ''}{g.penalti ? ' (pên.)' : ''} <span className="tabular-nums opacity-80">{g.rotulo}</span>
                </li>
              ))}
            </ul>
          )}
          <div className="mt-4 flex flex-wrap gap-3">
            <button onClick={onAddGalo} disabled={contagem.galo >= MAX_POR_TIME} className="flex items-center gap-2 rounded-md bg-ouro px-4 py-2.5 font-semibold text-breu hover:bg-ourobrilho disabled:opacity-40 disabled:cursor-not-allowed transition-colors">
              <span className="inline-block w-3.5 h-3.5 rounded-full bg-breu" aria-hidden="true"></span>
              Adicionar Jogador Galo <span className="text-xs font-medium opacity-70">{contagem.galo}/{MAX_POR_TIME}</span>
            </button>
            <button onClick={onAddAdv} disabled={contagem.adv >= MAX_POR_TIME} className="flex items-center gap-2 rounded-md border border-white/25 bg-grafite px-4 py-2.5 font-semibold text-white hover:border-white/50 disabled:opacity-40 disabled:cursor-not-allowed transition-colors">
              <span className="inline-block w-3.5 h-3.5 rounded-full bg-neutral-500 border-2 border-white" aria-hidden="true"></span>
              Adicionar Adversário <span className="text-xs font-medium opacity-60">{contagem.adv}/{MAX_POR_TIME}</span>
            </button>
            {onRecomecar && (
              <button onClick={onRecomecar} className="rounded-md border border-ouro/50 px-4 py-2.5 font-semibold text-ouro hover:bg-ouro/10 transition-colors">{rotuloRecomecar}</button>
            )}
          </div>
        </header>
      );
    }

    /* ---------- Quadro tático ---------- */
    const FERRAMENTAS = [
      ['mover', 'Mover', 'V', 'Selecionar e arrastar jogadores e desenhos'],
      ['passe', 'Passe', 'P', 'Seta cheia: passe ou chute. Arraste de um jogador até outro'],
      ['movimento', 'Movimento', 'M', 'Seta tracejada: deslocamento sem bola'],
      ['conducao', 'Condução', 'C', 'Seta pontilhada: condução de bola'],
      ['livre', 'Curva', 'K', 'Movimento em curva: desenhe livremente'],
      ['linha', 'Linha', 'L', 'Linha sem ponta, por exemplo para a linha defensiva'],
      ['zona', 'Zona', 'Z', 'Retângulo para destacar um espaço'],
      ['elipse', 'Área', 'E', 'Elipse para destacar uma região'],
      ['texto', 'Texto', 'T', 'Clique no campo para escrever'],
      ['regua', 'Régua', 'R', 'Mede a distância em metros'],
    ];

    function BotaoFerramenta({ ativo, onClick, titulo, children, rotulo, desabilitado }) {
      return (
        <button onClick={onClick} title={titulo} aria-label={titulo} aria-pressed={ativo} disabled={desabilitado}
          className={'flex items-center gap-1.5 rounded-md border px-2 py-1.5 text-xs transition-colors disabled:opacity-40 ' + (ativo ? 'border-ouro bg-ouro/15 text-ouro' : 'border-white/10 text-neutral-300 hover:border-white/30 hover:text-white')}>
          {children}{rotulo && <span className="hidden sm:inline">{rotulo}</span>}
        </button>
      );
    }

    // Tabela compacta com as estatísticas da ESPN (temporada por competição ou por ano)
    const COLS_TEMP = [['titular', 'Tit', 'Jogos como titular'], ['gols', 'G', 'Gols'], ['assist', 'A', 'Assistências'], ['fin', 'Fin', 'Finalizações'], ['alvo', 'Alvo', 'No alvo'], ['faltas', 'FC', 'Faltas cometidas'], ['sofridas', 'FS', 'Faltas sofridas'], ['amarelos', 'CA', 'Cartões amarelos'], ['vermelhos', 'CV', 'Cartões vermelhos']];
    function TabelaTemporada({ linhas, rotulo, compacta }) {
      const cols = compacta ? COLS_TEMP.filter(([k]) => !['faltas', 'sofridas', 'alvo'].includes(k)) : COLS_TEMP;
      return (
        <div className="overflow-x-auto">
          <table className="w-full text-xs tabular-nums">
            <thead><tr className="text-left text-neutral-500">
              <th className="py-1 pr-2 font-normal">{rotulo}</th>
              {cols.map(([k, r, t]) => <th key={k} className="py-1 pr-2 font-normal" title={t}>{r}</th>)}
            </tr></thead>
            <tbody>{linhas.map((l, i) => (
              <tr key={i} className="border-t border-white/5">
                <td className="py-1 pr-2 text-neutral-200 whitespace-nowrap">{l.rotulo}</td>
                {cols.map(([k]) => <td key={k} className={'py-1 pr-2 ' + (k === 'vermelhos' && l.s[k] ? 'text-red-300' : 'text-neutral-300')}>{l.s[k] ?? 0}</td>)}
              </tr>
            ))}</tbody>
          </table>
        </div>
      );
    }

    // Estatísticas da temporada de um jogador num time (por competição)
    function useTemporadaJogador(atletaId, teamId, ano, liga) {
      const [estado, setEstado] = useState({ carregando: false, linhas: null });
      useEffect(() => {
        if (!atletaId || !teamId) { setEstado({ carregando: false, linhas: null }); return; }
        let vivo = true;
        setEstado({ carregando: true, linhas: null });
        const p = ano === ANO_ATUAL
          ? carregarPerfil(atletaId).then((pf) => pf.temporada.filter((t) => t.ano === ano && t.teamId === String(teamId)).map((t) => ({ rotulo: t.comp, s: t.s })))
          : carregarHistoricoNoTime(atletaId, teamId, liga || 'bra.1').then((h) => h.filter((t) => t.ano === ano).map((t) => ({ rotulo: t.comp, s: t.s })));
        p.then((linhas) => { if (vivo) setEstado({ carregando: false, linhas }); })
          .catch(() => { if (vivo) setEstado({ carregando: false, linhas: [] }); });
        return () => { vivo = false; };
      }, [atletaId, teamId, ano, liga]);
      return estado;
    }

    /* ---------- Galo Digital na interface ---------- */
    function useAtletaGD({ titulo, nome, nasc }, ativo = true) {
      const [estado, setEstado] = useState({ carregando: !!ativo, a: null, erro: false });
      useEffect(() => {
        if (!ativo || (!titulo && !nome)) { setEstado({ carregando: false, a: null, erro: false }); return; }
        let vivo = true;
        setEstado({ carregando: true, a: null, erro: false });
        carregarAtletaGD({ titulo, nome, nasc })
          .then((a) => { if (vivo) setEstado({ carregando: false, a, erro: false }); })
          .catch(() => { if (vivo) setEstado({ carregando: false, a: null, erro: true }); });
        return () => { vivo = false; };
      }, [titulo, nome, nasc, ativo]);
      return estado;
    }

    function LinkGD({ href, children, className = '' }) {
      return <a href={href} target="_blank" rel="noopener noreferrer" className={'text-ouro underline-offset-4 hover:underline ' + className}>{children}</a>;
    }
    const aproveitamento = (v, e, d) => (v + e + d > 0 ? Math.round(((3 * v + e) / (3 * (v + e + d))) * 100) : null);
    const ehGoleiroGD = (a) => /goleir/i.test((a && a.posicao) || '');

    // Números do jogador em toda a história do Galo, segundo o Galo Digital
    function BlocoGaloDigital({ titulo, nome, nasc, compacto, estado }) {
      const interno = useAtletaGD({ titulo, nome, nasc }, !estado);
      const { carregando, a, erro } = estado || interno;
      const goleiro = ehGoleiroGD(a);
      if (compacto) {
        return (
          <p className="gd-compacto mt-1 text-xs text-neutral-400">
            {carregando ? 'Buscando no Galo Digital…'
              : a ? (
                <>
                  Na história do Galo: <span className="text-white">{a.jogos ?? '–'} jogos</span>
                  {a.gols != null && <>, <span className="text-white">{a.gols} {goleiro ? 'gols sofridos' : a.gols === 1 ? 'gol' : 'gols'}</span></>}
                  {a.v != null && ` (${a.v}V ${a.e ?? 0}E ${a.d ?? 0}D)`}. <LinkGD href={a.url}>Galo Digital ↗</LinkGD>
                </>
              )
              : erro ? 'Não consegui consultar o Galo Digital agora.' : 'Sem página no Galo Digital.'}
          </p>
        );
      }
      const ap = a && a.v != null ? aproveitamento(a.v, a.e || 0, a.d || 0) : null;
      return (
        <section className="gd-bloco rounded-lg border border-white/10 p-4">
          <div className="flex flex-wrap items-center justify-between gap-2">
            <h3 className="text-sm font-semibold text-neutral-300">Na história do Galo, pelo Galo Digital</h3>
            {a && <LinkGD href={a.url} className="text-sm">Abrir a página ↗</LinkGD>}
          </div>
          {carregando ? <p className="mt-2 text-xs text-neutral-500">Buscando no Galo Digital…</p>
            : !a ? <p className="mt-2 text-xs text-neutral-500">{erro ? 'Não consegui consultar o Galo Digital agora. Confira a conexão.' : `Não achei uma página de ${nome || titulo} no Galo Digital.`}</p>
            : (
              <>
                {semAcento(a.nome) !== semAcento(nome || '') && <p className="mt-1 text-xs text-neutral-500">Página: {a.titulo}</p>}
                <div className="mt-3 grid grid-cols-2 gap-2 sm:grid-cols-5">
                  <Dado rotulo="Jogos" valor={a.jogos ?? '–'} />
                  <Dado rotulo={goleiro ? 'Gols sofridos' : 'Gols'} valor={a.gols ?? '–'} />
                  <Dado rotulo="Vitórias" valor={a.v ?? '–'} />
                  <Dado rotulo="Empates" valor={a.e ?? '–'} />
                  <Dado rotulo="Derrotas" valor={a.d ?? '–'} />
                </div>
                {ap != null && <p className="mt-2 text-sm text-neutral-400">Aproveitamento de {ap}% dos pontos nos jogos em que atuou.</p>}
                <dl className="mt-3 grid gap-x-4 gap-y-1.5 text-sm sm:grid-cols-[7rem_1fr]">
                  {[['No Galo', a.periodo], ['Estreia', a.estreia], ['Último jogo', a.ultimo], ['Revelado', a.revelado], ['Títulos', a.titulos], ['Observação', a.obs]].filter(([, v]) => v).map(([k, v]) => (
                    <React.Fragment key={k}><dt className="text-neutral-500">{k}</dt><dd className="text-neutral-200">{v}</dd></React.Fragment>
                  ))}
                </dl>
                {a.doTexto && <p className="mt-2 text-xs text-neutral-500">Página antiga, sem o quadro de números: jogos e gols vêm do texto da biografia.</p>}
                <p className="mt-3 text-xs text-neutral-500">Fonte: Enciclopédia Galo Digital, feita por torcedores (licença CC BY-NC-ND 4.0). Conta todas as competições e amistosos, por isso costuma ser maior que o número da ESPN.</p>
              </>
            )}
        </section>
      );
    }

    // Perfil de quem só existe no Galo Digital (jogos antigos, sem ESPN)
    function PerfilGD({ alvo, onFechar }) {
      const est = useAtletaGD({ titulo: alvo.gd || null, nome: alvo.gd ? null : alvo.nome, nasc: null });
      const a = est.a;
      const fecharRef = useRef(null);
      useEffect(() => {
        if (fecharRef.current) fecharRef.current.focus();
        const t = (e) => { if (e.key === 'Escape') { e.stopImmediatePropagation(); onFechar(); } };
        window.addEventListener('keydown', t, true);
        return () => window.removeEventListener('keydown', t, true);
      }, []);
      return (
        <div className="fixed inset-0 z-[60] flex items-start justify-center overflow-y-auto bg-black/70 p-4" onClick={onFechar} role="dialog" aria-modal="true" aria-label={`Perfil de ${alvo.nome}`}>
          <div className="perfil-jogador my-6 w-full max-w-2xl rounded-xl border border-white/10 bg-carvao p-5 md:p-6" onClick={(e) => e.stopPropagation()}>
            <div className="flex items-start gap-4">
              {a && a.foto
                ? <img src={a.foto} alt="" className="h-20 w-20 shrink-0 rounded-full bg-grafite object-cover" />
                : <div className="grid h-20 w-20 shrink-0 place-items-center rounded-full bg-grafite font-placar text-2xl text-ouro" aria-hidden="true">{(alvo.nome || '?').slice(0, 2)}</div>}
              <div className="min-w-0 flex-1">
                <h2 className="font-placar text-3xl font-bold leading-tight text-white">{(a && a.nome.split(',')[0]) || alvo.nome}</h2>
                {a && a.completo && <p className="text-sm text-neutral-500">{a.completo}</p>}
                {a && (
                  <p className="mt-1 text-sm text-neutral-400">
                    {[a.posicao, a.nasc && `nascido em ${dataNasc(a.nasc + 'T12:00Z')}`, a.cidade].filter(Boolean).join(', ')}.
                  </p>
                )}
              </div>
              <button ref={fecharRef} onClick={onFechar} className="rounded-md border border-white/15 px-2.5 py-1 text-sm text-neutral-300 hover:border-white/40" aria-label="Fechar perfil">✕</button>
            </div>
            <div className="mt-5"><BlocoGaloDigital titulo={alvo.gd} nome={alvo.nome} estado={est} /></div>
            <p className="mt-3 text-xs text-neutral-500">Jogador sem cadastro na ESPN para este jogo; os dados vêm só do Galo Digital.</p>
          </div>
        </div>
      );
    }

    // Retrospecto histórico do confronto (Galo Digital)
    function RetrospectoGD({ estado, nomeAdv }) {
      if (!estado) return null;
      const { carregando, c, erro } = estado;
      const t = c && c.total;
      return (
        <div className="gd-confronto mt-4 border-t border-white/5 pt-4">
          <h4 className="text-sm font-semibold text-neutral-300">Toda a história, pelo Galo Digital</h4>
          {carregando ? <p className="mt-1 text-xs text-neutral-500">Buscando no Galo Digital…</p>
            : !t ? <p className="mt-1 text-xs text-neutral-500">{erro ? 'Não consegui consultar o Galo Digital agora. Confira a conexão.' : `Não achei o confronto com ${nomeAdv} no Galo Digital.`}</p>
            : (
              <>
                <div className="mt-2 grid grid-cols-3 gap-2 sm:grid-cols-6">
                  <Dado rotulo="Jogos" valor={t.jogos} />
                  <Dado rotulo="Vitórias" valor={t.v} />
                  <Dado rotulo="Empates" valor={t.e} />
                  <Dado rotulo="Derrotas" valor={t.d} />
                  <Dado rotulo="Gols pró" valor={t.gp} />
                  <Dado rotulo="Gols contra" valor={t.gc} />
                </div>
                <div className="mt-2 flex h-2 overflow-hidden rounded-full bg-grafite" aria-hidden="true">
                  <div className="bg-ouro" style={{ width: `${(100 * t.v) / Math.max(1, t.jogos)}%` }} />
                  <div className="bg-neutral-500" style={{ width: `${(100 * t.e) / Math.max(1, t.jogos)}%` }} />
                  <div className="bg-red-400/70" style={{ width: `${(100 * t.d) / Math.max(1, t.jogos)}%` }} />
                </div>
                {c.torneios.length > 0 && (
                  <table className="mt-3 w-full text-sm tabular-nums">
                    <thead><tr className="text-left text-xs text-neutral-500"><th className="py-1 pr-2 font-normal">Competição</th><th className="py-1 pr-2 font-normal">J</th><th className="py-1 pr-2 font-normal">V</th><th className="py-1 pr-2 font-normal">E</th><th className="py-1 pr-2 font-normal">D</th><th className="py-1 font-normal">Gols</th></tr></thead>
                    <tbody>
                      {[...c.torneios].sort((x, y) => y.jogos - x.jogos).slice(0, 6).map((l) => (
                        <tr key={l.nome} className="border-t border-white/5">
                          <td className="py-1 pr-2 text-neutral-200">{l.nome}</td><td className="py-1 pr-2">{l.jogos}</td><td className="py-1 pr-2">{l.v}</td><td className="py-1 pr-2">{l.e}</td><td className="py-1 pr-2">{l.d}</td><td className="py-1 text-neutral-400">{l.gp}–{l.gc}</td>
                        </tr>
                      ))}
                    </tbody>
                  </table>
                )}
                <p className="mt-2 text-xs text-neutral-500">{c.atualizado ? `Página atualizada em ${c.atualizado}. ` : ''}Inclui amistosos e jogos anteriores a 2007. <LinkGD href={c.url}>Ver no Galo Digital ↗</LinkGD></p>
              </>
            )}
        </div>
      );
    }

    // Ficha técnica do jogo (Galo Digital)
    function CartaoFichaGD({ ficha, ev }) {
      const marcadores = (t) => t.titulares.flatMap((j) => [j, j.sub].filter(Boolean)).filter((j) => j.gols > 0).map((j) => `${j.nome}${j.gols > 1 ? ` (${j.gols})` : ''}`);
      const contra = (t) => t.titulares.flatMap((j) => [j, j.sub].filter(Boolean)).filter((j) => j.contra > 0).map((j) => `${j.nome} (contra)`);
      const golsGalo = marcadores(ficha.galo).concat(contra(ficha.adv));
      const golsAdv = marcadores(ficha.adv).concat(contra(ficha.galo));
      const itens = [
        ['Competição', ficha.motivo], ['Técnico do Galo', ficha.tecnicoGalo], [`Técnico do ${ev.adversario.nome}`, ficha.tecnicoAdv],
        ['Gols do Galo', golsGalo.join(', ')], [`Gols do ${ev.adversario.nome}`, golsAdv.join(', ')],
        ['Estádio', [ficha.estadio, ficha.local].filter(Boolean).join(', ')], ['Árbitro', ficha.arbitro], ['Público pagante', ficha.publico], ['Renda', ficha.renda],
      ].filter(([, v]) => v && !/^-+$/.test(v));
      return (
        <Cartao titulo="Ficha técnica" subtitulo={ficha.resultado} direita={<LinkGD href={ficha.url} className="text-sm">Galo Digital ↗</LinkGD>} className="ficha-gd">
          <dl className="grid gap-x-4 gap-y-1.5 text-sm sm:grid-cols-[10rem_1fr]">
            {itens.map(([k, v]) => <React.Fragment key={k}><dt className="text-neutral-500">{k}</dt><dd className="text-neutral-200">{v}</dd></React.Fragment>)}
          </dl>
          <p className="mt-3 text-xs text-neutral-500">Fonte: Enciclopédia Galo Digital (CC BY-NC-ND 4.0).</p>
        </Cartao>
      );
    }

    /* ---------- Mapa de calor e passes do jogador (Sofascore) ---------- */
    function useAcoesJogador(ev, ent) {
      const [estado, setEstado] = useState({ fase: 'carregando' });
      const ativo = !!ev && ev.estado !== 'pre' && ev.fonte !== 'gd' && ent.time !== 'bola' && !!(ent.nome || ent.numero);
      useEffect(() => {
        if (!ativo) { setEstado({ fase: 'sem' }); return; }
        let vivo = true;
        const modo = ev.estado === 'in' ? 'vivo' : jogoRecente(ev) ? 'recente' : 'antigo';
        setEstado({ fase: 'carregando' });
        (async () => {
          const e = await carregarEventoSofa(ev);
          if (!e) return { fase: 'semJogo' };
          const lin = await carregarEscalacaoSofa(e.id, modo);
          const doGalo = ent.time === 'galo';
          const lista = (e.casa === doGalo) ? lin.home : lin.away;
          const p = acharJogadorSofa(lista, ent);
          if (!p) return { fase: 'semJogador', sid: e.id };
          const a = await carregarAcoesSofa(e.id, p.id, modo);
          const calor = (a.calor || []).map(([x, y]) => sofaParaCampo(ent.time, x, y));
          const passes = a.passes ? a.passes.map(([x1, y1, x2, y2, ok, chave, assist]) => {
            const o = sofaParaCampo(ent.time, x1, y1), d = sofaParaCampo(ent.time, x2, y2);
            return { x1: o.x, y1: o.y, x2: d.x, y2: d.y, ok: !!ok, chave: !!chave, assist: !!assist };
          }) : null;
          return { fase: 'pronto', sid: e.id, jogador: p, calor, passes, temCalor: !!a.calor };
        })()
          .then((r) => { if (vivo) setEstado(r); })
          .catch(() => { if (vivo) setEstado({ fase: 'erro' }); });
        return () => { vivo = false; };
      }, [ativo, ev && ev.id, ev && ev.estado, ent.time, ent.nome, ent.numero]);
      return ativo ? estado : { fase: 'sem' };
    }

    const pct = (a, b) => (b ? Math.round((100 * a) / b) : 0);
    const DESTAQUE_PASSE = { ok: 'Certo', erro: 'Errado', chave: 'Decisivo' };

    function AcoesJogador({ ev, ent, noCampo, setNoCampo, definirCamada }) {
      const est = useAcoesJogador(ev, ent);
      const [modo, setModo] = useState('ambos');
      const [filtro, setFiltro] = useState('todos');
      const [foco, setFoco] = useState(null);
      const cor = ent.time === 'galo' ? OURO : '#A3A3A3';
      const pronto = est.fase === 'pronto';
      const passes = pronto && est.passes ? est.passes.filter((p) => filtro === 'todos' || (filtro === 'certos' ? p.ok : !p.ok)) : [];
      const imagem = useMemo(() => (pronto && est.calor.length ? pintarCalor(est.calor, ent.time, 4).toDataURL() : null), [pronto, est.calor, ent.time]);

      // Camada no quadro grande
      useEffect(() => {
        if (!definirCamada) return;
        if (noCampo && pronto) definirCamada({ time: ent.time, calor: modo !== 'passes' ? est.calor : [], passes: modo !== 'calor' ? passes : [] });
        else definirCamada(null);
      }, [noCampo, pronto, est, modo, filtro, ent.time]);
      useEffect(() => () => { if (definirCamada) definirCamada(null); }, []);

      if (est.fase === 'sem') return null;
      const s = (pronto && est.jogador.s) || {};
      const tot = s.totalPass ?? (est.passes ? est.passes.length : null);
      const certos = s.accuratePass ?? (est.passes ? est.passes.filter((p) => p.ok).length : null);
      const botao = (ativo, onClick, rotulo) => (
        <button onClick={onClick} aria-pressed={ativo} className={'rounded px-2 py-0.5 text-xs ' + (ativo ? 'bg-ouro font-semibold text-breu' : 'bg-grafite/70 text-neutral-300 hover:bg-grafite')}>{rotulo}</button>
      );
      return (
        <div className="acoes-jogador mt-3 border-t border-white/5 pt-3">
          <h5 className="text-xs font-semibold text-neutral-400">Mapa de calor e passes</h5>
          {est.fase === 'carregando' && <p className="mt-1 text-xs text-neutral-500">Buscando no Sofascore…</p>}
          {est.fase === 'erro' && <p className="mt-1 text-xs text-neutral-500">{sofaBloqueado ? 'O Sofascore não libera os dados para sites publicados, então o mapa de calor e os passes só aparecem com o arquivo aberto direto no computador.' : 'Não consegui consultar o Sofascore agora. Confira a conexão.'}</p>}
          {est.fase === 'semJogo' && <p className="mt-1 text-xs text-neutral-500">O Sofascore não tem este jogo.</p>}
          {est.fase === 'semJogador' && <p className="mt-1 text-xs text-neutral-500">Não achei {ent.nome || 'este jogador'} na escalação do Sofascore para este jogo.</p>}
          {pronto && (
            <>
              <div className="mt-2 flex flex-wrap items-center gap-1.5">
                {est.passes && est.temCalor && botao(modo === 'ambos', () => setModo('ambos'), 'Calor e passes')}
                {est.passes && est.temCalor && botao(modo === 'calor', () => setModo('calor'), 'Calor')}
                {est.passes && est.temCalor && botao(modo === 'passes', () => setModo('passes'), 'Passes')}
                {est.passes && modo !== 'calor' && (
                  <span className="ml-auto flex gap-1">
                    {botao(filtro === 'todos', () => setFiltro('todos'), 'Todos')}
                    {botao(filtro === 'certos', () => setFiltro('certos'), 'Certos')}
                    {botao(filtro === 'errados', () => setFiltro('errados'), 'Errados')}
                  </span>
                )}
              </div>
              <div className="relative mt-2">
                <CampoSVG rotulo={`Mapa de calor e passes de ${ent.nome}`}>
                  {imagem && modo !== 'passes' && <image href={imagem} x={0} y={0} width={L} height={A} preserveAspectRatio="none" />}
                  <defs>
                    {[['ok', cor], ['erro', '#F87171'], ['chave', '#FFFFFF']].map(([k, c]) => (
                      <marker key={k} id={`ponta-${k}-${ent.chave}`} viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse">
                        <path d="M 0 0 L 10 5 L 0 10 z" fill={c} />
                      </marker>
                    ))}
                  </defs>
                  {modo !== 'calor' && passes.map((p, i) => {
                    const tipo = p.chave || p.assist ? 'chave' : p.ok ? 'ok' : 'erro';
                    const c = tipo === 'chave' ? '#FFFFFF' : tipo === 'ok' ? cor : '#F87171';
                    const ativo = foco === i;
                    return (
                      <g key={i} onMouseEnter={() => setFoco(i)} onMouseLeave={() => setFoco(null)} onClick={() => setFoco(ativo ? null : i)} style={{ cursor: 'pointer' }}>
                        <line x1={p.x1} y1={p.y1} x2={p.x2} y2={p.y2} stroke={c} strokeWidth={ativo ? 0.55 : tipo === 'chave' ? 0.42 : 0.3}
                          strokeDasharray={tipo === 'erro' ? '1 0.7' : undefined} opacity={foco == null || ativo ? 0.95 : 0.35} markerEnd={`url(#ponta-${tipo}-${ent.chave})`} />
                        <circle cx={p.x1} cy={p.y1} r={0.55} fill={c} opacity={foco == null || ativo ? 0.95 : 0.35} />
                        <line x1={p.x1} y1={p.y1} x2={p.x2} y2={p.y2} stroke="transparent" strokeWidth={2.4} />
                      </g>
                    );
                  })}
                </CampoSVG>
                {foco != null && passes[foco] && (
                  <div className="pointer-events-none absolute left-2 top-2 rounded border border-white/10 bg-breu/95 px-2 py-1 text-xs text-neutral-200">
                    Passe {passes[foco].assist ? 'para gol (assistência)' : passes[foco].chave ? 'decisivo' : passes[foco].ok ? 'certo' : 'errado'}, {Math.round(Math.hypot(passes[foco].x2 - passes[foco].x1, passes[foco].y2 - passes[foco].y1))} m
                  </div>
                )}
              </div>
              <div className="mt-1.5 flex flex-wrap gap-x-3 gap-y-0.5 text-[11px] text-neutral-400">
                {est.passes && modo !== 'calor' && <><span><span style={{ color: cor }}>━</span> certo</span><span><span className="text-red-400">╍</span> errado</span><span><span className="text-white">━</span> decisivo</span></>}
                {modo !== 'passes' && <span>Mais forte onde ele mais esteve</span>}
                <span>{ent.time === 'galo' ? 'Galo' : ev.adversario.nome} ataca para a {ent.time === 'galo' ? 'direita' : 'esquerda'}</span>
              </div>
              <p className="mt-2 text-xs text-neutral-300">
                {tot != null ? <>Passes: <span className="text-white">{certos} certos de {tot}</span> ({pct(certos, tot)}%)</> : 'Sem números de passe'}
                {s.totalLongBalls ? `. Bolas longas: ${s.accurateLongBalls || 0} de ${s.totalLongBalls}` : ''}
                {s.totalOppositionHalfPasses ? `. No campo adversário: ${s.accurateOppositionHalfPasses || 0} de ${s.totalOppositionHalfPasses}` : ''}
                {s.keyPass ? `. Passes decisivos: ${s.keyPass}` : ''}
                {s.totalCross ? `. Cruzamentos: ${s.accurateCross || 0} de ${s.totalCross}` : ''}
                {s.touches ? `. Toques: ${s.touches}` : ''}
                {s.rating ? `. Nota Sofascore: ${String(s.rating).replace('.', ',')}` : ''}.
              </p>
              {est.passes && <p className="mt-1 text-[11px] text-neutral-500">No mapa estão as {est.passes.length} bolas que ele tentou passar, cruzamentos incluídos ({est.passes.filter((p) => p.ok).length} certas).</p>}
              {!est.passes && <p className="mt-1 text-[11px] text-neutral-500">A posição de cada passe só existe no Sofascore a partir de 2026; aqui vão os totais.</p>}
              {!est.temCalor && <p className="mt-1 text-[11px] text-neutral-500">O Sofascore não tem o mapa de calor dele neste jogo.</p>}
              {setNoCampo && (
                <label className="mt-2 flex items-center gap-2 text-xs text-neutral-300">
                  <input type="checkbox" checked={!!noCampo} onChange={(e) => setNoCampo(e.target.checked)} className="accent-[#C69C3E]" />
