            let j = jogadores.find((x) => x.sofaId === p.id) || casarJogador(jogadores, [p.nome]);
            if (!j) { j = { nome: p.nome, comps: {} }; jogadores.push(j); }
            j.sofaId = p.id; j.sofaNome = p.nome;
            const { id, nome, ...num } = p;
            j.comps[chave] = { ...num, fonte: 'sofa' };
          });
        });
        jogadores.forEach((j) => { j.total = somarComps(j.comps); });
        return { ano, sofascore: [...doSofa], galodigital: !!gd, jogadores: jogadores.filter((j) => j.total.jogos > 0) };
      });
    }

    // Junta os números completos ao índice da ESPN (e cria quem só aparece no Sofascore/Galo Digital)
    async function completarIndice(lista, aoProgredir) {
      const anos = [];
      for (let a = PRIMEIRO_ANO_COMPLETO; a <= ANO_ATUAL; a++) anos.push(a);
      const { res, falhas } = await emLotes(anos, 2, (a) => carregarTemporadaCompleta(a), aoProgredir);
      const nova = lista.map((j) => ({ ...j, temporadas: j.temporadas.map((t) => ({ ...t, fonte: 'espn' })) }));
      const extras = [];
      const aplicar = (j, t, m) => {
        const tot = m.total;
        Object.assign(t, {
          jogos: tot.jogos, gols: tot.gols, assist: tot.assist, titular: tot.titular, minutos: tot.minutos || null, nota: tot.nota, sofridos: tot.sofridos,
          amarelos: Math.max(tot.amarelos, t.amarelos || 0), vermelhos: Math.max(tot.vermelhos, t.vermelhos || 0),
          comps: m.comps, fonte: 'completo',
        });
        if (m.gd && !j.gd) j.gd = m.gd;
        if (m.sofaId && !j.sofaId) j.sofaId = m.sofaId;
      };
      anos.forEach((ano, i) => {
        const tc = res[i];
        if (!tc) return;
        const livres = [...tc.jogadores];
        const tirar = (m) => livres.splice(livres.indexOf(m), 1);
        // 1) jogadores da ESPN que estavam no elenco daquele ano
        nova.forEach((j) => {
          const t = j.temporadas.find((x) => x.ano === ano);
          if (!t) return;
          const m = casarJogador(livres, [j.nome, j.completo], 60);
          if (m) { aplicar(j, t, m); tirar(m); }
        });
        // 2) mesmo jogador, mas sem cadastro da ESPN naquele ano (casamento exato ou pela página/id)
        [...livres].forEach((m) => {
          const j = nova.find((x) => (m.gd && x.gd === m.gd) || (m.sofaId && x.sofaId === m.sofaId))
            || (() => { const c = nova.filter((x) => notaNome(x.nome, m.nome) === 100 || (m.sofaNome && notaNome(x.nome, m.sofaNome) === 100)); return c.length === 1 ? c[0] : null; })();
          if (!j || j.temporadas.some((x) => x.ano === ano)) return;
          const t = { ano, numero: '', jogos: 0, gols: 0, assist: 0, amarelos: 0, vermelhos: 0 };
          j.temporadas.push(t);
          aplicar(j, t, m); tirar(m);
        });
        // 3) quem só existe no Sofascore ou no Galo Digital
        livres.forEach((m) => {
          let e = extras.find((x) => (m.gd && x.gd === m.gd) || (m.sofaId && x.sofaId === m.sofaId) || notaNome(x.nome, m.nome) === 100);
          if (!e) {
            e = { id: 'c' + (m.sofaId || semAcento(m.gd || m.nome).replace(/\W+/g, '-')), tipo: 'completo', nome: m.sofaNome || m.nome, completo: m.gd || '', pos: m.pos || '', gd: m.gd || null, sofaId: m.sofaId || null, temporadas: [] };
            extras.push(e);
          }
          if (m.gd && !e.gd) e.gd = m.gd;
          if (m.sofaId && !e.sofaId) e.sofaId = m.sofaId;
          if (!e.pos && m.pos) e.pos = m.pos;
          const t = { ano, numero: '', jogos: 0, gols: 0, assist: 0, amarelos: 0, vermelhos: 0 };
          e.temporadas.push(t);
          aplicar(e, t, m);
        });
      });
      const fechar = (j) => {
        const anosJ = j.temporadas.map((t) => t.ano);
        const soma = (k) => j.temporadas.reduce((s, t) => s + (t[k] || 0), 0);
        return { ...j, jogos: soma('jogos'), gols: soma('gols'), assist: soma('assist'), amarelos: soma('amarelos'), vermelhos: soma('vermelhos'),
          primeiro: Math.min(...anosJ), ultimo: Math.max(...anosJ), atual: anosJ.includes(ANO_ATUAL) };
      };
      return { lista: nova.map(fechar), extras: extras.map(fechar), falhas };
    }

    // Perfil do Sofascore (altura, pé, clube atual)
    function carregarJogadorSofa(id) {
      return comCache('sofa:jog:' + id, 7 * 864e5, async () => {
        const r = await sofaApi(`player/${id}`);
        const p = r.player || {};
        return {
          nome: p.name || '', altura: p.height || null, pe: { Right: 'direito', Left: 'esquerdo', Both: 'os dois' }[p.preferredFoot] || '',
          posicao: p.position || '', camisa: p.shirtNumber || p.jerseyNumber || '', clube: (p.team && p.team.name) || '',
          nasc: p.dateOfBirthTimestamp ? new Date(p.dateOfBirthTimestamp * 1000).toISOString().slice(0, 10) : null,
          url: p.slug ? `https://www.sofascore.com/player/${p.slug}/${id}` : null,
        };
      });
    }

    /* ---------- Súmula pelo Sofascore (fonte principal dos jogos) ----------
       Escalação na ordem da formação (cada linha da direita para a esquerda de quem ataca), substituições,
       cartões e gols pelos incidentes, números de cada jogador, estatísticas do time, momento de ataque e
       mapa de chutes. A ESPN entra só onde o Sofascore não tiver o jogo. */
    const SOFA_ESTAT = {
      ballPossession: 'possessionPct', totalShotsOnGoal: 'totalShots', shotsOnGoal: 'shotsOnTarget', cornerKicks: 'wonCorners',
      fouls: 'foulsCommitted', offsides: 'offsides', yellowCards: 'yellowCards', redCards: 'redCards', expectedGoals: 'expectedGoals',
      bigChanceCreated: 'bigChanceCreated', passes: 'passes', accuratePasses: 'accuratePasses', goalkeeperSaves: 'goalkeeperSaves', totalTackle: 'totalTackle',
    };
    const SOFA_STATUS = { '1st half': '1º tempo', '2nd half': '2º tempo', Halftime: 'Intervalo', Ended: 'Encerrado', AET: 'Encerrado na prorrogação', AP: 'Encerrado nos pênaltis', Penalties: 'Pênaltis', 'Extra time': 'Prorrogação', 'Awaiting extra time': 'Antes da prorrogação', Postponed: 'Adiado', Canceled: 'Cancelado' };
    const acrescimo = (i) => (i.addedTime && i.addedTime < 60 ? i.addedTime : 0);
    const minIncidente = (i) => (i.time || 0) + acrescimo(i);
    const rotuloIncidente = (i) => (acrescimo(i) ? `${i.time}+${acrescimo(i)}'` : `${i.time}'`);

    // Códigos de profundidade por linha da formação (entendidos por posicionarEscalacao)
    function codigosDaFormacao(formacao) {
      const cont = (formacao || '').split('-').map(Number).filter((n) => n > 0);
      const meio = cont.length - 2;
      const doMeio = meio === 1 ? ['M'] : meio === 2 ? ['DM', 'AM'] : meio === 3 ? ['DM', 'M', 'AM'] : ['DM', 'M', 'M', 'AM'];
      const out = [];
      cont.forEach((n, li) => { const c = li === 0 ? 'D' : li === cont.length - 1 ? 'F' : doMeio[li - 1] || 'M'; for (let k = 0; k < n; k++) out.push(c); });
      return out;
    }

    function montarSumulaSofa({ evt, lin, inc, est, graf, mapa }, sofaEv, ev, espn) {
      const casa = sofaEv.casa;
      const ladoDe = (isHome) => (isHome === casa ? 'galo' : 'adv');
      const incid = ((inc && inc.incidents) || []).filter((i) => !i.rescinded);
      const subs = incid.filter((i) => i.incidentType === 'substitution' && i.playerIn && i.playerOut);
      const cards = incid.filter((i) => i.incidentType === 'card' && i.player);

      // Liga cada jogador ao cadastro da ESPN do mesmo jogo (mantém perfil e temporada da ESPN funcionando)
      const espnDe = (ld) => {
        const e = ((espn && espn.escalacoes) || []).find((x) => x.lado === ld);
        return e ? e.titulares.concat(e.reservas || []) : [];
      };
      const idDe = (p, ld) => {
        const lista = espnDe(ld);
        const num = String(p.shirtNumber ?? p.jerseyNumber ?? '');
        const nome = p.player.name || '';
        const porNum = lista.find((x) => x.numero && String(x.numero) === num && notaNome(x.nome, nome) >= 20);
        const porNome = porNum || lista.find((x) => notaNome(x.nome, nome) >= 60);
        return porNome ? porNome.id : 'sofa-' + p.player.id;
      };

      const escalacoes = [], jogadores = { galo: [], adv: [] }, substituicoes = [];
      [['home', true], ['away', false]].forEach(([k, isHome]) => {
        const t = lin && lin[k];
        if (!t || !Array.isArray(t.players) || !t.players.length) return;
        const ld = ladoDe(isHome);
        const codigos = codigosDaFormacao(t.formation);
        const tit = t.players.filter((p) => !p.substitute);
        const formacaoOk = codigos.length === tit.length - 1;
        const amarelos = (pid) => cards.filter((c) => c.player.id === pid && c.incidentClass === 'yellow').length;
        const vermelho = (pid) => cards.find((c) => c.player.id === pid && /red/i.test(c.incidentClass || ''));
        const ids = new Map();
        const base = (p, i, titular) => {
          const id = idDe(p, ld);
          ids.set(p.player.id, id);
          const v = vermelho(p.player.id);
          const s = p.statistics || {};
          return {
            id, sofaId: p.player.id, nome: p.player.name || p.player.shortName || '', numero: String(p.shirtNumber ?? p.jerseyNumber ?? ''),
            pos: titular ? (i === 0 && p.position === 'G' ? 'G' : formacaoOk ? codigos[i - 1] : p.position || '') : p.position || '',
            lugar: -i, titular, entrou: false, saiu: false, substituiu: null, minEntrada: titular ? 0 : null, minSaida: null,
            minVermelho: v ? minIncidente(v) : null,
            stats: {
              totalGoals: s.goals || 0, goalAssists: s.goalAssist || 0, totalShots: s.totalShots ?? ((s.onTargetScoringAttempt || 0) + (s.shotOffTarget || 0) + (s.blockedScoringAttempt || 0)),
              shotsOnTarget: s.onTargetScoringAttempt || 0, foulsCommitted: s.fouls || 0, foulsSuffered: s.wasFouled || 0, offsides: s.totalOffside || 0,
              saves: s.saves || 0, yellowCards: amarelos(p.player.id), redCards: v ? 1 : 0,
              rating: s.rating || null, totalPass: s.totalPass || 0, accuratePass: s.accuratePass || 0, touches: s.touches || 0, keyPass: s.keyPass || 0,
            },
            minutosSofa: s.minutesPlayed || 0,
          };
        };
        const titulares = tit.map((p, i) => base(p, i, true));
        const reservas = t.players.filter((p) => p.substitute).map((p, i) => base(p, i, false));
        const todos = titulares.concat(reservas);
        const porSofa = new Map(todos.map((p) => [p.sofaId, p]));
        subs.filter((s) => ladoDe(s.isHome) === ld).sort((a, b) => minIncidente(a) - minIncidente(b)).forEach((s) => {
          const entra = porSofa.get(s.playerIn.id), sai = porSofa.get(s.playerOut.id);
          const min = minIncidente(s);
          if (entra) { entra.entrou = true; entra.minEntrada = min; entra.substituiu = sai ? sai.id : null; if (sai) entra.pos = entra.pos || sai.pos; }
          if (sai) { sai.saiu = true; sai.minSaida = min; }
          substituicoes.push({ min, lado: ld, entrou: s.playerIn.name || (entra && entra.nome) || '', saiu: s.playerOut.name || (sai && sai.nome) || '' });
        });
        todos.forEach((p) => {
          if (p.titular || p.entrou) jogadores[ld].push({ ...p, minutos: p.minutosSofa || Math.max(p.entrou ? 1 : 0, Math.min(90, p.minSaida ?? p.minVermelho ?? 90) - (p.titular ? 0 : p.minEntrada || 0)) });
        });
        escalacoes.push({ lado: ld, formacao: formacaoOk ? t.formation : '', titulares, reservas, fonte: 'sofa' });
      });
      substituicoes.sort((a, b) => (a.min ?? 0) - (b.min ?? 0));

      // Gols: quem marcou sai da mudança do placar (vale também para gol contra)
      let antes = { h: 0, a: 0 };
      const gols = incid.filter((i) => i.incidentType === 'goal').sort((a, b) => minIncidente(a) - minIncidente(b)).map((i) => {
        const h = i.homeScore ?? antes.h, a = i.awayScore ?? antes.a;
        const homeMarcou = h > antes.h || (h === antes.h && a === antes.a ? i.isHome : false);
        antes = { h, a };
        return {
          min: minIncidente(i), rotulo: rotuloIncidente(i), time: ladoDe(homeMarcou),
          autor: (i.player && i.player.name) || '', contra: i.incidentClass === 'ownGoal', penalti: i.incidentClass === 'penalty',
        };
      });
      const cartoes = cards.map((c) => ({ rotulo: rotuloIncidente(c), time: ladoDe(c.isHome), jogador: c.player.name || '', vermelho: /red/i.test(c.incidentClass || '') }));

      // Estatísticas do time (período "ALL")
      const estatisticas = [];
      const per = ((est && est.statistics) || []).find((p) => p.period === 'ALL') || ((est && est.statistics) || [])[0];
      if (per) {
        const g = { lado: 'galo' }, a = { lado: 'adv' };
        (per.groups || []).forEach((gr) => (gr.statisticsItems || []).forEach((it) => {
          const chave = SOFA_ESTAT[it.key];
          if (!chave || g[chave] != null) return;
          const hv = Number(it.homeValue ?? parseFloat(it.home)), av = Number(it.awayValue ?? parseFloat(it.away));
          if (!Number.isFinite(hv) || !Number.isFinite(av)) return;
          const arred = (x) => (chave === 'expectedGoals' ? Math.round(x * 100) / 100 : Math.round(x));
          (casa ? g : a)[chave] = arred(hv); (casa ? a : g)[chave] = arred(av);
        }));
        estatisticas.push(g, a);
      }

      // Momento de ataque do Sofascore (positivo = mandante)
      let momento = null;
      const pts = (graf && graf.graphPoints) || [];
      if (pts.length >= 5) {
        const serie = pts.map((p) => {
          const v = Number(p.value) || 0;
          const galo = casa ? Math.max(v, 0) : Math.max(-v, 0), adv = casa ? Math.max(-v, 0) : Math.max(v, 0);
          return { minuto: p.minute, galo, adversario: -adv };
        });
        const max = Math.max(1, ...serie.map((s) => Math.max(s.galo, -s.adversario)));
        const somaG = serie.reduce((s, x) => s + x.galo, 0), somaA = serie.reduce((s, x) => s - x.adversario, 0);
        momento = {
          fonte: 'sofa', fim: Math.max(90, Math.ceil(pts[pts.length - 1].minute)),
          dominio: Math.round((somaG / (somaG + somaA || 1)) * 100),
          serie: serie.map((s) => ({ minuto: s.minuto, galo: Math.round((s.galo / max) * 100), adversario: Math.round((s.adversario / max) * 100) })),
        };
      }

      // Chutes: o Sofascore mede x a partir do gol atacado e y invertido em relação à ESPN
      const TIPO = { goal: 'gol', save: 'alvo', miss: 'fora', post: 'fora', block: 'bloqueado' };
      const finalizacoes = ((mapa && mapa.shotmap) || []).filter((s) => s.playerCoordinates && TIPO[s.shotType] && s.goalType !== 'own').map((s) => {
        const fim = s.blockCoordinates ? { x: 100 - s.blockCoordinates.x, y: 100 - s.blockCoordinates.y }
          : s.shotType === 'goal' && s.goalMouthCoordinates ? { x: 100, y: 50 + (50 - s.goalMouthCoordinates.y) * 0.1 } : null;
        return {
          lado: ladoDe(s.isHome), tipo: TIPO[s.shotType], x: 100 - s.playerCoordinates.x, y: 100 - s.playerCoordinates.y,
          x2: fim ? fim.x : null, y2: fim ? fim.y : null, jogador: (s.player && s.player.name) || '', rotulo: rotuloIncidente(s), xg: s.xg || null,
        };
      }).reverse();

      const e = (evt && evt.event) || {};
      const st = e.status || {};
      const estado = st.type === 'inprogress' ? 'in' : st.type === 'finished' ? 'post' : 'pre';
      const gHome = e.homeScore && e.homeScore.current, gAway = e.awayScore && e.awayScore.current;
      const golsGalo = casa ? gHome : gAway, golsAdv = casa ? gAway : gHome;
      const tm = e.time || {};
      const prorrogacao = /AET|AP|extra|penal/i.test(st.description || '') || tm.injuryTime3 != null || tm.injuryTime4 != null;
      const fimJogo = prorrogacao ? 120 + (tm.injuryTime4 || 0) : 90 + (tm.injuryTime2 || 0);
      let relogio = '';
      if (estado === 'in' && tm.currentPeriodStartTimestamp) {
        const base = /2nd/i.test(st.description || '') ? 45 : /extra/i.test(st.description || '') ? 90 : 0;
        relogio = `${base + Math.max(1, Math.ceil((Date.now() / 1000 - tm.currentPeriodStartTimestamp) / 60))}'`;
      }
      return {
        fonte: 'sofa', sofaId: sofaEv.id, estado,
        gols, cartoes, escalacoes, substituicoes, jogadores, estatisticas, momento, finalizacoes,
        fimJogo: Math.max(90, fimJogo, momento ? momento.fim : 0),
        aoVivo: {
          estado, detalhe: [SOFA_STATUS[st.description] || st.description || '', relogio].filter(Boolean).join(', '), relogio,
          mandante: estado === 'pre' || golsGalo == null ? null : ev.galoCasa ? golsGalo : golsAdv,
          visitante: estado === 'pre' || golsGalo == null ? null : ev.galoCasa ? golsAdv : golsGalo,
        },
        publico: e.attendance || null, arbitro: (e.referee && e.referee.name) || '',
      };
    }

    async function baixarSumulaSofa(sofaEv) {
      const id = sofaEv.id;
      const [evt, lin, inc, est, graf, mapa] = await Promise.all([
        sofaApi(`event/${id}`).catch(nuloSe404), sofaApi(`event/${id}/lineups`).catch(nuloSe404), sofaApi(`event/${id}/incidents`).catch(nuloSe404),
        sofaApi(`event/${id}/statistics`).catch(nuloSe404), sofaApi(`event/${id}/graph`).catch(nuloSe404), sofaApi(`event/${id}/shotmap`).catch(nuloSe404),
      ]);
      if (!lin && !inc && !evt) return null;
      return { evt, lin, inc, est, graf, mapa };
    }

    // Súmula final do app: Sofascore quando houver; ESPN completa o que faltar (e é a reserva se o Sofascore falhar)
    async function carregarSumula(ev, forcar) {
      if (ev.fonte === 'gd') return null;   // jogo antigo: só há a ficha do Galo Digital
      const espnP = carregarResumo(ev, forcar).catch(() => null);
      if (ev.estado === 'pre') {
        const espn = await espnP;
        if (!pertoDoJogo(ev)) return espn;
        // Escalação confirmada antes do apito: o Sofascore publica cerca de 1 h antes do jogo
        const chavePre = `cache:sofapre:${ev.id}`;
        const cp = store.get(chavePre);
        let sofaPre;
        if (cp && !forcar && Date.now() - cp.t < 2 * 60e3) sofaPre = cp.v;
        else {
          try {
            const e = await carregarEventoSofa(ev);
            const lin = e ? await sofaApi(`event/${e.id}/lineups`).catch(nuloSe404) : null;
            sofaPre = lin && lin.confirmed === true ? montarSumulaSofa({ lin }, e, ev, espn) : null;
            store.set(chavePre, { t: Date.now(), v: sofaPre });
          } catch (err) { sofaPre = cp ? cp.v : null; }
        }
        if (sofaPre && sofaPre.escalacoes.length) {
          return { ...(espn || {}), escalacoes: sofaPre.escalacoes, jogadores: sofaPre.jogadores, substituicoes: [], gols: [], cartoes: [], fonte: 'sofa', confirmada: true };
        }
        if (espn && espn.escalacoes && espn.escalacoes.length) return { ...espn, fonte: 'espn', confirmada: true };
        return espn;
      }
      const chave = `cache:sofasum:${ev.id}`;
      const c = store.get(chave);
      const inicio = new Date(ev.data).getTime();
      const definitiva = c && c.v && c.v.estado === 'post' && c.t - inicio > 24 * 3600e3;
      const validade = ev.estado === 'in' ? 45e3 : definitiva ? 365 * 864e5 : 15 * 60e3;
      let sofa = c && !forcar && Date.now() - c.t < validade ? c.v : undefined;
      const espn = await espnP;
      if (sofa === undefined) {
        try {
          const e = await carregarEventoSofa(ev);
          const bruto = e ? await baixarSumulaSofa(e) : null;
          sofa = bruto ? montarSumulaSofa(bruto, e, ev, espn) : null;
          store.set(chave, { t: Date.now(), v: sofa });
        } catch (err) {
          sofa = c ? c.v : null;
        }
      }
      if (!sofa) return espn;
      if (!espn) return sofa;
      const temEsc = sofa.escalacoes.length > 0;
      return {
        ...espn,
        ...sofa,
        escalacoes: temEsc ? sofa.escalacoes : espn.escalacoes,
        substituicoes: temEsc ? sofa.substituicoes : espn.substituicoes,
        jogadores: temEsc ? sofa.jogadores : espn.jogadores,
        gols: sofa.gols.length || !espn.gols.length ? sofa.gols : espn.gols,
        cartoes: sofa.cartoes.length ? sofa.cartoes : espn.cartoes,
        estatisticas: sofa.estatisticas.length ? sofa.estatisticas : espn.estatisticas,
        momento: sofa.momento || espn.momento,
        finalizacoes: sofa.finalizacoes.length ? sofa.finalizacoes : espn.finalizacoes,
        publico: sofa.publico || espn.publico, arbitro: sofa.arbitro || espn.arbitro,
        fonte: temEsc ? 'sofa' : 'espn',
      };
    }

    /* ---------- Jogos anteriores a 2007, pelo Galo Digital ----------
       A ESPN começa em 2007. Para trás, lemos as tabelas de partidas das páginas de temporada
       (1950 e 1990 a 2006) e de competição (Campeonato Mineiro desde 1909, Brasileirão desde 1971,
       Libertadores, torneios internacionais...). O Galo Digital não tem todos os jogos antigos;
       entram os que ele registra. */
    const PRIMEIRO_ANO_HISTORIA = 1908;
    const COMP_SLUG_GD = { brasileirao: 'bra.1', libertadores: 'conmebol.libertadores', sulamericana: 'conmebol.sudamericana', copadobrasil: 'bra.copa_do_brazil', mineiro: 'bra.camp.mineiro', supercopa: 'bra.supercopa_do_brazil', mundial: 'fifa.cwc' };
    const COMP_NOME_GD = { brasileirao: 'Campeonato Brasileiro', libertadores: 'Copa Libertadores', sulamericana: 'Copa Sul-Americana', copadobrasil: 'Copa do Brasil', mineiro: 'Campeonato Mineiro', amistosos: 'Amistoso', supercopa: 'Supercopa do Brasil', mundial: 'Mundial de Clubes' };
    const PAGINAS_FORA = /Sub-|Feminin|J[uú]nior|Base|Futsal|Camisas|Conselho|T[eê]nis|Gols|Assist|Categoria|Basquete|V[oô]lei|Jogos Abertos|Juvenil|Juniores|Infantil|Aspirantes|Master|Amador|Society|Beach/i;
    const nomeBaseTime = (n) => semAcento((n || '').replace(/\s*-\s*[A-Z]{2,3}$/, ''));

    // Páginas do Galo Digital que podem ter jogos de um ano (temporada e competições), por ano
    function gdIndiceHistoria() {
      return comCache('gd:hist:indice', 30 * 864e5, async () => {
        let titulos = [], cont = '';
        for (let i = 0; i < 40; i++) {
          const r = await gdApi(`action=query&list=allpages&aplimit=500&apnamespace=0&apfilterredir=nonredirects${cont}`);
          titulos = titulos.concat(((r.query && r.query.allpages) || []).map((p) => p.title));
          if (!r.continue) break;
          cont = '&apcontinue=' + encodeURIComponent(r.continue.apcontinue);
        }
        const porAno = {};
        titulos.filter((t) => !/^\d/.test(t) && / \d{4}$/.test(t) && !PAGINAS_FORA.test(t)).forEach((t) => {
          const ano = Number(t.slice(-4));
          if (ano >= PRIMEIRO_ANO_HISTORIA && ano < PRIMEIRO_ANO) (porAno[ano] = porAno[ano] || []).push(t);
        });
        return porAno;
      });
    }

    // Linhas "| código | competição | rodada | data | mandante | placar | visitante | estádio" das wikitables
    function gdLerJogosDaPagina(titulo, texto) {
      const temporada = /Temporada/i.test(titulo);
      const compPagina = titulo.replace(/\s*\d{4}$/, '').trim();
      const out = [];
      (texto || '').split(/\n\|-(?![\d])/).forEach((bloco) => {
        const cel = [];
        bloco.split('\n').forEach((l) => {
          if (!/^[!|]/.test(l) || /^\|\}|^\|\+(?!\d)/.test(l)) return;
          l.slice(1).split(/!!|\|\|/).forEach((c) => {
            let x = c.replace(/\[\[([^\]|]*)\|([^\]]*)\]\]/g, '[[$1¦$2]]');
            const k = x.indexOf('|');
            if (k >= 0 && /=/.test(x.slice(0, k))) x = x.slice(k + 1);
            cel.push(x.replace(/¦/g, '|'));
          });
        });
        const limpo = cel.map((c) => gdLimpar(c));
        const iData = limpo.findIndex((c) => /^\d{1,2}\/\d{1,2}\/\d{4}$/.test(c.replace(/\s+/g, '')));
        if (iData < 0) return;
        const iPlacar = limpo.findIndex((c, i) => i > iData && /^\d+\s*(\(\d+\))?\s*x\s*(\(\d+\))?\s*\d+$/.test(c));
        if (iPlacar < 1 || iPlacar + 1 >= limpo.length) return;
        const [dd, mm, aa] = limpo[iData].replace(/\s+/g, '').split('/');
        const pl = /^(\d+)\s*(?:\((\d+)\))?\s*x\s*(?:\((\d+)\))?\s*(\d+)$/.exec(limpo[iPlacar]);
        const time = (i) => {
          const link = /\[\[([^\]|]+)(?:\|([^\]]+))?\]\]/.exec(cel[i] || '');
          const nome = limpo[i] || '';
          return { nome, pagina: link && !/^:?Categoria/i.test(link[1]) ? link[1].trim() : nome, galo: /^(Atl[eé]tico|Atl[eé]tico-MG|CAM)$/i.test(nome) };
        };
        const m = time(iPlacar - 1), v = time(iPlacar + 1);
        if (!m.galo && !v.galo) return;
        const codigo = (/\[\[(\d{6,}[A-Z0-9]*\s[^\]|]+?)\s*(?:\||\]\])/.exec(cel.join(' ')) || [])[1] || null;
        const antes = limpo.slice(0, iData).filter((c, i) => !(i === 0 && (/^\d+[A-Z]*$/.test(c) || codigo)) && c && c !== '-');
        const motivo = temporada ? antes[0] || '' : compPagina;
        const rodada = temporada ? antes[1] || '' : antes[antes.length - 1] || '';
        out.push({
          codigo, data: isoDe(dd, mm, aa), motivo, rodada: /^\d+$/.test(rodada) ? '' : rodada,
          mandante: m, visitante: v, gm: Number(pl[1]), gv: Number(pl[4]), pm: pl[2] != null ? Number(pl[2]) : null, pv: pl[3] != null ? Number(pl[3]) : null,
          estadio: limpo[iPlacar + 2] || '',
        });
      });
      return out;
    }

    function gdJogosDaPagina(titulo) {
      return comCache('gd:pag:' + titulo, 90 * 864e5, async () => {
        const w = await gdWikitexto(titulo);
        return w ? gdLerJogosDaPagina(w.titulo, w.texto) : [];
      });
    }

    // Converte uma linha do Galo Digital no formato de jogo do app
    function eventoGD(j) {
      const chaveC = chaveComp(j.motivo);
      const slug = COMP_SLUG_GD[chaveC] || 'outras';
      const competicao = COMP_NOME_GD[chaveC] || j.motivo || 'Outros jogos';
      const galoCasa = j.mandante.galo;
      const galo = galoCasa ? j.mandante : j.visitante, adv = galoCasa ? j.visitante : j.mandante;
      const gg = galoCasa ? j.gm : j.gv, ga = galoCasa ? j.gv : j.gm;
      const pg = galoCasa ? j.pm : j.pv, pa = galoCasa ? j.pv : j.pm;
      const penaltis = pg != null && pa != null && gg === ga;
      const resultado = gg > ga ? 'V' : gg < ga ? 'D' : penaltis ? (pg > pa ? 'V' : 'D') : 'E';
      // "Grêmio-RS" vira "Grêmio"; a sigla fica só onde o nome sozinho é ambíguo (América-MG, Atlético-PR...)
      const exibir = (n) => (/^(Am[eé]rica|Atl[eé]tico|Athletico|Nacional|Sport|Botafogo|Fluminense|Internacional|Juventude|Vit[oó]ria|Corinthians|Guarani|Ferrovi[aá]ria|Operário|Rio Branco|S[aã]o Bento|Democrata|Uberl[aâ]ndia)\b/i.test(n) ? n : n.replace(/\s*-\s*[A-Z]{2,3}$/, ''));
      const timeApp = (t, gols, ehGalo) => ({ id: ehGalo ? GALO_ID : 'gd:' + t.pagina, nome: ehGalo ? 'Atlético-MG' : exibir(t.nome), logo: '', gols, venceu: false, gdPagina: ehGalo ? null : t.pagina });
      const m = timeApp(j.mandante, j.gm, j.mandante.galo), v = timeApp(j.visitante, j.gv, j.visitante.galo);
      const est = /^(.*?)\s*\(([^)]*)\)\s*$/.exec(j.estadio || '');
      return {
        id: 'gd:' + (j.codigo || `${j.data}:${nomeBaseTime(adv.pagina)}:${gg}x${ga}`), slug, fonte: 'gd', gdTitulo: j.codigo,
        horaDefinida: false, semHora: true, neutro: false, nota: penaltis ? `Decidido nos pênaltis, ${pg} a ${pa}` : '', classificado: null,
        competicao, curto: COMP[slug] ? COMP[slug].curto : (COMP_NOMES[chaveC] || competicao), fase: j.rodada,
        data: `${j.data}T15:00:00-03:00`, estado: 'post', encerrado: true, adiado: false, relogio: '',
        estadio: est ? est[1] : j.estadio, cidade: est ? est[2] : '',
        mandante: m, visitante: v, galoCasa, adversario: galoCasa ? v : m,
        golsGalo: gg, golsAdv: ga, resultado, penaltis,
      };
    }

    async function carregarAnoGD(ano, aoProgredir) {
      const indice = await gdIndiceHistoria();
      const paginas = indice[ano] || [];
      const { res, falhas } = await emLotes(paginas, 4, (t) => gdJogosDaPagina(t), aoProgredir);
      const vistos = new Map();
      res.filter(Boolean).flat().forEach((j) => {
        if (Number(j.data.slice(0, 4)) !== ano) return;
        const adv = j.mandante.galo ? j.visitante : j.mandante;
        const chave = `${j.data}|${nomeBaseTime(adv.pagina)}|${j.gm}x${j.gv}`;
        const atual = vistos.get(chave);
        // A página da temporada costuma ser mais completa (competição, código da ficha)
        if (!atual || (!atual.codigo && j.codigo)) vistos.set(chave, atual ? { ...atual, codigo: j.codigo, motivo: atual.motivo || j.motivo } : j);
      });
      return { eventos: [...vistos.values()].map(eventoGD), falhas };
    }

    async function carregarHistoriaGD(aoProgredir) {
      const indice = await gdIndiceHistoria();
      const anos = Object.keys(indice).map(Number).sort((a, b) => a - b);
      const { res, falhas } = await emLotes(anos, 3, (a) => carregarAnoGD(a), aoProgredir);
      return { eventos: res.filter(Boolean).flatMap((r) => r.eventos), falhas };
    }

    /* ---------- Jogadores anteriores a 2007, pelo Galo Digital ----------
       Três fontes do Galo Digital: (1) a página de cada atleta da categoria "Atletas", com os números da
       carreira no Galo (no quadro "Info Atletas" ou, nas páginas antigas, na ficha e na biografia);
       (2) as fichas técnicas dos jogos antigos, que dão jogos e gols ano a ano, mas só nas partidas que
       têm ficha; (3) quem aparece nessas fichas sem ter página própria. */
    const ULTIMO_ANO_HISTORIA = PRIMEIRO_ANO - 1;
    function posDoTextoGD(txt) {
      const t = semAcento(gdLimpar(txt || ''));
      if (/goleir|arqueiro/.test(t)) return 'G';
      if (/zague|lateral|defens|beque|back|quarto/.test(t)) return 'D';
      if (/volante|meio|meia|half|medio|armador/.test(t)) return 'M';
      if (/atacante|ponta|centroavante|avante|ataque|extrema|artilh/.test(t)) return 'F';
      return '';
    }
    const contGD = (c) => (c ? '&' + Object.entries(c).map(([k, v]) => k + '=' + encodeURIComponent(v)).join('&') : '');
    const conteudoGD = (p) => (p.revisions && p.revisions[0] ? (p.revisions[0].slots ? p.revisions[0].slots.main.content : p.revisions[0].content) || '' : '');
    const NAO_IDENTIFICADO = /^n[aã]o identificad/i;

    // Todas as páginas da categoria "Atletas" (umas 1.500, de 50 em 50)
    async function gdTodosAtletas(aoProgredir) {
      const out = [];
      let cont = null;
      for (let i = 0; i < 80; i++) {
        const r = await gdApi('action=query&generator=categorymembers&gcmtitle=' + encodeURIComponent('Categoria:Atletas') + '&gcmnamespace=0&gcmlimit=50&prop=revisions&rvprop=content&rvslots=main' + contGD(cont));
        ((r.query && r.query.pages) || []).forEach((p) => {
          const texto = conteudoGD(p);
          if (/Categoria:\s*Atletas\s*-\s*Futebol Feminino/i.test(texto)) return;
          const a = gdLerAtleta(p.title, texto);
          if (!a) return;
          out.push({
            t: p.title, n: (a.nome || p.title).split(/,/)[0].trim(), c: a.completo !== p.title ? a.completo : '',
            p: posDoTextoGD(a.posicao), j: a.jogos || 0, g: a.gols || 0, v: a.v, e: a.e, d: a.d,
            de: a.anoEstreia, ate: a.anoUltimo, ns: a.anoNasc || null, tx: a.doTexto ? 1 : 0,
            noGalo: /Atl[eé]tico|CAM\b/.test(a.atual || ''),
          });
        });
        if (aoProgredir) aoProgredir();
        if (!r.continue) break;
        cont = r.continue;
      }
      return out;
    }

    // Fichas técnicas anteriores a 2007: quem jogou cada partida e quem marcou
    async function gdFichasHistoricas(aoProgredir) {
      let titulos = [], cont = null;
      for (let i = 0; i < 20; i++) {
        const r = await gdApi('action=query&list=allpages&apnamespace=0&apfrom=1900&apto=' + PRIMEIRO_ANO + '&aplimit=500' + contGD(cont));
        titulos = titulos.concat(((r.query && r.query.allpages) || []).map((p) => p.title));
        if (!r.continue) break;
        cont = r.continue;
      }
      titulos = titulos.filter((t) => { const m = /^(\d{4})\d{2}/.exec(t); return m && Number(m[1]) >= PRIMEIRO_ANO_HISTORIA && Number(m[1]) <= ULTIMO_ANO_HISTORIA; });
      const lotes = [];
      for (let i = 0; i < titulos.length; i += 50) lotes.push(titulos.slice(i, i + 50));
      const jogos = [];
      const { falhas } = await emLotes(lotes, 3, async (lote) => {
        const r = await gdApi('action=query&prop=revisions&rvprop=content&rvslots=main&titles=' + lote.map(encodeURIComponent).join('|'));
        ((r.query && r.query.pages) || []).forEach((p) => {
          const f = gdLerFicha(p.title, conteudoGD(p));
          if (!f) return;
          const quem = [];
          f.galo.titulares.forEach((x, i) => {
            quem.push({ nome: x.nome, gd: x.gd, gols: x.gols || 0, gol: i === 0 });
            if (x.sub && x.sub.nome) quem.push({ nome: x.sub.nome, gd: x.sub.gd, gols: x.sub.gols || 0, gol: i === 0 });
          });
          const validos = quem.filter((q) => q.nome && !NAO_IDENTIFICADO.test(q.nome) && !/^\?+$/.test(q.nome));
          if (validos.length) jogos.push({ ano: Number(p.title.slice(0, 4)), quem: validos });
        });
        if (aoProgredir) aoProgredir();
      });
      return { jogos, falhas };
    }

    // Lista final dos jogadores com passagem pelo Galo antes de 2007
    function carregarJogadoresHistoricos(aoProgredir) {
      return comCache('gd:jog:hist', 30 * 864e5, async () => {
        let feitos = 0;
        const passo = () => { feitos++; if (aoProgredir) aoProgredir(Math.min(feitos, 44), 44); };
        const [atletas, fichas] = await Promise.all([gdTodosAtletas(passo), gdFichasHistoricas(passo)]);
        if (!atletas.length) throw new Error('sem atletas');
        // Links das fichas que são redirecionamentos para a página do atleta
        const porTitulo = new Map(atletas.map((a) => [a.t, a]));
        const soltos = [...new Set(fichas.jogos.flatMap((j) => j.quem.map((q) => q.gd)).filter((t) => t && !porTitulo.has(t)))];
        const destino = new Map();
        for (let i = 0; i < soltos.length; i += 50) {
          try {
            const r = await gdApi('action=query&redirects=1&titles=' + soltos.slice(i, i + 50).map(encodeURIComponent).join('|'));
            const q = r.query || {};
            const norm = new Map((q.normalized || []).map((n) => [n.from, n.to]));
            const red = new Map((q.redirects || []).map((n) => [n.from, n.to]));
            soltos.slice(i, i + 50).forEach((t) => { const n = norm.get(t) || t; const d = red.get(n) || n; if (porTitulo.has(d)) destino.set(t, d); });
          } catch (e) {}
        }
        const porApelido = new Map();
        atletas.forEach((a) => { const k = semAcento(a.n); porApelido.set(k, [...(porApelido.get(k) || []), a]); });
        const anosDe = new Map(), soFichas = new Map();
        const somar = (mapa, chave, ano, gols) => { const m = mapa.get(chave) || {}; const y = m[ano] || [0, 0]; m[ano] = [y[0] + 1, y[1] + gols]; mapa.set(chave, m); };
        fichas.jogos.forEach(({ ano, quem }) => {
          const vistos = new Set();
          quem.forEach((q) => {
            let a = q.gd && (porTitulo.get(q.gd) || porTitulo.get(destino.get(q.gd)));
            if (!a) {
              const c = (porApelido.get(semAcento(q.nome)) || []).filter((x) => !x.de || (x.de <= ano && ano <= (x.ate || x.de)));
              if (c.length === 1) a = c[0];
            }
            const chave = a ? a.t : 'n:' + semAcento(q.nome);
            if (vistos.has(chave)) return;
            vistos.add(chave);
            if (a) { somar(anosDe, a.t, ano, q.gols); return; }
            const s = soFichas.get(chave) || { n: q.nome, gol: 0, jogos: 0, anos: {} };
            s.jogos++; if (q.gol) s.gol++;
            const y = s.anos[ano] || [0, 0]; s.anos[ano] = [y[0] + 1, y[1] + q.gols];
            soFichas.set(chave, s);
          });
        });
        const lista = [];
        atletas.forEach((a) => {
          const fa = anosDe.get(a.t) || null;
          const anosF = fa ? Object.keys(fa).map(Number) : [];
          const de = Math.min(...[a.de, ...anosF].filter(Boolean));
          let ate = Math.max(...[a.ate, ...anosF].filter(Boolean));
          if (!isFinite(de)) {
            // sem ano de estreia nem ficha: só entra quem nasceu cedo o bastante para ter jogado antes de 2007
            if (!(a.j > 0 && a.ns && a.ns <= 1978)) return;
          } else if (de > ULTIMO_ANO_HISTORIA || (!a.j && !anosF.length && !a.tx)) return;
          if (isFinite(de) && a.noGalo && !a.ate) ate = ANO_ATUAL;
          if (isFinite(de) && !isFinite(ate)) ate = de;
          const { noGalo, ...resto } = a;
          // Página sem número de jogos: conta o que as fichas registram
          const semNumero = !a.j && anosF.length;
          const j = semNumero ? Object.values(fa).reduce((s, x) => s + x[0], 0) : a.j;
          const g = semNumero ? Object.values(fa).reduce((s, x) => s + x[1], 0) : a.g;
          lista.push({ ...resto, id: a.t, j, g, sn: semNumero ? 1 : 0, de: isFinite(de) ? de : null, ate: isFinite(ate) ? ate : null, fichas: fa });
        });
        // Sem página própria: o mesmo nome em épocas distantes (mais de 8 anos sem aparecer) são jogadores diferentes
        soFichas.forEach((s, chave) => {
          const anos = Object.keys(s.anos).map(Number).sort((x, y) => x - y);
          const grupos = [];
          anos.forEach((y) => { const g = grupos[grupos.length - 1]; if (g && y - g[g.length - 1] <= 8) g.push(y); else grupos.push([y]); });
          grupos.forEach((g) => {
            const fichasG = Object.fromEntries(g.map((y) => [y, s.anos[y]]));
            const jg = g.reduce((x, y) => x + s.anos[y][0], 0);
            lista.push({
              id: 'f:' + chave.slice(2) + (grupos.length > 1 ? ':' + g[0] : ''), t: null, n: s.n, c: '', p: s.gol * 2 > s.jogos ? 'G' : '', j: jg,
              g: g.reduce((x, y) => x + s.anos[y][1], 0), de: g[0], ate: g[g.length - 1], fichas: fichasG, so: 1,
            });
          });
        });
        return { lista, fichas: fichas.jogos.length, falhas: fichas.falhas };
      });
    }

    function periodos(anos) {
      const a = [...new Set(anos)].sort((x, y) => x - y);
      const grupos = [];
      a.forEach((y) => { const g = grupos[grupos.length - 1]; if (g && y === g[1] + 1) g[1] = y; else grupos.push([y, y]); });
      return grupos.map(([i, f]) => (i === f ? String(i) : `${i}–${f}`));
    }
    const listaPt = (xs) => (xs.length <= 1 ? xs.join('') : xs.slice(0, -1).join(', ') + ' e ' + xs[xs.length - 1]);

    function contarTrajetoria(j, carreira) {
      const per = periodos(j.temporadas.map((t) => t.ano));
      const nac = paisPt(j.nac);
      let t = `${j.nome} (${posPt(j.pos).toLowerCase()}${nac ? ', ' + nac : ''})`;
      t += per.length > 1 ? ` teve ${per.length} passagens pelo Galo: ${per.join(', ')}.` : ` defendeu o Galo em ${per[0]}.`;
      t += ` Somou ${j.jogos} ${j.jogos === 1 ? 'jogo' : 'jogos'} e ${j.gols} ${j.gols === 1 ? 'gol' : 'gols'} ${j.completoCarregado ? 'somando ESPN, Sofascore e Galo Digital' : 'nos registros da ESPN'}.`;
      const melhorGols = [...j.temporadas].sort((a, b) => b.gols - a.gols)[0];
      const maisJogos = [...j.temporadas].sort((a, b) => b.jogos - a.jogos)[0];
      if (melhorGols && melhorGols.gols >= 3) t += ` A temporada mais goleadora foi ${melhorGols.ano}, com ${melhorGols.gols} gols.`;
      else if (maisJogos && maisJogos.jogos > 0) t += ` O ano em que mais atuou foi ${maisJogos.ano}, com ${maisJogos.jogos} jogos.`;
      if (j.atual) t += ' Segue no elenco atual.';
      if (carreira) {
        // O "clube atual" da ESPN às vezes fica desatualizado para quem já parou; só citamos até 40 anos.
        const idadeOk = carreira.idade == null || carreira.idade <= 40;
        if (!j.atual && carreira.clubeAtual && carreira.clubeAtualId !== GALO_ID && idadeOk) t += ` Pela ESPN, o clube mais recente é o ${carreira.clubeAtual}.`;
        const outros = carreira.clubes.filter((c) => c.id !== GALO_ID && c.id !== carreira.clubeAtualId && !PAISES[c.nome]).map((c) => c.nome);
        if (outros.length) t += ` Na carreira, também passou por ${listaPt(outros)}.`;
      }
      return t;
    }

    /* =========================================================
       5. QUADRO TÁTICO (Fabric.js, em metros)
       Tudo é desenhado num campo oficial de 105 × 68 m. O zoom só
       muda a escala, então setas, zonas e jogadores mantêm a
       proporção em qualquer tamanho, inclusive maximizado.
       ========================================================= */
    const L = 105, A = 68, MG = 3.5;
    const VW = L + 2 * MG, VH = A + 2 * MG;
    const R_FICHA = 2.1;
    const sx = (x) => x + MG, sy = (y) => y + MG;     // campo -> cena
    const cxm = (x) => x - MG, cym = (y) => y - MG;   // cena -> campo
    const CORES = [['#C69C3E', 'Dourado'], ['#F5F5F5', 'Branco'], ['#F87171', 'Vermelho'], ['#38BDF8', 'Azul'], ['#4ADE80', 'Verde']];
    const comAlfa = (hex, a) => {
      const n = parseInt(hex.slice(1), 16);
      return `rgba(${(n >> 16) & 255},${(n >> 8) & 255},${n & 255},${a})`;
    };

    // Formações-modelo: x = metros a partir do próprio gol; y = metros a partir da lateral esquerda de quem ataca.
    const FORMACOES = {
      '4-3-3': [['GOL', 'G', 5, 34], ['LE', 'D', 19, 9], ['ZAG', 'D', 15, 25], ['ZAG', 'D', 15, 43], ['LD', 'D', 19, 59], ['VOL', 'M', 26, 34], ['MC', 'M', 33, 21], ['MC', 'M', 33, 47], ['PE', 'F', 45, 11], ['CA', 'F', 48, 34], ['PD', 'F', 45, 57]],
      '4-2-3-1': [['GOL', 'G', 5, 34], ['LE', 'D', 19, 9], ['ZAG', 'D', 15, 25], ['ZAG', 'D', 15, 43], ['LD', 'D', 19, 59], ['VOL', 'M', 27, 26], ['VOL', 'M', 27, 42], ['ME', 'M', 39, 12], ['MEI', 'M', 38, 34], ['MD', 'M', 39, 56], ['CA', 'F', 48, 34]],
      '4-4-2': [['GOL', 'G', 5, 34], ['LE', 'D', 19, 9], ['ZAG', 'D', 15, 25], ['ZAG', 'D', 15, 43], ['LD', 'D', 19, 59], ['ME', 'M', 32, 10], ['MC', 'M', 30, 27], ['MC', 'M', 30, 41], ['MD', 'M', 32, 58], ['CA', 'F', 46, 27], ['CA', 'F', 46, 41]],
      '4-1-4-1': [['GOL', 'G', 5, 34], ['LE', 'D', 19, 9], ['ZAG', 'D', 15, 25], ['ZAG', 'D', 15, 43], ['LD', 'D', 19, 59], ['VOL', 'M', 25, 34], ['ME', 'M', 36, 10], ['MC', 'M', 35, 26], ['MC', 'M', 35, 42], ['MD', 'M', 36, 58], ['CA', 'F', 48, 34]],
      '3-5-2': [['GOL', 'G', 5, 34], ['ZAG', 'D', 15, 20], ['ZAG', 'D', 14, 34], ['ZAG', 'D', 15, 48], ['ALA', 'D', 30, 7], ['VOL', 'M', 26, 34], ['MC', 'M', 33, 23], ['MC', 'M', 33, 45], ['ALA', 'D', 30, 61], ['CA', 'F', 46, 27], ['CA', 'F', 46, 41]],
      '3-4-3': [['GOL', 'G', 5, 34], ['ZAG', 'D', 15, 20], ['ZAG', 'D', 14, 34], ['ZAG', 'D', 15, 48], ['ALA', 'D', 29, 8], ['MC', 'M', 28, 27], ['MC', 'M', 28, 41], ['ALA', 'D', 29, 60], ['PE', 'F', 44, 13], ['CA', 'F', 47, 34], ['PD', 'F', 44, 55]],
      '5-3-2': [['GOL', 'G', 5, 34], ['ALA', 'D', 21, 6], ['ZAG', 'D', 15, 20], ['ZAG', 'D', 14, 34], ['ZAG', 'D', 15, 48], ['ALA', 'D', 21, 62], ['MC', 'M', 30, 20], ['VOL', 'M', 27, 34], ['MC', 'M', 30, 48], ['CA', 'F', 44, 27], ['CA', 'F', 44, 41]],
    };
    const espelhar = (time, x, y) => (time === 'galo' ? { x, y } : { x: L - x, y: A - y });

    function desenharCampo(canvas) {
      const fixo = { selectable: false, evented: false, campo: true, objectCaching: false };
      const linha = { ...fixo, stroke: 'rgba(255,255,255,0.5)', strokeWidth: 0.22, fill: 'transparent' };
      const circ = (x, y, r, extra) => new fabric.Circle({ ...linha, left: sx(x), top: sy(y), radius: r, originX: 'center', originY: 'center', ...extra });
      const o = [];
      for (let i = 0; i < 10; i++) o.push(new fabric.Rect({ ...fixo, left: sx((i * L) / 10), top: sy(0), width: L / 10, height: A, fill: i % 2 ? 'rgba(0,0,0,0.05)' : 'rgba(255,255,255,0.035)', strokeWidth: 0 }));
      o.push(new fabric.Rect({ ...linha, left: sx(0), top: sy(0), width: L, height: A }));
      o.push(new fabric.Line([sx(L / 2), sy(0), sx(L / 2), sy(A)], linha));
      o.push(circ(L / 2, A / 2, 9.15));
      o.push(circ(L / 2, A / 2, 0.3, { fill: 'rgba(255,255,255,0.6)', strokeWidth: 0 }));
      [[0, 1], [L, -1]].forEach(([gx, d]) => {
        const area = (prof, larg) => new fabric.Rect({ ...linha, left: sx(d > 0 ? gx : gx - prof), top: sy(A / 2 - larg / 2), width: prof, height: larg });
        o.push(area(16.5, 40.32));
        o.push(area(5.5, 18.32));
        o.push(new fabric.Rect({ ...linha, left: sx(d > 0 ? gx - 2 : gx), top: sy(A / 2 - 3.66), width: 2, height: 7.32 }));
        o.push(circ(gx + d * 11, A / 2, 0.3, { fill: 'rgba(255,255,255,0.6)', strokeWidth: 0 }));
        const ang = Math.acos(5.5 / 9.15);
        o.push(circ(gx + d * 11, A / 2, 9.15, d > 0 ? { startAngle: -ang, endAngle: ang } : { startAngle: Math.PI - ang, endAngle: Math.PI + ang }));
      });
      [[0, 0, 0], [L, 0, 0.5], [L, A, 1], [0, A, 1.5]].forEach(([x, y, k]) => o.push(circ(x, y, 1, { startAngle: k * Math.PI, endAngle: (k + 0.5) * Math.PI })));
      o.push(new fabric.Text('Galo ataca ➜', { ...fixo, left: sx(0.5), top: sy(A) + 0.6, fontSize: 1.9, fontFamily: 'Barlow Condensed, sans-serif', fill: 'rgba(198,156,62,0.8)' }));
      canvas.add(...o);
    }

    const sobrenome = (nome) => {
      const partes = (nome || '').trim().split(/\s+/);
      const s = partes.length > 1 ? partes[partes.length - 1] : partes[0] || '';
      return s.length > 11 ? s.slice(0, 10) + '.' : s;
    };

    // Ficha de jogador (ou bola). (pos.x, pos.y) em metros = centro do círculo.
    function criarFicha(ent, pos, mostrarNome) {
      const bola = ent.time === 'bola', galo = ent.time === 'galo';
      let itens;
      if (bola) {
        itens = [
          new fabric.Circle({ radius: 0.95, fill: '#FFFFFF', stroke: '#111111', strokeWidth: 0.22, originX: 'center', originY: 'center', left: 0, top: 0, shadow: new fabric.Shadow({ color: 'rgba(0,0,0,0.6)', blur: 0.8, offsetY: 0.25 }) }),
          new fabric.Circle({ radius: 0.32, fill: '#111111', originX: 'center', originY: 'center', left: 0, top: 0 }),
        ];
      } else {
        itens = [
          new fabric.Circle({
            radius: R_FICHA, fill: galo ? '#111111' : '#7A7A7A', stroke: ent.expulso ? '#F87171' : galo ? OURO : '#FFFFFF', strokeWidth: 0.42,
            originX: 'center', originY: 'center', left: 0, top: 0, shadow: new fabric.Shadow({ color: 'rgba(0,0,0,0.55)', blur: 1.1, offsetY: 0.35 }),
          }),
          new fabric.Text(String(ent.numero ?? ''), { fontSize: 2.1, fontWeight: 'bold', fontFamily: 'Barlow Condensed, sans-serif', fill: galo ? OURO : '#FFFFFF', originX: 'center', originY: 'center', left: 0, top: 0.1 }),
        ];
        if (ent.entrou) itens.push(new fabric.Circle({ radius: 0.62, fill: '#4ADE80', stroke: '#111111', strokeWidth: 0.15, originX: 'center', originY: 'center', left: R_FICHA * 0.78, top: -R_FICHA * 0.78 }));
        if (mostrarNome && ent.nome) {
          itens.push(new fabric.Text(sobrenome(ent.nome), {
            fontSize: 1.55, fontWeight: '600', fontFamily: 'Barlow, sans-serif', fill: 'rgba(255,255,255,0.96)',
            originX: 'center', originY: 'top', left: 0, top: R_FICHA + 0.45, shadow: new fabric.Shadow({ color: 'rgba(0,0,0,0.95)', blur: 0.6 }),
          }));
        }
      }
      const g = new fabric.Group(itens, {
        originX: 'center', originY: 'center', hasControls: false, borderColor: galo ? OURO : '#FFFFFF', padding: 0.3,
        lockScalingX: true, lockScalingY: true, lockRotation: true, hoverCursor: 'grab', moveCursor: 'grabbing',
        opacity: ent.expulso ? 0.4 : 1,
      });
      g.dx = -itens[0].left;
      g.dy = -itens[0].top;
      g.set({ left: sx(pos.x) + g.dx, top: sy(pos.y) + g.dy });
      g.setCoords();
      g.ficha = true;
      g.chave = ent.chave;
      return g;
    }
    const centroFicha = (o) => ({ x: cxm(o.left - (o.dx || 0)), y: cym(o.top - (o.dy || 0)) });

    // Seta reta em coordenadas de cena (metros + margem)
    function criarSeta(x1, y1, x2, y2, estilo, cor, extra = {}) {
      const ang = Math.atan2(y2 - y1, x2 - x1);
      const comp = Math.hypot(x2 - x1, y2 - y1);
      const cab = Math.min(2.1, Math.max(0.9, comp * 0.4));
      const bx = x2 - Math.cos(ang) * cab * 0.85, by = y2 - Math.sin(ang) * cab * 0.85;
      const tracos = { passe: null, movimento: [1.1, 0.8], conducao: [0.15, 0.55], linha: null }[estilo];
      const linha = new fabric.Line([x1, y1, estilo === 'linha' ? x2 : bx, estilo === 'linha' ? y2 : by], {
        stroke: cor, strokeWidth: estilo === 'conducao' ? 0.45 : 0.36, strokeDashArray: tracos, strokeLineCap: 'round',
      });
      const partes = [linha];
      if (estilo !== 'linha') {
        partes.push(new fabric.Triangle({
          width: cab * 0.85, height: cab, fill: cor, originX: 'center', originY: 'center',
          left: x2 - (Math.cos(ang) * cab) / 2, top: y2 - (Math.sin(ang) * cab) / 2, angle: (ang * 180) / Math.PI + 90,
        }));
      }
      const g = new fabric.Group(partes, { hasControls: false, ...extra });
      g.desenho = estilo === 'linha' ? 'linha' : 'seta';
      return g;
    }

    // Traço livre suavizado com ponta de seta
    function criarTracoLivre(pts, cor) {
      const simp = [pts[0]];
      pts.forEach((p) => { const u = simp[simp.length - 1]; if (Math.hypot(p.x - u.x, p.y - u.y) > 0.9) simp.push(p); });
      const ult = pts[pts.length - 1];
      if (simp[simp.length - 1] !== ult) simp.push(ult);
      if (simp.length < 2) return null;
      const fim = simp[simp.length - 1];
      let ref = simp[simp.length - 2];
      for (let i = simp.length - 2; i >= 0; i--) { ref = simp[i]; if (Math.hypot(fim.x - ref.x, fim.y - ref.y) > 2.2) break; }
      const ang = Math.atan2(fim.y - ref.y, fim.x - ref.x);
      const cab = 2;
      const corte = { x: fim.x - Math.cos(ang) * cab * 0.85, y: fim.y - Math.sin(ang) * cab * 0.85 };
      const corpo = [...simp.slice(0, -1), corte];
      let d = `M ${corpo[0].x} ${corpo[0].y}`;
      for (let i = 1; i < corpo.length - 1; i++) {
        const mx = (corpo[i].x + corpo[i + 1].x) / 2, my = (corpo[i].y + corpo[i + 1].y) / 2;
        d += ` Q ${corpo[i].x} ${corpo[i].y} ${mx} ${my}`;
      }
      d += ` L ${corpo[corpo.length - 1].x} ${corpo[corpo.length - 1].y}`;
      const caminho = new fabric.Path(d, { stroke: cor, strokeWidth: 0.36, fill: '', strokeLineCap: 'round', strokeLineJoin: 'round', strokeDashArray: [1.1, 0.8] });
      const ponta = new fabric.Triangle({
        width: cab * 0.85, height: cab, fill: cor, originX: 'center', originY: 'center',
        left: fim.x - (Math.cos(ang) * cab) / 2, top: fim.y - (Math.sin(ang) * cab) / 2, angle: (ang * 180) / Math.PI + 90,
      });
      const g = new fabric.Group([caminho, ponta], { hasControls: false });
      g.desenho = 'livre';
      return g;
    }

    function criarRegua(x1, y1, x2, y2) {
      const dist = Math.hypot(x2 - x1, y2 - y1);
      const linha = new fabric.Line([x1, y1, x2, y2], { stroke: '#FFFFFF', strokeWidth: 0.2, strokeDashArray: [0.6, 0.4] });
      const ponta = (x, y) => new fabric.Circle({ left: x, top: y, radius: 0.35, fill: '#FFFFFF', originX: 'center', originY: 'center' });
      const rotulo = new fabric.Text(`${dist.toFixed(1).replace('.', ',')} m`, {
        left: (x1 + x2) / 2, top: (y1 + y2) / 2 - 0.5, originX: 'center', originY: 'bottom', fontSize: 1.8, fontWeight: '600',
        fontFamily: 'Barlow, sans-serif', fill: '#FFFFFF', backgroundColor: 'rgba(17,17,17,0.75)',
      });
      const g = new fabric.Group([linha, ponta(x1, y1), ponta(x2, y2), rotulo], { hasControls: false });
      g.desenho = 'regua';
      return g;
    }

    function aplicarFlags(o) {
      const tipo = o.desenho;
      const comControles = tipo === 'zona' || tipo === 'texto';
      o.set({ hasControls: comControles, lockRotation: !comControles, borderColor: OURO, cornerColor: OURO, cornerSize: 9, transparentCorners: false, padding: 0.4 });
      if (tipo === 'texto') o.set({ lockScalingFlip: true });
      return o;
    }

    const quadroVazio = () => ({ versao: 3, entidades: {}, fases: [{ nome: 'Fase 1', pos: {}, desenhos: [] }], atual: 0, provavel: null });

    // Hook com todo o comportamento do quadro
    function useQuadro(canvasRef, aoMudar) {
      const fabRef = useRef(null);
      const camadaRef = useRef(null);
      const qRef = useRef(quadroVazio());
      const histRef = useRef([]);
      const ferramentaRef = useRef('mover');
      const corRef = useRef(OURO);
      const nomesRef = useRef(true);
      const rastrosRef = useRef(true);
      const tocandoRef = useRef(false);
      const aoMudarRef = useRef(aoMudar);
      aoMudarRef.current = aoMudar;
      const [versao, setVersao] = useState(0);
      const [ferramenta, setFerramentaEstado] = useState('mover');
      const [cor, setCorEstado] = useState(OURO);
      const [mostrarNomes, setMostrarNomesEstado] = useState(true);
      const [mostrarRastros, setMostrarRastrosEstado] = useState(true);
      const [tocando, setTocando] = useState(false);
      const [selecionado, setSelecionado] = useState(null);
      const [alterado, setAlterado] = useState(false);

      const fichas = () => (fabRef.current ? fabRef.current.getObjects().filter((o) => o.ficha) : []);
      const posDe = (chave) => {
        const q = qRef.current;
        const atual = q.fases[q.atual].pos[chave];
        if (atual) return atual;
        for (const f of q.fases) if (f.pos[chave]) return f.pos[chave];
        return { x: L / 2, y: A / 2 };
      };

      function limparDinamicos() {
        const c = fabRef.current;
        c.discardActiveObject();
        c.getObjects().filter((o) => !o.campo).forEach((o) => c.remove(o));
      }

      function desenharRastros() {
        const c = fabRef.current, q = qRef.current;
        if (!rastrosRef.current || q.atual === 0) return;
        const ant = q.fases[q.atual - 1].pos, cur = q.fases[q.atual].pos;
        Object.keys(cur).forEach((k) => {
          const a = ant[k], b = cur[k];
          const ent = q.entidades[k];
          if (!a || !b || !ent) return;
          const d = Math.hypot(b.x - a.x, b.y - a.y);
          if (d < 1.5) return;
          const ux = (b.x - a.x) / d, uy = (b.y - a.y) / d;
          const recuo = ent.time === 'bola' ? 1.2 : R_FICHA + 0.3;
          const fantasma = new fabric.Circle({
            left: sx(a.x), top: sy(a.y), radius: ent.time === 'bola' ? 0.9 : R_FICHA, originX: 'center', originY: 'center',
            fill: 'transparent', stroke: 'rgba(255,255,255,0.45)', strokeWidth: 0.2, strokeDashArray: [0.5, 0.4], selectable: false, evented: false,
          });
          fantasma.rastro = true;
          const seta = criarSeta(sx(a.x + ux * recuo), sy(a.y + uy * recuo), sx(b.x - ux * recuo), sy(b.y - uy * recuo), ent.time === 'bola' ? 'passe' : 'movimento',
            ent.time === 'galo' ? 'rgba(198,156,62,0.85)' : 'rgba(255,255,255,0.7)', { selectable: false, evented: false });
          seta.rastro = true;
          seta.desenho = undefined;
          c.add(fantasma, seta);
        });
      }

      // Camada de análise (mapa de calor e passes de um jogador): fica sob as fichas e não é salva
      function desenharCamada() {
        const c = fabRef.current;
        if (!c) return;
        c.getObjects().filter((o) => o.camada).forEach((o) => c.remove(o));
        const k = camadaRef.current;
        if (k) {
          let idx = c.getObjects().filter((o) => o.campo).length;
          const add = (o) => { o.camada = true; o.desenho = undefined; o.selectable = false; o.evented = false; c.insertAt(o, idx++); };
          if (k.calor && k.calor.length) {
            const cv = pintarCalor(k.calor, k.time, 4);
            add(new fabric.Image(cv, { left: sx(0), top: sy(0), scaleX: L / cv.width, scaleY: A / cv.height, opacity: 0.95, objectCaching: false }));
          }
          (k.passes || []).forEach((p) => {
            const destaque = p.chave || p.assist;
            const corP = destaque ? 'rgba(255,255,255,0.95)' : !p.ok ? 'rgba(248,113,113,0.9)' : k.time === 'galo' ? 'rgba(198,156,62,0.95)' : 'rgba(163,163,163,0.95)';
            const g = criarSeta(sx(p.x1), sy(p.y1), sx(p.x2), sy(p.y2), p.ok ? 'passe' : 'movimento', corP);
            const [linha, ponta] = g.getObjects();
            linha.set({ strokeWidth: destaque ? 0.32 : 0.22 });
            if (ponta) ponta.set({ scaleX: 0.75, scaleY: 0.75 });
            add(g);
          });
        }
        c.requestRenderAll();
      }

      function renderizar() {
        const c = fabRef.current;
        if (!c) return;
        const q = qRef.current;
        limparDinamicos();
        desenharRastros();
        desenharCamada();
        const desenhos = q.fases[q.atual].desenhos || [];
        const finalizar = () => {
          Object.values(q.entidades).forEach((ent) => c.add(criarFicha(ent, posDe(ent.chave), nomesRef.current)));
          c.requestRenderAll();
        };
        if (!desenhos.length) { finalizar(); return; }
        fabric.util.enlivenObjects(desenhos, (objs) => {
          objs.forEach((o, i) => { o.desenho = desenhos[i].desenho || o.desenho; c.add(aplicarFlags(o)); });
          finalizar();
        });
      }

      const notificar = (salvar = true) => {
        setVersao((v) => v + 1);
        if (salvar) {
          setAlterado(true);
          if (aoMudarRef.current) aoMudarRef.current(qRef.current);
        }
      };

      // Lê o canvas para o modelo (posições e desenhos da fase atual) e registra no histórico
      function capturar() {
        const c = fabRef.current, q = qRef.current;
        const f = q.fases[q.atual];
        fichas().forEach((o) => { const p = centroFicha(o); f.pos[o.chave] = { x: Math.round(p.x * 10) / 10, y: Math.round(p.y * 10) / 10 }; });
        f.desenhos = c.getObjects().filter((o) => o.desenho && !o.rastro).map((o) => o.toObject(['desenho']));
        const txt = JSON.stringify(q);
        if (histRef.current[histRef.current.length - 1] !== txt) {
          histRef.current.push(txt);
          if (histRef.current.length > 60) histRef.current.shift();
        }
        notificar(true);
      }

      // Inicialização do Fabric e das ferramentas de desenho
      useEffect(() => {
        const c = new fabric.Canvas(canvasRef.current, {
          backgroundColor: '#2D452B', selection: true, preserveObjectStacking: true,
          selectionColor: 'rgba(198,156,62,0.12)', selectionBorderColor: OURO, selectionLineWidth: 1, fireRightClick: false,
        });
        fabRef.current = c;
        c.setZoom(c.getWidth() / VW);
        desenharCampo(c);
        let rascunho = null;

        const fichaPerto = (p) => {
          let melhor = null, dist = R_FICHA * 1.5;
          fichas().forEach((o) => {
            const ctr = centroFicha(o);
            const d = Math.hypot(sx(ctr.x) - p.x, sy(ctr.y) - p.y);
            if (d < dist) { dist = d; melhor = { x: sx(ctr.x), y: sy(ctr.y), raio: qRef.current.entidades[o.chave] && qRef.current.entidades[o.chave].time === 'bola' ? 1.2 : R_FICHA + 0.35 }; }
          });
          return melhor;
        };

        c.on('mouse:down', (opt) => {
          const t = ferramentaRef.current;
          if (t === 'mover' || tocandoRef.current) return;
          const p = c.getPointer(opt.e);
          const cor = corRef.current;
          if (t === 'texto') {
            const txt = new fabric.IText('Texto', {
              left: p.x, top: p.y, originX: 'left', originY: 'center', fontSize: 2.3, fontWeight: '700',
              fontFamily: 'Barlow Condensed, sans-serif', fill: cor, shadow: new fabric.Shadow({ color: 'rgba(0,0,0,0.9)', blur: 0.8 }),
            });
            txt.desenho = 'texto';
            aplicarFlags(txt);
            c.add(txt);
            c.setActiveObject(txt);
            txt.enterEditing();
            txt.selectAll();
            definirFerramenta('mover');
            return;
          }
          rascunho = { t, x0: p.x, y0: p.y, pts: [p], obj: null };
          if (t === 'zona') rascunho.obj = new fabric.Rect({ left: p.x, top: p.y, width: 0.1, height: 0.1, fill: comAlfa(cor, 0.18), stroke: cor, strokeWidth: 0.25, strokeDashArray: [0.9, 0.6] });
          else if (t === 'elipse') rascunho.obj = new fabric.Ellipse({ left: p.x, top: p.y, rx: 0.1, ry: 0.1, fill: comAlfa(cor, 0.18), stroke: cor, strokeWidth: 0.25, strokeDashArray: [0.9, 0.6] });
          else if (t === 'livre') rascunho.obj = new fabric.Polyline([{ x: p.x, y: p.y }, { x: p.x, y: p.y }], { stroke: cor, strokeWidth: 0.36, fill: '', strokeDashArray: [1.1, 0.8] });
          else rascunho.obj = new fabric.Line([p.x, p.y, p.x, p.y], { stroke: t === 'regua' ? '#FFFFFF' : cor, strokeWidth: 0.36, strokeDashArray: t === 'movimento' || t === 'regua' ? [1.1, 0.8] : t === 'conducao' ? [0.15, 0.55] : null, strokeLineCap: 'round' });
          rascunho.obj.set({ selectable: false, evented: false });
          c.add(rascunho.obj);
        });

        c.on('mouse:move', (opt) => {
          if (!rascunho) return;
          const p = c.getPointer(opt.e);
          const o = rascunho.obj;
          if (rascunho.t === 'zona') o.set({ left: Math.min(p.x, rascunho.x0), top: Math.min(p.y, rascunho.y0), width: Math.abs(p.x - rascunho.x0), height: Math.abs(p.y - rascunho.y0) });
          else if (rascunho.t === 'elipse') o.set({ left: Math.min(p.x, rascunho.x0), top: Math.min(p.y, rascunho.y0), rx: Math.abs(p.x - rascunho.x0) / 2, ry: Math.abs(p.y - rascunho.y0) / 2 });
          else if (rascunho.t === 'livre') {
            const u = rascunho.pts[rascunho.pts.length - 1];
            if (Math.hypot(p.x - u.x, p.y - u.y) > 0.35) {
              rascunho.pts.push(p);
              c.remove(o);
              rascunho.obj = new fabric.Polyline(rascunho.pts.map((q) => ({ x: q.x, y: q.y })), { stroke: corRef.current, strokeWidth: 0.36, fill: '', strokeDashArray: [1.1, 0.8], selectable: false, evented: false });
              c.add(rascunho.obj);
            }
          } else o.set({ x2: p.x, y2: p.y });
          c.requestRenderAll();
        });

        c.on('mouse:up', (opt) => {
          if (!rascunho) return;
          const r = rascunho;
          rascunho = null;
          c.remove(r.obj);
          const p = c.getPointer(opt.e);
          const cor = corRef.current;
          let novo = null;
          if (r.t === 'zona' || r.t === 'elipse') {
            const w = Math.abs(p.x - r.x0), h = Math.abs(p.y - r.y0);
            if (w > 1 && h > 1) {
              const base = { left: Math.min(p.x, r.x0), top: Math.min(p.y, r.y0), fill: comAlfa(cor, 0.18), stroke: cor, strokeWidth: 0.25, strokeDashArray: [0.9, 0.6], strokeUniform: true };
              novo = r.t === 'zona' ? new fabric.Rect({ ...base, width: w, height: h }) : new fabric.Ellipse({ ...base, rx: w / 2, ry: h / 2 });
              novo.desenho = 'zona';
            }
          } else if (r.t === 'livre') {
            r.pts.push(p);
            novo = r.pts.length > 3 ? criarTracoLivre(r.pts, cor) : null;
          } else {
            let a = { x: r.x0, y: r.y0 }, b = { x: p.x, y: p.y };
            if (Math.hypot(b.x - a.x, b.y - a.y) > 1) {
              if (r.t !== 'regua') {
                // Encaixa nas bordas das fichas: a seta sai de um jogador e chega no outro
                const fa = fichaPerto(a), fb = fichaPerto(b);
                if (fa) a = { x: fa.x, y: fa.y };
                if (fb) b = { x: fb.x, y: fb.y };
                const d = Math.hypot(b.x - a.x, b.y - a.y);
                if (d > 0.5) {
                  const ux = (b.x - a.x) / d, uy = (b.y - a.y) / d;
                  if (fa) a = { x: a.x + ux * fa.raio, y: a.y + uy * fa.raio };
                  if (fb) b = { x: b.x - ux * fb.raio, y: b.y - uy * fb.raio };
                }
                if (Math.hypot(b.x - a.x, b.y - a.y) > 1) novo = criarSeta(a.x, a.y, b.x, b.y, r.t === 'linha' ? 'linha' : r.t, cor);
              } else novo = criarRegua(a.x, a.y, b.x, b.y);
            }
          }
          if (novo) {
            c.add(aplicarFlags(novo));
            // Jogadores sempre por cima dos desenhos
            fichas().forEach((o) => c.bringToFront(o));
            capturar();
          }
          c.requestRenderAll();
        });

        c.on('object:moving', (e) => {
          const o = e.target;
          if (!o || !o.ficha) return;
          o.left = Math.max(o.dx + 0.5, Math.min(VW - 0.5 + o.dx, o.left));
          o.top = Math.max(o.dy + 0.5, Math.min(VH - 0.5 + o.dy, o.top));
        });
        c.on('object:modified', (e) => {
          capturar();
          if (e.target && e.target.ficha && rastrosRef.current && qRef.current.atual > 0) {
            const sel = e.target.chave;
            renderizar();
            const o = fichas().find((x) => x.chave === sel);
            if (o) c.setActiveObject(o);
          }
        });
        c.on('text:editing:exited', (e) => {
          const t = e.target;
          if (t && !t.text.trim()) c.remove(t);
          capturar();
        });
        const atualizarSel = () => {
          const ativos = c.getActiveObjects();
          setSelecionado(ativos.length === 1 && ativos[0].ficha ? ativos[0].chave : null);
        };
        c.on('selection:created', atualizarSel);
        c.on('selection:updated', atualizarSel);
        c.on('selection:cleared', () => setSelecionado(null));
        const recalcular = () => c.calcOffset();
        window.addEventListener('scroll', recalcular, { passive: true });
        renderizar();
        return () => { window.removeEventListener('scroll', recalcular); c.dispose(); fabRef.current = null; };
      }, []);

      function definirFerramenta(t) {
        ferramentaRef.current = t;
        setFerramentaEstado(t);
        const c = fabRef.current;
        if (!c) return;
        const mover = t === 'mover';
        c.selection = mover;
        c.skipTargetFind = !mover;
        c.defaultCursor = mover ? 'default' : 'crosshair';
        if (!mover) c.discardActiveObject();
        c.requestRenderAll();
      }

      const api = {
        versao, ferramenta, cor, mostrarNomes, mostrarRastros, tocando, selecionado, alterado,
        quadro: () => qRef.current,
        definirFerramenta,
        definirCor(c) { corRef.current = c; setCorEstado(c); },
        alternarNomes() { nomesRef.current = !nomesRef.current; setMostrarNomesEstado(nomesRef.current); renderizar(); },
        alternarRastros() { rastrosRef.current = !rastrosRef.current; setMostrarRastrosEstado(rastrosRef.current); renderizar(); },
        ajustar(w, hMax) {
          const c = fabRef.current;
          if (!c || !w) return;
          let largura = w;
          if (hMax) largura = Math.min(w, (hMax * VW) / VH);
          largura = Math.max(280, Math.floor(largura));
          const altura = Math.round((largura * VH) / VW);
          c.setDimensions({ width: largura, height: altura });
          c.setZoom(largura / VW);
          c.calcOffset();
          c.requestRenderAll();
        },
        carregar(q, { salvo = false } = {}) {
          const novo = JSON.parse(JSON.stringify(q));
          if (!novo.fases || !novo.fases.length) novo.fases = [{ nome: 'Fase 1', pos: {}, desenhos: [] }];
          novo.atual = Math.min(novo.atual || 0, novo.fases.length - 1);
          qRef.current = novo;
          histRef.current = [JSON.stringify(novo)];
          renderizar();
          setAlterado(salvo);
          setSelecionado(null);
          notificar(false);
        },
        // Substitui as fichas de um ou dos dois times (posições valem para todas as fases)
        definirEntidades(lista, times) {
          const q = qRef.current;
          Object.values(q.entidades).forEach((e) => {
            if (times.includes(e.time)) { delete q.entidades[e.chave]; q.fases.forEach((f) => delete f.pos[e.chave]); }
          });
          lista.forEach((e) => {
            const { x, y, ...ent } = e;
            q.entidades[ent.chave] = ent;
            q.fases.forEach((f) => { f.pos[ent.chave] = { x, y }; });
          });
          renderizar();
          capturar();
        },
        // Troca nomes/números sem mexer nas posições (ex.: time em determinado minuto)
        atualizarDados(mapa) {
          const q = qRef.current;
          Object.entries(mapa).forEach(([k, dados]) => { if (q.entidades[k]) Object.assign(q.entidades[k], dados); });
          renderizar();
          capturar();
        },
        editarEntidade(chave, dados) {
          const q = qRef.current;
          if (!q.entidades[chave]) return;
          Object.assign(q.entidades[chave], dados);
          renderizar();
          capturar();
          const o = fichas().find((x) => x.chave === chave);
          if (o) { fabRef.current.setActiveObject(o); fabRef.current.requestRenderAll(); }
        },
        definirCamada(k) { camadaRef.current = k; desenharCamada(); },
        desselecionar() {
          const c = fabRef.current;
          if (!c) return;
          c.discardActiveObject();
          c.requestRenderAll();
          setSelecionado(null);
        },
        definirProvavel(p, campo = 'provavel') { qRef.current[campo] = p; capturar(); },
        definirCampos(obj) { Object.assign(qRef.current, obj); capturar(); },
        adicionar(time) {
          const q = qRef.current;
          if (time === 'bola') {
            if (q.entidades.bola) return;
            q.entidades.bola = { chave: 'bola', time: 'bola', numero: '', nome: '' };
            q.fases.forEach((f) => { f.pos.bola = { x: L / 2, y: A / 2 }; });
            renderizar();
            capturar();
            return;
          }
          const doTime = Object.values(q.entidades).filter((e) => e.time === time);
          if (doTime.length >= MAX_POR_TIME) return;
          const usados = new Set(doTime.map((e) => Number(e.numero)));
          let numero = 1;
          while (usados.has(numero)) numero++;
          const chave = `${time}-m${Date.now()}`;
          const x = time === 'galo' ? 10 + Math.random() * 38 : L - 10 - Math.random() * 38;
          const y = 8 + Math.random() * (A - 16);
          q.entidades[chave] = { chave, time, numero, nome: '' };
          q.fases.forEach((f) => { f.pos[chave] = { x, y }; });
          renderizar();
          const o = fichas().find((f) => f.chave === chave);
          if (o) fabRef.current.setActiveObject(o);
          capturar();
        },
        removerSelecionados() {
          const c = fabRef.current, q = qRef.current;
          const ativos = c.getActiveObjects();
          if (!ativos.length) return;
          c.discardActiveObject();
          ativos.forEach((o) => {
            if (o.ficha) { delete q.entidades[o.chave]; q.fases.forEach((f) => delete f.pos[o.chave]); }
            c.remove(o);
          });
          capturar();
          renderizar();
        },
        limparDesenhos() {
          const c = fabRef.current;
          c.getObjects().filter((o) => o.desenho).forEach((o) => c.remove(o));
          capturar();
        },
        limparTudo() {
          const q = qRef.current;
          q.entidades = {};
          q.fases = [{ nome: 'Fase 1', pos: {}, desenhos: [] }];
          q.atual = 0;
          renderizar();
          capturar();
        },
        desfazer() {
          if (histRef.current.length < 2 || tocandoRef.current) return;
          histRef.current.pop();
          qRef.current = JSON.parse(histRef.current[histRef.current.length - 1]);
          renderizar();
          notificar(true);
        },
        podeDesfazer: () => histRef.current.length > 1,
        novaFase() {
          const q = qRef.current;
          const cur = q.fases[q.atual];
          q.fases.splice(q.atual + 1, 0, { nome: `Fase ${q.fases.length + 1}`, pos: JSON.parse(JSON.stringify(cur.pos)), desenhos: [] });
          q.atual += 1;
          renderizar();
          capturar();
        },
        excluirFase(i) {
          const q = qRef.current;
          if (q.fases.length < 2) return;
          q.fases.splice(i, 1);
          q.atual = Math.min(q.atual, q.fases.length - 1);
          renderizar();
          capturar();
        },
        renomearFase(i, nome) { qRef.current.fases[i].nome = nome; capturar(); },
        irParaFase(i, animar = true) {
          const q = qRef.current;
          if (tocandoRef.current || i === q.atual || !q.fases[i]) return Promise.resolve();
          if (!animar) { q.atual = i; renderizar(); notificar(true); return Promise.resolve(); }
          return animarPara(i);
        },
        async reproduzir() {
          const q = qRef.current;
          if (tocandoRef.current || q.fases.length < 2) return;
          tocandoRef.current = true;
          setTocando(true);
          const c = fabRef.current;
          c.skipTargetFind = true;
          c.selection = false;
          q.atual = 0;
          renderizar();
          await espera(700);
          for (let i = 1; i < q.fases.length; i++) {
            if (!tocandoRef.current) break;
            await animarPara(i, true);
            await espera(900);
          }
          tocandoRef.current = false;
          setTocando(false);
          definirFerramenta(ferramentaRef.current);
          notificar(true);
        },
        parar() { tocandoRef.current = false; },
        exportarPNG(nome) {
          const c = fabRef.current;
          c.discardActiveObject();
          c.requestRenderAll();
          const url = c.toDataURL({ format: 'png', multiplier: Math.max(1, 1800 / c.getWidth()) });
          baixarArquivo(url, nome);
        },
        contagem() {
          const es = Object.values(qRef.current.entidades);
          return { galo: es.filter((e) => e.time === 'galo').length, adv: es.filter((e) => e.time === 'adv').length, bola: !!qRef.current.entidades.bola };
        },
      };

      const espera = (ms) => new Promise((r) => setTimeout(r, ms));

      function animarPara(destino, durante = false) {
        return new Promise((resolver) => {
          const c = fabRef.current, q = qRef.current;
          if (!durante) { tocandoRef.current = true; setTocando(true); }
          c.discardActiveObject();
          c.getObjects().filter((o) => o.desenho || o.rastro).forEach((o) => c.remove(o));
          const fs = fichas();
          const de = new Map(fs.map((o) => [o.chave, centroFicha(o)]));
          const para = q.fases[destino].pos;
          fabric.util.animate({
            startValue: 0, endValue: 1, duration: 1100, easing: fabric.util.ease.easeInOutQuad,
            onChange: (v) => {
              fs.forEach((o) => {
                const a = de.get(o.chave), b = para[o.chave] || a;
                o.set({ left: sx(a.x + (b.x - a.x) * v) + o.dx, top: sy(a.y + (b.y - a.y) * v) + o.dy });
              });
              c.requestRenderAll();
            },
            onComplete: () => {
              q.atual = destino;
              renderizar();
              if (!durante) { tocandoRef.current = false; setTocando(false); notificar(true); }
              resolver();
            },
          });
        });
      }

      return api;
    }

    // Posições reais a partir da escalação da ESPN (formação + posição de cada jogador), em metros
    function profundidade(p) {
      p = (p || '').toUpperCase();
      if (p === 'G' || p === 'GK') return 0.06;
      if (/^(CD|CB|SW|D)(-|$)/.test(p)) return 0.2;
      if (/^(RB|LB)$/.test(p)) return 0.24;
      if (/WB/.test(p)) return 0.3;
      if (/^DM/.test(p)) return 0.34;
      if (/^(RM|LM)$/.test(p)) return 0.44;
      if (/^(CM|M)(-|$)/.test(p)) return 0.42;
      if (/^AM/.test(p)) return 0.52;
      if (/^(RW|LW)$/.test(p)) return 0.56;
      if (/^(RF|LF)$/.test(p)) return 0.6;
      if (/^CF-/.test(p)) return 0.63;
      return 0.66;
    }
    function lateral(p) {
      p = (p || '').toUpperCase();
      if (p === 'G') return 0;
      if (/^(RB|RWB|RM|RW|RF)$/.test(p)) return 1;
      if (/^(LB|LWB|LM|LW|LF)$/.test(p)) return -1;
      if (/-R$/.test(p)) return 0.45;
      if (/-L$/.test(p)) return -0.45;
      return 0;
    }
    // Devolve um array alinhado com `titulares`, com {x, y} em metros
    function posicionarEscalacao(titulares, time, formacao) {
      // lat > 0 = lado direito de quem ataca (embaixo, para o Galo que ataca para a direita)
      const ponto = (x, lat) => espelhar(time, x, A / 2 + lat * (A / 2) * 0.86);
      const res = new Array(titulares.length);
      const idx = titulares.map((j, i) => ({ ...j, i }));
      const contagens = (formacao || '').split('-').map(Number).filter((n) => n > 0);
      const goleiro = idx.find((j) => /^(G|GK)$/i.test(j.pos));
      const deLinha = idx.filter((j) => j !== goleiro);
      if (goleiro && contagens.length >= 2 && contagens.reduce((s, n) => s + n, 0) === deLinha.length) {
        const ordenados = [...deLinha].sort((a, b) => profundidade(a.pos) - profundidade(b.pos) || a.lugar - b.lugar);
        res[goleiro.i] = ponto(4.5, 0);
        let k = 0;
        contagens.forEach((n, li) => {
          const x = 14 + (li * (46 - 14)) / (contagens.length - 1);
          const grupo = ordenados.slice(k, k + n).sort((a, b) => lateral(a.pos) - lateral(b.pos) || a.lugar - b.lugar);
          k += n;
          const amp = Math.min(0.85, 0.28 * (n - 1));
          grupo.forEach((g, gi) => { res[g.i] = ponto(x, n === 1 ? 0 : -amp + (2 * amp * gi) / (n - 1)); });
        });
        return res;
      }
      const linhas = new Map();
      idx.forEach((j) => { const d = profundidade(j.pos); if (!linhas.has(d)) linhas.set(d, []); linhas.get(d).push({ ...j, lat: lateral(j.pos) }); });
      linhas.forEach((grupo, d) => {
        grupo.sort((a, b) => a.lat - b.lat || a.lugar - b.lugar);
        if (grupo.length > 1 && new Set(grupo.map((g) => g.lat)).size < grupo.length) {
          const amp = Math.min(0.85, 0.32 * (grupo.length - 1));
          grupo.forEach((g, gi) => { g.lat = -amp + (2 * amp * gi) / (grupo.length - 1); });
        }
        grupo.forEach((g) => { res[g.i] = ponto(4.5 + ((d - 0.06) / 0.6) * 42, g.lat); });
      });
      return res.map((p) => p || ponto(30, 0));
    }

    function entidadesDaEscalacao(titulares, time, formacao, extras) {
      const pos = posicionarEscalacao(titulares, time, formacao);
      return titulares.map((p, i) => ({
        chave: `${time}-s${i}`, time, numero: p.numero || '', nome: p.nome || '', atletaId: p.id || null,
        entrou: false, expulso: false, ...(extras ? extras(p) : {}), x: pos[i].x, y: pos[i].y,
      }));
    }

    // Time de cada lado em determinado minuto: aplica substituições e expulsões
    function timeNoMinuto(esc, minuto) {
      const slots = esc.titulares.map((p) => ({ ...p, entrou: false, expulso: false }));
      esc.reservas
        .filter((r) => r.entrou && r.substituiu && (r.minEntrada ?? (r.semMinuto ? 90 : 999)) <= minuto)
        .sort((a, b) => (a.minEntrada ?? 90) - (b.minEntrada ?? 90))
        .forEach((r) => {
          const i = slots.findIndex((s) => s.id === r.substituiu);
          if (i >= 0) slots[i] = { ...r, entrou: true, expulso: false };
        });
      slots.forEach((s) => { if (s.minVermelho != null && s.minVermelho <= minuto) s.expulso = true; });
      return slots;
    }

    // Identifica a escalação (fonte, formação e titulares) para saber quando ela mudou
    function assinaturaEsc(r) {
      if (!r || !r.escalacoes || !r.escalacoes.length) return null;
      return (r.fonte || r.fonteEscalacao || 'espn') + '|' + r.escalacoes.map((e) => `${e.lado}:${e.formacao || ''}:${e.titulares.map((p) => p.id).join(',')}`).join('|');
    }

    function quadroDoJogo(resumo, minuto) {
      const q = quadroVazio();
      q.fases[0].nome = minuto ? `Aos ${fmtMin(minuto)}` : 'Escalação inicial';
      q.fonte = resumo.fonte || resumo.fonteEscalacao || 'espn';
      q.escalacaoChave = assinaturaEsc(resumo);
      (resumo.escalacoes || []).forEach((esc) => {
        const time = esc.lado === 'galo' ? 'galo' : 'adv';
        const pos = posicionarEscalacao(esc.titulares, time, esc.formacao);
        timeNoMinuto(esc, minuto).forEach((p, i) => {
          const chave = `${time}-s${i}`;
