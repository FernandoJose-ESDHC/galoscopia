                </label>
              )}
              <p className="mt-1 text-[11px] text-neutral-500">Fonte: Sofascore.</p>
            </>
          )}
        </div>
      );
    }

    function CartaoJogador({ ent, ev, resumo, elencoGalo, onEditar, onFechar, onAbrirPerfil, flutuante, noCampo, setNoCampo, definirCamada }) {
      const [nome, setNome] = useState(ent.nome || '');
      const [numero, setNumero] = useState(String(ent.numero ?? ''));
      useEffect(() => { setNome(ent.nome || ''); setNumero(String(ent.numero ?? '')); }, [ent.chave, ent.nome, ent.numero]);
      const salvar = () => onEditar(ent.chave, { nome: nome.trim(), numero: numero.trim() });
      const lado = ent.time === 'galo' ? 'galo' : 'adv';
      const teamId = ent.time === 'galo' ? GALO_ID : ev ? ev.adversario.id : null;
      const ano = ev ? anoDe(ev.data) : ANO_ATUAL;
      const ehGD = String(ent.atletaId || '').startsWith('gd-');
      const ehSofa = String(ent.atletaId || '').startsWith('sofa-');
      const espnId = ehGD || ehSofa ? null : ent.atletaId;
      const temp = useTemporadaJogador(ent.time === 'bola' ? null : espnId, teamId, ano, ev && ev.slug);
      const naPartida = resumo && resumo.jogadores && ent.atletaId ? (resumo.jogadores[lado] || []).find((p) => p.id === ent.atletaId) : null;
      const doElenco = ent.time === 'galo' && espnId ? (elencoGalo || []).find((p) => p.id === espnId) : null;
      const gdGalo = useAtletaGD({ titulo: ent.gd || null, nome: ent.gd ? null : ent.nome, nasc: doElenco && doElenco.nasc }, ent.time === 'galo' && !!(ent.gd || espnId) && !!ent.nome);
      const gj = ent.gdJogo;
      const resumoGD = gj ? [
        gj.gols ? `${gj.gols} ${gj.gols === 1 ? 'gol' : 'gols'}` : 'sem gols',
        gj.contra ? 'gol contra' : '', gj.vermelho ? 'expulso' : gj.amarelo ? 'cartão amarelo' : '',
      ].filter(Boolean).join(', ') : '';
      const s = naPartida ? naPartida.stats : null;
      const chips = s ? [
        [`${naPartida.minutos}'`, 'em campo'], [s.totalGoals || 0, 'gols'], [s.goalAssists || 0, 'assist.'],
        [`${s.totalShots || 0} (${s.shotsOnTarget || 0})`, 'finalizações (no alvo)'], [`${s.foulsCommitted || 0}/${s.foulsSuffered || 0}`, 'faltas cometidas/sofridas'],
        ...(s.saves ? [[s.saves, 'defesas']] : []), ...(s.yellowCards || s.redCards ? [[`${s.yellowCards || 0}/${s.redCards || 0}`, 'amarelos/vermelhos']] : []),
        ...(s.totalPass ? [[`${s.accuratePass || 0}/${s.totalPass}`, 'passes certos']] : []), ...(s.rating ? [[String(s.rating).replace('.', ','), 'nota Sofascore']] : []),
      ] : [];
      return (
        <div className={(flutuante ? 'absolute bottom-2 left-2 z-10 max-h-[70%] w-80 overflow-y-auto shadow-xl ' : 'mx-auto mt-3 w-full max-w-2xl ') + 'cartao-jogador rounded-lg border border-white/10 bg-breu/95 p-3 text-sm'}>
          <div className="flex items-center justify-between gap-2">
            <span className={'text-xs ' + (ent.time === 'galo' ? 'text-ouro' : 'text-neutral-400')}>{ent.time === 'galo' ? 'Galo' : ent.time === 'bola' ? 'Bola' : ev ? ev.adversario.nome : 'Adversário'}{ent.entrou ? ', entrou no jogo' : ''}{ent.expulso ? ', expulso' : ''}</span>
            <button onClick={onFechar} className="text-neutral-500 hover:text-white" aria-label="Fechar">✕</button>
          </div>
          {ent.time !== 'bola' && (
            <>
              <div className="mt-2 grid grid-cols-[3.5rem_1fr] gap-2">
                <input value={numero} onChange={(e) => setNumero(e.target.value)} onBlur={salvar} onKeyDown={(e) => e.key === 'Enter' && salvar()} aria-label="Número"
                  className="rounded border border-white/10 bg-carvao px-2 py-1 text-center text-white" />
                <input value={nome} onChange={(e) => setNome(e.target.value)} onBlur={salvar} onKeyDown={(e) => e.key === 'Enter' && salvar()} aria-label="Nome" placeholder="Nome"
                  className="rounded border border-white/10 bg-carvao px-2 py-1 text-white" />
              </div>
              {ehGD ? (
                <>
                  <h5 className="mt-3 text-xs font-semibold text-neutral-400">No jogo, pela ficha do Galo Digital</h5>
                  <p className="mt-1 text-xs text-neutral-300">{resumoGD ? resumoGD.charAt(0).toUpperCase() + resumoGD.slice(1) + '.' : 'Sem registro de gols ou cartões.'}</p>
                  <AcoesJogador ev={ev} ent={ent} noCampo={noCampo} setNoCampo={setNoCampo} definirCamada={definirCamada} />
                  {ent.time === 'galo' && ent.gd && <BlocoGaloDigital compacto estado={gdGalo} />}
                  {ent.gd && (
                    <button onClick={() => onAbrirPerfil({ id: null, gd: ent.gd, nome: ent.nome, teamId })} className="mt-3 w-full rounded-md border border-ouro/50 px-3 py-1.5 text-sm font-semibold text-ouro hover:bg-ouro/10">
                      Abrir perfil do jogador
                    </button>
                  )}
                </>
              ) : !ent.atletaId ? (
                <p className="mt-2 text-xs text-neutral-500">Ficha livre, sem jogador da ESPN ligado a ela.</p>
              ) : (
                <>
                  <h5 className="mt-3 text-xs font-semibold text-neutral-400">No jogo</h5>
                  {chips.length ? (
                    <div className="mt-1 grid grid-cols-3 gap-1.5 sm:grid-cols-4">
                      {chips.map(([v, r], i) => (
                        <div key={i} className="rounded bg-carvao px-2 py-1"><div className="font-placar text-base leading-none text-white tabular-nums">{v}</div><div className="mt-0.5 text-[10px] leading-tight text-neutral-500">{r}</div></div>
                      ))}
                    </div>
                  ) : (
                    <p className="mt-1 text-xs text-neutral-500">{ev && ev.estado === 'pre' ? 'O jogo ainda não aconteceu.' : 'Sem números deste jogo para ele.'}</p>
                  )}
                  <AcoesJogador ev={ev} ent={ent} noCampo={noCampo} setNoCampo={setNoCampo} definirCamada={definirCamada} />
                  <h5 className="mt-3 text-xs font-semibold text-neutral-400">Temporada {ano}{ent.time !== 'galo' && ev ? ` pelo ${ev.adversario.nome}` : ' pelo Galo'}</h5>
                  {temp.carregando ? <p className="mt-1 text-xs text-neutral-500">Buscando…</p>
                    : temp.linhas && temp.linhas.length ? <TabelaTemporada linhas={temp.linhas} rotulo="Competição" compacta={flutuante} />
                    : doElenco ? <p className="mt-1 text-xs text-neutral-300">{doElenco.jogos} jogos, {doElenco.gols} gols, {doElenco.assist} assistências, {doElenco.amarelos} amarelos.</p>
                    : <p className="mt-1 text-xs text-neutral-500">{ehSofa ? 'Sem cadastro dele na ESPN para os números da temporada.' : 'A ESPN não tem os números da temporada dele.'}</p>}
                  {ent.time === 'galo' && <BlocoGaloDigital compacto estado={gdGalo} />}
                  <button onClick={() => onAbrirPerfil({ id: espnId, nome: ent.nome, teamId })} className="mt-3 w-full rounded-md border border-ouro/50 px-3 py-1.5 text-sm font-semibold text-ouro hover:bg-ouro/10">
                    Abrir perfil do jogador
                  </button>
                </>
              )}
            </>
          )}
        </div>
      );
    }

    // Janela com o perfil completo do jogador
    function PerfilJogador(props) {
      return props.alvo.id ? <PerfilEspn {...props} /> : <PerfilGD {...props} />;
    }
    function PerfilEspn({ alvo, onFechar, onVerNoGalo }) {
      const { id, nome, teamId } = alvo;
      const [perfil, setPerfil] = useState(null);
      const [hist, setHist] = useState(null);
      const [erro, setErro] = useState(false);
      const fecharRef = useRef(null);
      useEffect(() => {
        let vivo = true;
        setPerfil(null); setHist(null); setErro(false);
        carregarPerfil(id).then((p) => { if (vivo) setPerfil(p); }).catch(() => { if (vivo) setErro(true); });
        if (teamId) carregarHistoricoNoTime(id, teamId, 'bra.1').then((h) => { if (vivo) setHist(h); }).catch(() => { if (vivo) setHist([]); });
        else setHist([]);
        return () => { vivo = false; };
      }, [id, teamId]);
      useEffect(() => {
        if (fecharRef.current) fecharRef.current.focus();
        const t = (e) => { if (e.key === 'Escape') { e.stopImmediatePropagation(); onFechar(); } };
        window.addEventListener('keydown', t, true);
        return () => window.removeEventListener('keydown', t, true);
      }, []);
      const clubeNome = (tid) => (tid === GALO_ID ? 'Galo' : ((perfil && perfil.clubes.find((c) => c.id === tid)) || {}).nome || 'outro clube');
      const nomeTime = teamId === GALO_ID ? 'Galo' : (perfil && clubeNome(teamId)) || 'clube';
      const jogouNoGalo = teamId === GALO_ID || (perfil && perfil.clubes.some((c) => c.id === GALO_ID));
      const idadeOk = perfil && (perfil.idade == null || perfil.idade <= 40);
      return (
        <div className="fixed inset-0 z-[60] flex items-start justify-center overflow-y-auto bg-black/70 p-4" onClick={onFechar} role="dialog" aria-modal="true" aria-label={`Perfil de ${nome}`}>
          <div className="perfil-jogador my-6 w-full max-w-2xl rounded-xl border border-white/10 bg-carvao p-5 md:p-6" onClick={(e) => e.stopPropagation()}>
            <div className="flex items-start gap-4">
              {perfil && perfil.foto
                ? <img src={perfil.foto} alt="" className="h-20 w-20 shrink-0 rounded-full bg-grafite object-cover" />
                : <div className="grid h-20 w-20 shrink-0 place-items-center rounded-full bg-grafite font-placar text-2xl text-ouro" aria-hidden="true">{(nome || '?').slice(0, 2)}</div>}
              <div className="min-w-0 flex-1">
                <h2 className="font-placar text-3xl font-bold leading-tight text-white">{(perfil && perfil.nome) || nome}</h2>
                {perfil && perfil.completo && perfil.completo !== perfil.nome && <p className="text-sm text-neutral-500">{perfil.completo}</p>}
                {perfil && (
                  <p className="mt-1 text-sm text-neutral-400">
                    {[perfil.pos, paisPt(perfil.nac), perfil.nascimento && `nascido em ${perfil.nascimento}`, perfil.local].filter(Boolean).join(', ')}.
                  </p>
                )}
              </div>
              <button ref={fecharRef} onClick={onFechar} className="rounded-md border border-white/15 px-2.5 py-1 text-sm text-neutral-300 hover:border-white/40" aria-label="Fechar perfil">✕</button>
            </div>
            {erro && <p className="mt-4 text-sm text-red-200">Não foi possível buscar o perfil agora. Confira a conexão.</p>}
            {!perfil && !erro && <Carregando texto="Buscando o perfil…" />}
            {perfil && (
              <div className="mt-5 space-y-5">
                <div className="grid grid-cols-2 gap-2 sm:grid-cols-4">
                  <Dado rotulo="Idade" valor={perfil.idade ?? '–'} />
                  <Dado rotulo="Altura" valor={perfil.altura ? `${(perfil.altura / 100).toFixed(2).replace('.', ',')} m` : '–'} />
                  <Dado rotulo="Peso" valor={perfil.peso ? `${perfil.peso} kg` : '–'} />
                  <Dado rotulo="Camisa" valor={perfil.camisa || '–'} />
                </div>
                {perfil.clubeAtual && idadeOk && <p className="text-sm text-neutral-300">Clube mais recente pela ESPN: <span className="text-white">{perfil.clubeAtual}</span>.</p>}
                {perfil.temporada.length > 0 && (
                  <div>
                    <h3 className="text-sm font-semibold text-neutral-300">Temporada {perfil.temporada[0].ano || ANO_ATUAL} por competição</h3>
                    <div className="mt-2"><TabelaTemporada linhas={perfil.temporada.map((t) => ({ rotulo: `${t.comp} (${clubeNome(t.teamId)})`, s: t.s }))} rotulo="Competição" /></div>
                  </div>
                )}
                {teamId && (
                  <div>
                    <h3 className="text-sm font-semibold text-neutral-300">Ano a ano no {nomeTime}, pelo Brasileirão</h3>
                    {hist === null ? <p className="mt-1 text-xs text-neutral-500">Buscando…</p>
                      : hist.length ? <div className="mt-2"><TabelaTemporada linhas={[...hist].sort((a, b) => b.ano - a.ano).map((h) => ({ rotulo: String(h.ano), s: h.s }))} rotulo="Ano" /></div>
                      : <p className="mt-1 text-xs text-neutral-500">A ESPN não tem esse histórico.</p>}
                  </div>
                )}
                {jogouNoGalo && <BlocoGaloDigital nome={perfil.nome || nome} nasc={perfil.nasc} />}
                {perfil.clubes.length > 0 && (
                  <div>
                    <h3 className="text-sm font-semibold text-neutral-300">Clubes e seleções na carreira</h3>
                    <ul className="mt-2 flex flex-wrap gap-2">
                      {perfil.clubes.map((c) => (
                        <li key={c.id} className={'rounded-md border px-2.5 py-1 text-sm ' + (c.id === GALO_ID ? 'border-ouro/50 text-ouro' : 'border-white/10 text-neutral-300')}>{nomeClube(c.nome)}</li>
                      ))}
                    </ul>
                  </div>
                )}
                <p className="text-xs text-neutral-500">Tit = jogos como titular. A ESPN pode não cobrir todas as competições.</p>
                <div className="flex flex-wrap gap-2 border-t border-white/5 pt-4">
                  {jogouNoGalo && onVerNoGalo && (
                    <button onClick={() => { onFechar(); onVerNoGalo({ id, nome: perfil.nome || nome }); }} className="rounded-md bg-ouro px-3 py-1.5 text-sm font-semibold text-breu hover:bg-ourobrilho">Ver trajetória no Galo</button>
                  )}
                  <a href={`https://www.espn.com/soccer/player/_/id/${id}`} target="_blank" rel="noopener noreferrer" className="rounded-md border border-white/15 px-3 py-1.5 text-sm text-neutral-200 hover:border-white/40">Abrir na ESPN ↗</a>
                </div>
              </div>
            )}
          </div>
        </div>
      );
    }

    function QuadroTatico({ api, canvasRef, ev, renderCartao, aviso, maximizado, setMaximizado }) {
      const wrapRef = useRef(null);
      const hostRef = useRef(null);
      const [editandoFase, setEditandoFase] = useState(null);
      const q = api.quadro();
      const ent = api.selecionado ? q.entidades[api.selecionado] : null;

      // Ajusta o tamanho do campo ao espaço disponível
      useEffect(() => {
        const host = hostRef.current;
        if (!host) return;
        const medir = () => {
          if (maximizado) api.ajustar(host.clientWidth - 8, host.clientHeight - 8);
          else api.ajustar(Math.min(host.clientWidth, 960), null);
        };
        medir();
        const ro = new ResizeObserver(medir);
        ro.observe(host);
        return () => ro.disconnect();
      }, [maximizado]);

      // Tela cheia de verdade quando o navegador permite
      useEffect(() => {
        document.body.style.overflow = maximizado ? 'hidden' : '';
        const sair = () => { if (!document.fullscreenElement) setMaximizado(false); };
        document.addEventListener('fullscreenchange', sair);
        return () => { document.removeEventListener('fullscreenchange', sair); document.body.style.overflow = ''; };
      }, [maximizado]);
      const alternarMax = () => {
        if (!maximizado) {
          setMaximizado(true);
          try { const p = wrapRef.current.requestFullscreen && wrapRef.current.requestFullscreen(); if (p && p.catch) p.catch(() => {}); } catch (e) {}
        } else {
          setMaximizado(false);
          if (document.fullscreenElement) document.exitFullscreen().catch(() => {});
        }
      };

      // Atalhos de teclado
      useEffect(() => {
        const tecla = (e) => {
          const tag = (e.target && e.target.tagName) || '';
          if (/INPUT|TEXTAREA|SELECT/.test(tag) || (e.target && e.target.isContentEditable)) return;
          if (document.querySelector('[role=dialog]')) return;
          if (document.querySelector('textarea[data-fabric-hiddentextarea]') === document.activeElement) return;
          if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'z') { e.preventDefault(); api.desfazer(); return; }
          if (e.key === 'Delete' || e.key === 'Backspace') { e.preventDefault(); api.removerSelecionados(); return; }
          if (e.key === 'Escape') { if (api.ferramenta !== 'mover') api.definirFerramenta('mover'); else if (maximizado) alternarMax(); return; }
          if (e.ctrlKey || e.metaKey || e.altKey) return;
          const f = FERRAMENTAS.find((x) => x[2].toLowerCase() === e.key.toLowerCase());
          if (f) api.definirFerramenta(f[0]);
        };
        window.addEventListener('keydown', tecla);
        return () => window.removeEventListener('keydown', tecla);
      }, [api.ferramenta, maximizado]);

      const nomeArquivo = () => `quadro-galo-${(ev ? ev.adversario.nome : 'livre').toLowerCase().normalize('NFD').replace(/[^a-z0-9]+/g, '-')}-${ev ? ev.data.slice(0, 10) : ''}.png`;
      const nFases = q.fases.length;
      const contagem = api.contagem();

      const barraFerramentas = (
        <div className="flex flex-wrap items-center gap-1.5">
          {FERRAMENTAS.map(([id, rot, atalho, desc]) => (
            <BotaoFerramenta key={id} ativo={api.ferramenta === id} onClick={() => api.definirFerramenta(id)} titulo={`${rot} (${atalho}): ${desc}`} rotulo={rot}>
              <Icone nome={id} />
            </BotaoFerramenta>
          ))}
          <BotaoFerramenta ativo={contagem.bola} onClick={() => api.adicionar('bola')} titulo="Colocar a bola no campo" rotulo="Bola" desabilitado={contagem.bola}>
            <Icone nome="bola" />
          </BotaoFerramenta>
          <span className="mx-1 h-6 w-px bg-white/10" aria-hidden="true"></span>
          <div className="flex items-center gap-1" role="radiogroup" aria-label="Cor do desenho">
            {CORES.map(([hex, nome]) => (
              <button key={hex} role="radio" aria-checked={api.cor === hex} aria-label={nome} title={nome} onClick={() => api.definirCor(hex)}
                className={'h-6 w-6 rounded-full border-2 ' + (api.cor === hex ? 'border-white' : 'border-transparent')} style={{ background: hex }} />
            ))}
          </div>
          <span className="mx-1 h-6 w-px bg-white/10" aria-hidden="true"></span>
          <BotaoFerramenta onClick={api.desfazer} titulo="Desfazer (Ctrl+Z)" rotulo="Desfazer" desabilitado={!api.podeDesfazer()}>
            <svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" strokeWidth="1.6" strokeLinecap="round" aria-hidden="true"><path d="M6 4L3 7l3 3" /><path d="M3 7h7a5 5 0 010 10H7" /></svg>
          </BotaoFerramenta>
          <BotaoFerramenta onClick={api.removerSelecionados} titulo="Apagar o que está selecionado (Delete)" rotulo="Apagar">
            <svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" strokeWidth="1.6" strokeLinecap="round" aria-hidden="true"><path d="M3 5h12M7 5V3h4v2M5 5l1 10h6l1-10" /></svg>
          </BotaoFerramenta>
          <BotaoFerramenta onClick={api.limparDesenhos} titulo="Apagar todos os desenhos desta fase" rotulo="Limpar desenhos" />
          <BotaoFerramenta ativo={api.mostrarNomes} onClick={api.alternarNomes} titulo="Mostrar ou ocultar nomes" rotulo="Nomes" />
        </div>
      );

      const barraFases = (
        <div className="flex flex-wrap items-center gap-2">
          <span className="text-xs text-neutral-500">Fases</span>
          {q.fases.map((f, i) => (
            editandoFase === i ? (
              <input key={i} autoFocus defaultValue={f.nome} aria-label="Nome da fase"
                onBlur={(e) => { api.renomearFase(i, e.target.value.trim() || f.nome); setEditandoFase(null); }}
                onKeyDown={(e) => { if (e.key === 'Enter') e.currentTarget.blur(); if (e.key === 'Escape') setEditandoFase(null); }}
                className="w-36 rounded-md border border-ouro/60 bg-breu px-2 py-1 text-sm text-white" />
            ) : (
              <button key={i} onClick={() => api.irParaFase(i)} onDoubleClick={() => setEditandoFase(i)} disabled={api.tocando}
                title="Clique para ir até a fase; dois cliques para renomear"
                className={'rounded-md border px-2.5 py-1 text-sm transition-colors ' + (q.atual === i ? 'border-ouro bg-ouro/15 text-ouro' : 'border-white/10 text-neutral-300 hover:border-white/30')}>
                {f.nome}
              </button>
            )
          ))}
          <button onClick={api.novaFase} disabled={api.tocando} className="rounded-md border border-dashed border-ouro/50 px-2.5 py-1 text-sm text-ouro hover:bg-ouro/10 disabled:opacity-40">+ Nova fase</button>
          {nFases > 1 && (
            <>
              <button onClick={api.tocando ? api.parar : api.reproduzir} className="rounded-md bg-ouro px-3 py-1 text-sm font-semibold text-breu hover:bg-ourobrilho">
                {api.tocando ? 'Parar' : '▶ Reproduzir movimentação'}
              </button>
              <BotaoFerramenta ativo={api.mostrarRastros} onClick={api.alternarRastros} titulo="Mostra de onde cada jogador veio na fase anterior" rotulo="Deslocamentos" />
              <button onClick={() => api.excluirFase(q.atual)} disabled={api.tocando} className="text-xs text-neutral-500 hover:text-red-300 disabled:opacity-40">Excluir fase atual</button>
            </>
          )}
        </div>
      );

      return (
        <div ref={wrapRef} className={maximizado ? 'fixed inset-0 z-50 flex flex-col gap-2 bg-breu p-3' : 'bg-carvao rounded-xl border border-white/5 p-5 min-w-0'}>
          <div className="flex flex-wrap items-start justify-between gap-3">
            <div className={maximizado ? 'flex items-baseline gap-3' : ''}>
              <h3 className="font-placar text-xl font-semibold text-white">Quadro tático</h3>
              <p className="text-sm text-neutral-400">
                {maximizado && ev ? `${ev.mandante.nome} x ${ev.visitante.nome}. ` : ''}Campo em escala real (105 × 68 m). Clique num jogador para ver os números do jogo e da temporada.
              </p>
              {aviso && <p className="aviso-quadro mt-1 text-sm text-ouro">{aviso}</p>}
            </div>
            <div className="flex flex-wrap gap-2">
              <button onClick={() => api.exportarPNG(nomeArquivo())} className="rounded-md border border-white/15 px-3 py-1.5 text-sm text-neutral-200 hover:border-white/40">Exportar imagem</button>
              <button onClick={alternarMax} className="rounded-md border border-ouro/50 px-3 py-1.5 text-sm font-semibold text-ouro hover:bg-ouro/10">
                {maximizado ? 'Restaurar' : 'Maximizar'}
              </button>
            </div>
          </div>
          <div className={maximizado ? '' : 'mt-3'}>{barraFerramentas}</div>
          <div ref={hostRef} className={'relative flex items-center justify-center ' + (maximizado ? 'min-h-0 flex-1' : 'mt-3 w-full')}>
            <div className="overflow-hidden rounded-lg ring-1 ring-ouro/25 shadow-[0_10px_40px_rgba(0,0,0,0.5)]">
              <canvas id="tactical-board" ref={canvasRef} width={500} height={Math.round((500 * VH) / VW)}></canvas>
            </div>
            {ent && maximizado && renderCartao(ent, true)}
          </div>
          {ent && !maximizado && renderCartao(ent, false)}
          <div className={maximizado ? '' : 'mt-3'}>{barraFases}</div>
          {!maximizado && (
            <p className="mt-3 text-xs text-neutral-500">
              Dica: com Passe, Movimento ou Condução, arraste de um jogador até outro e a seta encaixa na borda das fichas. Crie uma nova fase, mova os jogadores e use "Reproduzir" para animar a movimentação.
            </p>
          )}
        </div>
      );
    }

    /* ---------- Escalações ---------- */
    function ListaTime({ titulo, jogadores, destaque }) {
      return (
        <div>
          <h4 className={'text-sm font-semibold ' + (destaque ? 'text-ouro' : 'text-neutral-300')}>{titulo}</h4>
          <ol className="mt-2 space-y-0.5 text-sm">
            {jogadores.map((p, i) => (
              <li key={i} className={'flex items-center gap-2 ' + (p.expulso ? 'opacity-50 line-through' : '')}>
                <span className="w-6 text-right tabular-nums text-neutral-500">{p.numero}</span>
                <span className="text-neutral-200">{p.nome}</span>
                {p.entrou && <span className="text-xs text-green-400" title={p.minEntrada != null ? `Entrou aos ${fmtMin(p.minEntrada)}` : 'Entrou (minuto não registrado)'}>↑ {p.minEntrada != null ? fmtMin(p.minEntrada) : 's/ min.'}</span>}
                {p.expulso && <span className="text-xs text-red-300 no-underline">expulso</span>}
              </li>
            ))}
          </ol>
        </div>
      );
    }

    function PainelEscalacaoJogo({ ev, resumo, minuto, setMinuto, formacoesGD, onFormacaoGD, urlGD }) {
      const escs = resumo.escalacoes || [];
      const fim = resumo.fimJogo || 90;
      const g = escs.find((e) => e.lado === 'galo'), a = escs.find((e) => e.lado === 'adv');
      const subs = resumo.substituicoes || [];
      const doGD = resumo.fonteEscalacao === 'gd';
      return (
        <Cartao titulo="Escalações e substituições" subtitulo={doGD
          ? `${ev.fonte === 'gd' ? 'Escalação da ficha técnica do Galo Digital' : 'O Sofascore e a ESPN não têm a escalação deste jogo, então usei a ficha técnica do Galo Digital'}. A formação é estimada pela ordem da ficha; troque se precisar.`
          : resumo.confirmada ? `Time confirmado ${resumo.fonte === 'sofa' ? 'pelo Sofascore' : 'pela ESPN'} antes do jogo. Durante a partida, trocas e expulsões entram sozinhas no quadro.`
          : `Escalação, formação e trocas ${resumo.fonte === 'sofa' ? 'do Sofascore' : 'da ESPN'}, atualizadas sozinhas durante o jogo. Escolha o minuto para ver o time em campo, com as trocas e expulsões até ali. O quadro acompanha.`}>
          {doGD && (
            <div className="escalacao-gd mb-4 flex flex-wrap items-end gap-3">
              {[['galo', 'Formação do Galo'], ['adv', `Formação do ${ev.adversario.nome}`]].map(([ld, rot]) => (
                <label key={ld} className="text-xs text-neutral-400">{rot}
                  <select value={formacoesGD[ld]} onChange={(e) => onFormacaoGD(ld, e.target.value)} aria-label={rot}
                    className="mt-1 block rounded-md border border-white/10 px-2 py-1.5 text-sm text-white">
                    {Object.keys(FORMACOES).map((f) => <option key={f}>{f}</option>)}
                  </select>
                </label>
              ))}
              {urlGD && <LinkGD href={urlGD} className="pb-1.5 text-sm">Ficha no Galo Digital ↗</LinkGD>}
            </div>
          )}
          {ev.estado !== 'pre' && <div className="flex flex-wrap items-center gap-2">
            <button onClick={() => setMinuto(0)} className={'rounded-md border px-3 py-1 text-sm ' + (minuto === 0 ? 'border-ouro bg-ouro/15 text-ouro' : 'border-white/10 text-neutral-300 hover:border-white/30')}>Início</button>
            <button onClick={() => setMinuto(fim)} className={'rounded-md border px-3 py-1 text-sm ' + (minuto === fim ? 'border-ouro bg-ouro/15 text-ouro' : 'border-white/10 text-neutral-300 hover:border-white/30')}>
              {ev.estado === 'in' ? 'Agora' : 'Fim do jogo'}
            </button>
            <label className="ml-1 flex flex-1 items-center gap-3 text-sm text-neutral-400">
              <input type="range" min="0" max={fim} value={minuto} onChange={(e) => setMinuto(Number(e.target.value))} className="flex-1" aria-label="Minuto do jogo" />
              <span className="w-14 text-right font-placar text-lg text-white tabular-nums">{fmtMin(minuto)}</span>
            </label>
          </div>}
          <div className="mt-4 grid gap-4 sm:grid-cols-2">
            {g && <ListaTime titulo={`Galo${g.formacao ? `, ${g.formacao}` : ''}`} jogadores={timeNoMinuto(g, minuto)} destaque />}
            {a && <ListaTime titulo={`${ev.adversario.nome}${a.formacao ? `, ${a.formacao}` : ''}`} jogadores={timeNoMinuto(a, minuto)} />}
          </div>
          {subs.length > 0 && (
            <div className="mt-5 border-t border-white/5 pt-4">
              <h4 className="text-sm font-semibold text-neutral-300">Substituições</h4>
              <ul className="mt-2 space-y-1 text-sm">
                {subs.map((s, i) => (
                  <li key={i} className="flex gap-3">
                    <button onClick={() => setMinuto(s.min ?? 0)} className="w-12 shrink-0 text-left tabular-nums text-neutral-500 hover:text-ouro" title="Ver o time neste minuto">{s.min != null ? fmtMin(s.min) : '–'}</button>
                    <span className={s.lado === 'galo' ? 'text-ouro' : 'text-neutral-400'}>{s.lado === 'galo' ? 'Galo' : ev.adversario.nome}</span>
                    <span className="text-neutral-200"><span className="text-green-400">↑</span> {s.entrou} <span className="text-red-300">↓</span> {s.saiu}</span>
                  </li>
                ))}
              </ul>
            </div>
          )}
        </Cartao>
      );
    }

    // Editor de um time: formação + um jogador por posição, escolhido no elenco
    function EditorTime({ time, formacao, ids, elenco, atalhos, onAplicar }) {
      const mapa = useMemo(() => new Map((elenco || []).map((p) => [p.id, p])), [elenco]);
      const lista = useMemo(() => [...mapa.values()].sort((a, b) => (a.pos || 'Z').charAt(0).localeCompare((b.pos || 'Z').charAt(0)) || b.jogos - a.jogos), [mapa]);
      const catDe = (id) => ((mapa.get(id) || {}).pos || '').charAt(0);
      const buscar = (id) => mapa.get(id);
      const aplicar = (f, novos) => onAplicar(time, f, novos, buscar);
      const trocarFormacao = (f) => aplicar(f, reencaixar(f, ids && ids.length ? ids : sugerirProvavel(f, elenco, null), catDe));
      const grupos = [['G', 'Goleiros'], ['D', 'Defensores'], ['M', 'Meio-campistas'], ['F', 'Atacantes'], ['', 'Outros']];
      const atuais = ids || [];
      return (
        <div>
          <div className="flex flex-wrap items-end gap-2">
            <label className="text-xs text-neutral-400">Formação
              <select value={formacao} onChange={(e) => trocarFormacao(e.target.value)} aria-label={`Formação ${time === 'galo' ? 'do Galo' : 'do adversário'}`}
                className="mt-1 block rounded-md border border-white/10 px-2 py-1.5 text-sm text-white">
                {Object.keys(FORMACOES).map((f) => <option key={f}>{f}</option>)}
              </select>
            </label>
            {atalhos.map(([rot, fn]) => (
              <button key={rot} onClick={fn} className="rounded-md border border-white/15 px-3 py-1.5 text-sm text-neutral-200 hover:border-white/40">{rot}</button>
            ))}
          </div>
          <div className="mt-3 grid gap-x-4 gap-y-1.5 sm:grid-cols-2">
            {FORMACOES[formacao].map(([rot], i) => (
              <label key={i} className="flex items-center gap-2 text-sm">
                <span className={'w-10 shrink-0 text-xs font-semibold ' + (time === 'galo' ? 'text-ouro' : 'text-neutral-300')}>{rot}</span>
                <select value={atuais[i] || ''} aria-label={`Jogador para ${rot}`}
                  onChange={(e) => {
                    const novos = [...atuais];
                    while (novos.length < 11) novos.push(null);
                    const j = novos.indexOf(e.target.value);
                    if (j >= 0 && j !== i) novos[j] = atuais[i] || null;
                    novos[i] = e.target.value || null;
                    aplicar(formacao, novos);
                  }}
                  className="min-w-0 flex-1 rounded-md border border-white/10 px-2 py-1 text-sm text-white">
                  <option value="">Escolher jogador</option>
                  {grupos.map(([c, nome]) => {
                    const gs = lista.filter((p) => (c ? (p.pos || '').charAt(0) === c : !'GDMF'.includes((p.pos || 'X').charAt(0))));
                    if (!gs.length) return null;
                    return <optgroup key={nome} label={nome}>{gs.map((p) => <option key={p.id} value={p.id}>{p.numero ? `${p.numero}. ` : ''}{p.nome}{p.jogos ? ` (${p.jogos} jogos)` : ''}</option>)}</optgroup>;
                  })}
                </select>
              </label>
            ))}
          </div>
        </div>
      );
    }

    // Escalação provável (próximos jogos) ou simulada (jogos sem escalação na ESPN)
    function PainelProvavel({ ev, modo, extras, provavel, provavelAdv, onAplicar, onAplicarUltimoAdv }) {
      const ano = anoDe(ev.data);
      const formacao = (provavel && provavel.formacao) || '4-2-3-1';
      const formacaoAdv = (provavelAdv && provavelAdv.formacao) || '4-4-2';
      const ultimoGalo = extras.ultimoGalo, ultimoAdv = extras.ultimoAdv;
      // Elenco do Galo: temporada do jogo + quem esteve no último time
      const elencoGalo = useMemo(() => {
        const m = new Map((extras.elencoGaloAno || []).map((p) => [p.id, p]));
        if (ultimoGalo) ultimoGalo.titulares.concat(ultimoGalo.reservas || []).forEach((p) => { if (!m.has(p.id)) m.set(p.id, { ...p, jogos: 0 }); });
        return [...m.values()];
      }, [extras.elencoGaloAno, ultimoGalo]);
      const elencoAdv = useMemo(() => {
        const m = new Map((extras.elencoAdv || []).map((p) => [p.id, p]));
        if (ultimoAdv) ultimoAdv.titulares.concat(ultimoAdv.reservas || []).forEach((p) => { if (!m.has(p.id)) m.set(p.id, { ...p, jogos: 0 }); });
        return [...m.values()];
      }, [extras.elencoAdv, ultimoAdv]);
      const buscarGalo = (id) => elencoGalo.find((p) => p.id === id);
      const atalhosGalo = [];
      if ((extras.elencoGaloAno || []).length) atalhosGalo.push([`Mais utilizados em ${ano}`, () => onAplicar('galo', formacao, sugerirProvavel(formacao, extras.elencoGaloAno, null), buscarGalo)]);
      if (ultimoGalo) atalhosGalo.push([`Repetir o último time (${ultimoGalo.adversario}, ${fDiaMes.format(new Date(ultimoGalo.data))})`, () => onAplicar('galo', formacao, sugerirProvavel(formacao, extras.elencoGaloAno, ultimoGalo), buscarGalo)]);
      const buscarAdv = (id) => elencoAdv.find((p) => p.id === id);
      const temElencoAdv = elencoAdv.length >= 11;
      const simulada = modo === 'simulada';

      return (
        <Cartao titulo={simulada ? 'Escalação simulada' : 'Escalação provável'}
          subtitulo={simulada
            ? `A ESPN não tem a escalação deste jogo. Simulei os dois times com os jogadores mais utilizados em ${ano}; ajuste à vontade.`
            : 'Monte o time para o próximo jogo. Cada troca já aparece no quadro.'}>
          {extras.carregando ? <Carregando texto="Carregando os elencos…" /> : (
            <>
              <h4 className="text-sm font-semibold text-ouro">Galo</h4>
              {elencoGalo.length ? (
                <div className="mt-2"><EditorTime time="galo" formacao={formacao} ids={provavel && provavel.ids} elenco={elencoGalo} atalhos={atalhosGalo} onAplicar={onAplicar} /></div>
              ) : <p className="mt-1 text-sm text-neutral-500">A ESPN não tem o elenco do Galo em {ano}.</p>}

              <div className="mt-5 border-t border-white/5 pt-4">
                <h4 className="text-sm font-semibold text-neutral-300">{ev.adversario.nome}</h4>
                {ultimoAdv && (
                  <>
                    <p className="mt-1 text-sm text-neutral-400">Último time: contra {ultimoAdv.adversario}, em {fData.format(new Date(ultimoAdv.data))}{ultimoAdv.formacao ? `, no ${ultimoAdv.formacao}` : ''}.</p>
                    <p className="mt-1 text-sm text-neutral-300">{ultimoAdv.titulares.map((p) => p.nome).join(', ')}</p>
                    <button onClick={() => onAplicarUltimoAdv(ultimoAdv)} className="mt-2 rounded-md border border-white/15 px-3 py-1.5 text-sm text-neutral-200 hover:border-white/40">Colocar esse time no quadro</button>
                  </>
                )}
                {temElencoAdv ? (
                  <details className="mt-3" open={!ultimoAdv}>
                    <summary className="cursor-pointer text-sm text-ouro">Montar o time do adversário com o elenco de {ano}</summary>
                    <div className="mt-3">
                      <EditorTime time="adv" formacao={formacaoAdv} ids={provavelAdv && provavelAdv.ids} elenco={elencoAdv}
                        atalhos={[[`Mais utilizados em ${ano}`, () => onAplicar('adv', formacaoAdv, sugerirProvavel(formacaoAdv, extras.elencoAdv && extras.elencoAdv.length >= 11 ? extras.elencoAdv : elencoAdv, null), buscarAdv)]]}
                        onAplicar={onAplicar} />
                    </div>
                  </details>
                ) : !ultimoAdv && (
                  <p className="mt-1 text-sm text-neutral-500">A ESPN não tem o elenco nem uma escalação recente desse adversário. O quadro usa um 4-4-2 genérico; clique nas fichas para dar nome e número.</p>
                )}
              </div>
            </>
          )}
        </Cartao>
      );
    }

    /* ---------- Estatísticas dos jogadores ---------- */
    const COLUNAS = [
      ['minutos', 'Min', 'Minutos em campo'], ['totalGoals', 'G', 'Gols'], ['goalAssists', 'A', 'Assistências'],
      ['totalShots', 'Fin', 'Finalizações'], ['shotsOnTarget', 'Alvo', 'Finalizações no alvo'], ['foulsCommitted', 'FC', 'Faltas cometidas'],
      ['foulsSuffered', 'FS', 'Faltas sofridas'], ['offsides', 'Imp', 'Impedimentos'], ['saves', 'Def', 'Defesas (goleiros)'], ['cartoes', 'Cart', 'Cartões'],
    ];
    function TabelaJogadores({ ev, resumo, elenco, selAtletaId, onAbrirPerfil }) {
      const [lado, setLado] = useState('galo');
      const [ordem, setOrdem] = useState(['minutos', -1]);
      const pre = ev.estado === 'pre';
      if (pre) {
        const lista = [...(elenco || [])].filter((p) => p.jogos > 0).sort((a, b) => b.jogos - a.jogos);
        return (
          <Cartao titulo={`Elenco do Galo em ${ANO_ATUAL}`} subtitulo="Números da temporada registrados pela ESPN. Clique num nome para abrir o perfil.">
            {!elenco ? <Carregando texto="Carregando o elenco…" /> : (
              <div className="max-h-96 overflow-auto">
                <table className="w-full text-sm tabular-nums">
                  <thead className="sticky top-0 bg-carvao"><tr className="text-left text-xs text-neutral-500">
                    <th className="py-1 pr-2 font-normal">Jogador</th><th className="py-1 pr-2 font-normal">Pos</th><th className="py-1 pr-2 font-normal">Jogos</th><th className="py-1 pr-2 font-normal">Gols</th><th className="py-1 pr-2 font-normal">Assist.</th><th className="py-1 font-normal">Cartões</th>
                  </tr></thead>
                  <tbody>{lista.map((p) => (
                    <tr key={p.id} className={'border-t border-white/5 ' + (selAtletaId === p.id ? 'bg-ouro/10' : '')}>
                      <td className="py-1.5 pr-2 text-white">{p.numero ? <span className="mr-1 text-neutral-500">{p.numero}</span> : null}<button onClick={() => onAbrirPerfil({ id: p.id, nome: p.nome, teamId: GALO_ID })} className="hover:text-ouro hover:underline">{p.nome}</button></td>
                      <td className="py-1.5 pr-2 text-neutral-400">{(p.pos || '').charAt(0)}</td>
                      <td className="py-1.5 pr-2">{p.jogos}</td><td className="py-1.5 pr-2">{p.gols}</td><td className="py-1.5 pr-2">{p.assist}</td>
                      <td className="py-1.5 text-neutral-400">{p.amarelos}{p.vermelhos ? ` + ${p.vermelhos}v` : ''}</td>
                    </tr>
                  ))}</tbody>
                </table>
              </div>
            )}
          </Cartao>
        );
      }
      const lista = ((resumo && resumo.jogadores && resumo.jogadores[lado]) || []).map((p) => ({ ...p, cartoes: (p.stats.yellowCards || 0) + (p.stats.redCards || 0) * 10 }));
      const temDefesas = lista.some((p) => p.stats.saves);
      const colunas = COLUNAS.filter(([k]) => k !== 'saves' || temDefesas);
      const valor = (p, k) => (k === 'minutos' ? p.minutos : k === 'cartoes' ? p.cartoes : p.stats[k] ?? 0);
      const ordenada = [...lista].sort((a, b) => ordem[1] * (valor(a, ordem[0]) - valor(b, ordem[0])) || (b.titular - a.titular));
      return (
        <Cartao titulo="Estatísticas dos jogadores" subtitulo={`Dados da partida ${resumo && resumo.fonte === 'sofa' ? 'pelo Sofascore' : 'pela ESPN'}. Clique numa coluna para ordenar ou num nome para abrir o perfil.`}
          direita={
            <div className="flex gap-1" role="tablist">
              {[['galo', 'Galo'], ['adv', ev.adversario.nome]].map(([k, r]) => (
                <button key={k} role="tab" aria-selected={lado === k} onClick={() => setLado(k)} className={'rounded-md px-2.5 py-1 text-sm ' + (lado === k ? 'bg-ouro text-breu font-semibold' : 'bg-grafite/60 text-neutral-300 hover:bg-grafite')}>{r}</button>
              ))}
            </div>
          }>
          {!resumo ? <Carregando texto="Carregando a súmula…" /> : !lista.length ? (
            <p className="text-sm text-neutral-500">A ESPN não tem as estatísticas individuais deste jogo.</p>
          ) : (
            <div className="overflow-x-auto">
              <table className="w-full text-sm tabular-nums">
                <thead><tr className="text-left text-xs text-neutral-500">
                  <th className="py-1 pr-2 font-normal">Jogador</th>
                  {colunas.map(([k, r, t]) => (
                    <th key={k} className="py-1 pr-2 font-normal">
                      <button onClick={() => setOrdem(([o, d]) => [k, o === k ? -d : -1])} title={t} className={'hover:text-white ' + (ordem[0] === k ? 'text-ouro' : '')}>{r}{ordem[0] === k ? (ordem[1] < 0 ? ' ↓' : ' ↑') : ''}</button>
                    </th>
                  ))}
                </tr></thead>
                <tbody>{ordenada.map((p) => (
                  <tr key={p.id} className={'border-t border-white/5 ' + (selAtletaId === p.id ? 'bg-ouro/10' : '')}>
                    <td className="py-1.5 pr-2 text-white whitespace-nowrap">
                      <span className="mr-1 text-neutral-500">{p.numero}</span><button onClick={() => onAbrirPerfil({ id: /^(sofa|gd)-/.test(String(p.id)) ? null : p.id, gd: p.gd || null, nome: p.nome, teamId: lado === 'galo' ? GALO_ID : ev.adversario.id })} className="hover:text-ouro hover:underline" title="Abrir perfil">{p.nome}</button>
                      {p.entrou && <span className="ml-1 text-xs text-green-400">↑</span>}{p.saiu && <span className="ml-1 text-xs text-red-300">↓</span>}
                    </td>
                    {colunas.map(([k]) => (
                      <td key={k} className="py-1.5 pr-2 text-neutral-300">
                        {k === 'cartoes' ? (
                          <span className="inline-flex gap-0.5">{Array.from({ length: p.stats.yellowCards || 0 }).map((_, i) => <span key={i} className="inline-block h-3 w-2 rounded-sm bg-yellow-400" title="Amarelo"></span>)}{p.stats.redCards ? <span className="inline-block h-3 w-2 rounded-sm bg-red-500" title="Vermelho"></span> : null}{!p.cartoes ? '–' : null}</span>
                        ) : valor(p, k) || (k === 'minutos' ? 0 : '–')}
                      </td>
                    ))}
                  </tr>
                ))}</tbody>
              </table>
            </div>
          )}
        </Cartao>
      );
    }

    /* ---------- Mapa de finalizações ---------- */
    function CampoSVG({ children, rotulo = 'Campo com as finalizações' }) {
      const l = { fill: 'none', stroke: 'rgba(255,255,255,0.45)', strokeWidth: 0.25 };
      const ang = Math.acos(5.5 / 9.15);
      const arco = (cx, d) => {
        const a1 = d > 0 ? -ang : Math.PI - ang, a2 = d > 0 ? ang : Math.PI + ang;
        return `M ${cx + 9.15 * Math.cos(a1)} ${A / 2 + 9.15 * Math.sin(a1)} A 9.15 9.15 0 0 1 ${cx + 9.15 * Math.cos(a2)} ${A / 2 + 9.15 * Math.sin(a2)}`;
      };
      return (
        <svg viewBox={`-3 -3 ${L + 6} ${A + 6}`} className="w-full rounded-lg" style={{ background: '#2D452B' }} role="img" aria-label={rotulo}>
          {Array.from({ length: 10 }).map((_, i) => <rect key={i} x={(i * L) / 10} y={0} width={L / 10} height={A} fill={i % 2 ? 'rgba(0,0,0,0.05)' : 'rgba(255,255,255,0.035)'} />)}
          <rect x={0} y={0} width={L} height={A} {...l} />
          <line x1={L / 2} y1={0} x2={L / 2} y2={A} {...l} />
          <circle cx={L / 2} cy={A / 2} r={9.15} {...l} />
          {[[0, 1], [L, -1]].map(([gx, d]) => (
            <g key={gx}>
              <rect x={d > 0 ? gx : gx - 16.5} y={A / 2 - 20.16} width={16.5} height={40.32} {...l} />
              <rect x={d > 0 ? gx : gx - 5.5} y={A / 2 - 9.16} width={5.5} height={18.32} {...l} />
              <rect x={d > 0 ? gx - 2 : gx} y={A / 2 - 3.66} width={2} height={7.32} {...l} />
              <path d={arco(gx + d * 11, d)} {...l} />
            </g>
          ))}
          {children}
        </svg>
      );
    }

    function MapaFinalizacoes({ ev, resumo }) {
      const [filtro, setFiltro] = useState('ambos');
      const [foco, setFoco] = useState(null);
      const lista = ((resumo && resumo.finalizacoes) || []).filter((f) => filtro === 'ambos' || f.lado === filtro);
      // Galo ataca para a direita; o adversário, para a esquerda
      const pt = (f, x, y) => (f.lado === 'galo' ? { x: (x / 100) * L, y: A * (1 - y / 100) } : { x: L - (x / 100) * L, y: A * (y / 100) });
      const total = (lado) => (resumo.finalizacoes || []).filter((f) => f.lado === lado);
      const resumoLado = (lado) => { const t = total(lado); return `${t.length} finalizações, ${t.filter((f) => f.tipo === 'alvo' || f.tipo === 'gol').length} no alvo`; };
      const NOMES = { gol: 'gol', alvo: 'no alvo', fora: 'para fora', bloqueado: 'bloqueada' };
      return (
        <Cartao titulo="Mapa de finalizações" subtitulo={`Posição de cada chute registrada ${resumo.fonte === 'sofa' && (resumo.finalizacoes || []).some((f) => f.xg != null) ? 'pelo Sofascore' : 'pela ESPN'}. O Galo ataca para a direita.`}
          direita={
            <div className="flex gap-1" role="tablist">
              {[['ambos', 'Ambos'], ['galo', 'Galo'], ['adv', ev.adversario.nome]].map(([k, r]) => (
                <button key={k} role="tab" aria-selected={filtro === k} onClick={() => setFiltro(k)} className={'rounded-md px-2.5 py-1 text-sm ' + (filtro === k ? 'bg-ouro text-breu font-semibold' : 'bg-grafite/60 text-neutral-300 hover:bg-grafite')}>{r}</button>
              ))}
            </div>
          }>
          {!(resumo.finalizacoes || []).length ? (
            <p className="text-sm text-neutral-500">A ESPN não tem a posição das finalizações deste jogo.</p>
          ) : (
            <>
              <div className="relative">
                <CampoSVG>
                  {lista.map((f, i) => {
                    const a = pt(f, f.x, f.y);
                    const b = f.x2 != null ? pt(f, f.x2, f.y2) : null;
                    const cor = f.lado === 'galo' ? OURO : '#E5E5E5';
                    const ativo = foco === i;
                    return (
                      <g key={i} onMouseEnter={() => setFoco(i)} onMouseLeave={() => setFoco(null)} onClick={() => setFoco(ativo ? null : i)} style={{ cursor: 'pointer' }}>
                        {b && (f.tipo !== 'fora' || ativo) && <line x1={a.x} y1={a.y} x2={b.x} y2={b.y} stroke={cor} strokeWidth={ativo ? 0.35 : 0.18} opacity={ativo ? 0.9 : 0.35} />}
                        {f.tipo === 'gol' && <circle cx={a.x} cy={a.y} r={1.7} fill={cor} stroke="#111" strokeWidth={0.3} />}
                        {f.tipo === 'gol' && <text x={a.x} y={a.y + 0.75} textAnchor="middle" fontSize="2" aria-hidden="true">⚽</text>}
                        {f.tipo === 'alvo' && <circle cx={a.x} cy={a.y} r={1.15} fill={cor} stroke="#111" strokeWidth={0.2} />}
                        {f.tipo === 'fora' && <circle cx={a.x} cy={a.y} r={1.05} fill="none" stroke={cor} strokeWidth={0.35} />}
                        {f.tipo === 'bloqueado' && <path d={`M ${a.x - 0.9} ${a.y - 0.9} L ${a.x + 0.9} ${a.y + 0.9} M ${a.x + 0.9} ${a.y - 0.9} L ${a.x - 0.9} ${a.y + 0.9}`} stroke={cor} strokeWidth={0.4} />}
                        <circle cx={a.x} cy={a.y} r={2.2} fill="transparent" />
                      </g>
                    );
                  })}
                </CampoSVG>
                {foco != null && lista[foco] && (
                  <div className="pointer-events-none absolute left-2 top-2 rounded-md border border-white/10 bg-breu/95 px-3 py-2 text-sm">
                    <span className={lista[foco].lado === 'galo' ? 'text-ouro' : 'text-neutral-200'}>{lista[foco].jogador}</span>
                    <span className="text-neutral-400">, {lista[foco].rotulo}, {NOMES[lista[foco].tipo]}</span>
                  </div>
                )}
              </div>
              <div className="mt-3 flex flex-wrap gap-x-5 gap-y-1 text-xs text-neutral-400">
                <span>⚽ Gol</span><span>● No alvo</span><span>○ Para fora</span><span>✕ Bloqueada</span>
              </div>
              <p className="mt-2 text-sm text-neutral-300"><span className="text-ouro">Galo:</span> {resumoLado('galo')}. <span className="text-neutral-200">{ev.adversario.nome}:</span> {resumoLado('adv')}.</p>
            </>
          )}
        </Cartao>
      );
    }

    /* ---------- Gráfico de momento ---------- */
    function TooltipMomento({ active, payload, label, nomeAdv }) {
      if (!active || !payload || !payload.length) return null;
      const p = payload[0].payload;
      return (

    const LINHAS_ESTAT = [
      ['possessionPct', 'Posse de bola', '%'], ['totalShots', 'Finalizações'], ['shotsOnTarget', 'No alvo'],
      ['wonCorners', 'Escanteios'], ['foulsCommitted', 'Faltas'], ['offsides', 'Impedimentos'],
      ['yellowCards', 'Amarelos'], ['redCards', 'Vermelhos'], ['expectedGoals', 'Gols esperados (xG)'], ['bigChanceCreated', 'Grandes chances'],
      ['passes', 'Passes'], ['accuratePasses', 'Passes certos'], ['goalkeeperSaves', 'Defesas do goleiro'], ['totalTackle', 'Desarmes'],
    ];
    const fmtNum = (v) => (Number.isInteger(v) ? v : Number(v).toLocaleString('pt-BR', { maximumFractionDigits: 2 }));
    function Estatisticas({ resumo, nomeAdv }) {
      const est = (resumo && resumo.estatisticas) || [];
      const g = est.find((e) => e.lado === 'galo'), a = est.find((e) => e.lado === 'adv');
      if (!g || !a) return null;
      const linhas = LINHAS_ESTAT.filter(([k]) => g[k] != null && a[k] != null && !(k === 'redCards' && !g[k] && !a[k]));
      if (!linhas.length) return null;
      return (
        <div className="mt-5 border-t border-white/5 pt-4">
          <div className="mb-2 flex justify-between text-xs text-neutral-400"><span className="text-ouro">Galo</span><span>{nomeAdv}</span></div>
          <dl className="space-y-2">
            {linhas.map(([k, rot, suf]) => {
              const tot = g[k] + a[k] || 1;
              return (
                <div key={k}>
                  <div className="flex justify-between text-sm tabular-nums">
                    <span className="text-white">{fmtNum(g[k])}{suf || ''}</span><dt className="text-neutral-400">{rot}</dt><span className="text-neutral-300">{fmtNum(a[k])}{suf || ''}</span>
                  </div>
                  <div className="mt-1 flex h-1.5 overflow-hidden rounded bg-white/5">
                    <div className="bg-ouro" style={{ width: `${(g[k] / tot) * 100}%` }}></div>
                    <div className="ml-auto bg-neutral-500" style={{ width: `${(a[k] / tot) * 100}%` }}></div>
                  </div>
                </div>
              );
            })}
          </dl>
        </div>
      );
    }

    function GraficoMomento({ ev, resumo, carregando }) {
      const { ResponsiveContainer, AreaChart, Area, XAxis, YAxis, Tooltip, ReferenceLine, CartesianGrid } = window.Recharts;
      const mom = resumo && resumo.momento;

      let corpo;

      else if (!mom) corpo = <p className="py-10 text-center text-sm text-neutral-400">{aoVivo ? 'Aguardando os primeiros lances.' : 'Nem o Sofascore nem a ESPN têm o lance a lance deste jogo, então não dá para medir a pressão.'}</p>;
      else {
        corpo = (
          <div className="mt-4 h-64">
            <ResponsiveContainer width="100%" height="100%">
              <AreaChart data={mom.serie} margin={{ top: 22, right: 30, left: -14, bottom: 0 }}>
                <defs>
                  <linearGradient id="gradGalo" x1="0" y1="0" x2="0" y2="1">
                    <stop offset="0%" stopColor={OURO} stopOpacity={0.75} />
                    <stop offset="100%" stopColor={OURO} stopOpacity={0.05} />
                  </linearGradient>
                  <linearGradient id="gradAdv" x1="0" y1="1" x2="0" y2="0">
                    <stop offset="0%" stopColor="#9A9A9A" stopOpacity={0.6} />
                    <stop offset="100%" stopColor="#9A9A9A" stopOpacity={0.05} />
                  </linearGradient>
                </defs>
                <CartesianGrid stroke="rgba(255,255,255,0.05)" vertical={false} />
                <XAxis dataKey="minuto" type="number" domain={[0, mom.fim]} ticks={[0, 15, 30, 45, 60, 75, 90, 105, 120].filter((t) => t <= mom.fim)} tickFormatter={(v) => v + "'"} stroke="#444" tick={{ fill: '#8a8a8a', fontSize: 11 }} />
                <YAxis domain={[-100, 100]} ticks={[-100, -50, 0, 50, 100]} tickFormatter={(v) => Math.abs(v)} stroke="#444" tick={{ fill: '#8a8a8a', fontSize: 11 }} />
                <Tooltip content={<TooltipMomento nomeAdv={nomeAdv} />} cursor={{ stroke: 'rgba(255,255,255,0.2)' }} />
                <ReferenceLine x={45} stroke="rgba(255,255,255,0.12)" strokeDasharray="2 4" />

                {(resumo.gols || []).map((g, i) => (
                  <ReferenceLine key={i} x={Math.min(g.min, mom.fim)} stroke={g.time === 'galo' ? OURO : '#CFCFCF'} strokeDasharray="3 3"
                    label={{ value: '⚽ ' + g.rotulo, position: 'top', fill: g.time === 'galo' ? OURO : '#CFCFCF', fontSize: 11 }} />
                ))}
                <Area type="monotone" dataKey="galo" baseValue={0} stroke={OURO} strokeWidth={2} fill="url(#gradGalo)" isAnimationActive={false} />
                <Area type="monotone" dataKey="adversario" baseValue={0} stroke="#9A9A9A" strokeWidth={2} fill="url(#gradAdv)" isAnimationActive={false} />

      return (
        <Cartao titulo="Momento do jogo" subtitulo={mom && mom.fonte === 'sofa' ? 'Momento de ataque do Sofascore, minuto a minuto.' : 'Pressão calculada com finalizações, escanteios e impedimentos reais.'}
          direita={mom && (
            <div className="text-right">
              <div className="font-placar text-3xl font-bold text-ouro leading-none tabular-nums">{mom.dominio}%</div>
              <div className="text-xs text-neutral-400 mt-1">da pressão foi do Galo</div>
            </div>
          )}>
          {corpo}
          {mom && (
            <div className="mt-3 flex flex-wrap gap-5 text-sm">
              <span className="flex items-center gap-2"><span className="w-3 h-3 rounded-sm bg-ouro"></span>Galo (acima de zero)</span>
              <span className="flex items-center gap-2"><span className="w-3 h-3 rounded-sm bg-neutral-400"></span>{nomeAdv} (abaixo de zero)</span>
            </div>
          )}
          <Estatisticas resumo={resumo} nomeAdv={nomeAdv} />
        </Cartao>
