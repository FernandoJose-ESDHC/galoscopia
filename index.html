    }

    function Retrospecto({ ev, retrospecto, podeCarregarTudo, onCarregarTudo, onSelecionar, gdConf }) {
      return (
        <Cartao titulo={`Retrospecto contra ${ev.adversario.nome}`}>
          {retrospecto.jogos.length === 0 ? (
            <p className="text-sm text-neutral-500">Nenhum outro confronto nos jogos da ESPN carregados.</p>
          ) : (
            <>
              <p className="text-sm text-neutral-400">
                {retrospecto.v} {retrospecto.v === 1 ? 'vitória' : 'vitórias'}, {retrospecto.e} {retrospecto.e === 1 ? 'empate' : 'empates'} e {retrospecto.d} {retrospecto.d === 1 ? 'derrota' : 'derrotas'} em {retrospecto.total} {retrospecto.total === 1 ? 'jogo' : 'jogos'}.
              </p>
              <ul className="mt-2 space-y-1">
                {retrospecto.jogos.slice(0, 8).map((j) => (
                  <li key={j.id}>
                    <button onClick={() => onSelecionar(j.id)} className="flex w-full items-center gap-3 rounded px-2 py-1 text-left text-sm hover:bg-white/5">
                      <span className="w-20 text-neutral-500 tabular-nums">{fData.format(new Date(j.data))}</span>
                      <span className="flex-1 truncate text-neutral-300">{j.mandante.nome} {j.mandante.gols}–{j.visitante.gols} {j.visitante.nome}</span>
                      <span className={'text-xs ' + (j.resultado === 'V' ? 'text-ouro' : j.resultado === 'D' ? 'text-red-300' : 'text-neutral-400')}>{ESTILO_RES[j.resultado][0]}</span>
                    </button>
                  </li>
                ))}
              </ul>
            </>
          )}
          {podeCarregarTudo && (
            <button onClick={onCarregarTudo} className="mt-2 text-sm text-ouro underline-offset-4 hover:underline">Carregar todas as temporadas para ver o retrospecto completo</button>
          )}
          <RetrospectoGD estado={gdConf} nomeAdv={ev.adversario.nome} />
        </Cartao>
      );
    }

    function useResumo(ev) {
      const [estado, setEstado] = useState({ id: null, dados: null, carregando: false });
      useEffect(() => {
        if (!ev) return;
        let vivo = true;
        const id = ev.id;
        setEstado((s) => ({ id, dados: s.id === id ? s.dados : null, carregando: true }));
        const buscar = (forcar) => carregarSumula(ev, forcar)
          .then((d) => { if (vivo) setEstado({ id, dados: d, carregando: false }); })
          .catch(() => { if (vivo) setEstado((s) => ({ ...s, id, carregando: false })); });
        buscar(false);
        let timer = null;
        if (ev.estado === 'in') timer = setInterval(() => buscar(true), ATUALIZAR_AO_VIVO);
        else if (ev.estado === 'post' && jogoRecente(ev)) timer = setInterval(() => buscar(false), 15 * 60e3);
        else if (ev.estado === 'pre' && pertoDoJogo(ev)) timer = setInterval(() => buscar(false), 2 * 60e3);
        return () => { vivo = false; if (timer) clearInterval(timer); };
      }, [ev && ev.id, ev && ev.estado]);
      return estado.id === (ev && ev.id) ? estado : { dados: null, carregando: true };
    }

    function AbaJogos({ mapa, versao, temporada, setTemporada, carregando, progresso, erro, onTentar, selId, setSelId, onVerNoGalo, calSofa }) {
      const confDe = useCallback((e) => conferirComSofa(e, calSofa), [calSofa]);
      const [comp, setComp] = useState('todas');
      const [maximizado, setMaximizado] = useState(false);
      const [minuto, setMinutoEstado] = useState(0);
      const [perfil, setPerfil] = useState(null);
      const [extras, setExtras] = useState({ id: null, carregando: false, ultimoGalo: null, ultimoAdv: null, elencoGaloAno: null, elencoAdv: null });
      const [gd, setGd] = useState({ id: null, carregandoFicha: false, ficha: null, carregandoConf: false, conf: null });
      const [formGD, setFormGD] = useState({ id: null, galo: null, adv: null });
      const [calorNoCampo, setCalorNoCampo] = useState(false);
      const canvasRef = useRef(null);
      const selRef = useRef(selId);
      selRef.current = selId;
      const salvarTimer = useRef(null);
      const pendente = useRef(null);

      const ev = selId ? mapa.current.get(selId) : null;
      const { dados: resumo, carregando: carregandoResumo } = useResumo(ev);

      const salvarQuadro = useCallback((q) => {
        const id = selRef.current;
        if (!id) return;
        clearTimeout(salvarTimer.current);
        salvarTimer.current = setTimeout(() => store.set('quadro:' + id, q), 400);
      }, []);
      const quadro = useQuadro(canvasRef, salvarQuadro);

      const todos = useMemo(() => [...mapa.current.values()], [versao]);
      const resultados = useMemo(() => todos
        .filter((e) => e.estado === 'post')
        .filter((e) => temporada === 'todas' || anoDe(e.data) === temporada)
        .filter((e) => comp === 'todas' || e.slug === comp)
        .sort((a, b) => new Date(b.data) - new Date(a.data)), [todos, temporada, comp]);
      const proximos = useMemo(() => {
        const limite = Date.now() - 4 * 3600e3;
        return todos
          .filter((e) => e.estado === 'in' || (e.estado === 'pre' && !e.adiado && new Date(e.data).getTime() > limite))
          .filter((e) => comp === 'todas' || e.slug === comp)
          .sort((a, b) => (b.estado === 'in') - (a.estado === 'in') || new Date(a.data) - new Date(b.data))
          .slice(0, 8);
      }, [todos, comp]);
      const retrospecto = useMemo(() => {
        if (!ev) return { jogos: [], v: 0, e: 0, d: 0, total: 0 };
        const base = nomeBaseTime(ev.adversario.gdPagina || ev.adversario.nome);
        const jogos = todos.filter((e) => e.resultado && e.id !== ev.id && (e.adversario.id === ev.adversario.id || nomeBaseTime(e.adversario.gdPagina || e.adversario.nome) === base))
          .sort((a, b) => new Date(b.data) - new Date(a.data));
        return { jogos, total: jogos.length, v: jogos.filter((j) => j.resultado === 'V').length, e: jogos.filter((j) => j.resultado === 'E').length, d: jogos.filter((j) => j.resultado === 'D').length };
      }, [todos, ev && ev.id]);

      const pre = ev && ev.estado === 'pre';
      const temEscalacaoESPN = !!resumo && !!resumo.escalacoes && resumo.escalacoes.length > 0 && (!pre || !!resumo.confirmada);

      // Galo Digital: ficha técnica do jogo (escalações de jogos que a ESPN não tem) e retrospecto histórico
      useEffect(() => {
        if (!ev) return;
        let vivo = true;
        const ehPre = ev.estado === 'pre';
        setGd({ id: ev.id, carregandoFicha: !ehPre, ficha: null, carregandoConf: true, conf: null });
        (async () => {
          let ficha = null;
          if (!ehPre) {
            ficha = await carregarJogoGD(ev).catch(() => null);
            if (!vivo) return;
            setGd((g) => (g.id === ev.id ? { ...g, carregandoFicha: false, ficha } : g));
          }
          let erro = false;
          const pagina = (ficha && ficha.advPagina) || ev.adversario.gdPagina || await gdPaginaAdversario(ev.adversario).catch(() => { erro = true; return null; });
          const conf = pagina ? await carregarConfrontoGD(pagina).catch(() => { erro = true; return null; }) : null;
          if (vivo) setGd((g) => (g.id === ev.id ? { ...g, carregandoConf: false, conf, erroConf: erro } : g));
        })();
        return () => { vivo = false; };
      }, [ev && ev.id, ev && ev.estado]);
      const gdPronto = !!ev && gd.id === ev.id && !gd.carregandoFicha;
      const fichaGD = ev && gd.id === ev.id ? gd.ficha : null;
      const escalaGD = !!ev && !pre && !temEscalacaoESPN && !carregandoResumo && !!fichaGD && fichaGD.galo.titulares.length >= 7;
      const formacoesGD = {
        galo: (ev && formGD.id === ev.id && formGD.galo) || formacaoPadraoGD(ev ? anoDe(ev.data) : ANO_ATUAL),
        adv: (ev && formGD.id === ev.id && formGD.adv) || formacaoPadraoGD(ev ? anoDe(ev.data) : ANO_ATUAL),
      };
      const resumoEf = useMemo(() => (escalaGD ? resumoComGD(resumo, fichaGD, formacoesGD.galo, formacoesGD.adv) : resumo),
        [escalaGD, resumo, fichaGD, formacoesGD.galo, formacoesGD.adv]);
      const temEscalacaoReal = temEscalacaoESPN || escalaGD;
      const semEscalacao = ev && !pre && !temEscalacaoReal && !carregandoResumo && gdPronto;

      // Elencos da temporada do jogo (Galo e adversário) e, nos próximos jogos, os últimos times
      useEffect(() => {
        if (!ev) return;
        let vivo = true;
        const ano = anoDe(ev.data);
        const ehPre = ev.estado === 'pre';
        setExtras({ id: ev.id, carregando: true, ultimoGalo: null, ultimoAdv: null, elencoGaloAno: null, elencoAdv: null });
        const tarefas = ev.fonte === 'gd' ? [Promise.resolve([]), Promise.resolve([])] : [carregarElenco(ano), carregarElencoTime(ev.adversario.id, ano)];
        if (ehPre) {
          const ultimoJogo = [...mapa.current.values()].filter((e) => e.estado === 'post' && e.resultado).sort((a, b) => new Date(b.data) - new Date(a.data))[0];
          tarefas.push(ultimoJogo
            ? carregarSumula(ultimoJogo, false).then((r) => {
                const e = (r.escalacoes || []).find((x) => x.lado === 'galo');
                return e ? { ...e, data: ultimoJogo.data, adversario: ultimoJogo.adversario.nome } : null;
              })
            : Promise.resolve(null));
          tarefas.push(carregarUltimoTime(ev.adversario.id, ev.slug));
        }
        Promise.allSettled(tarefas).then((r) => {
          const v = (i) => (r[i] && r[i].status === 'fulfilled' ? r[i].value : null);
          if (vivo) setExtras({ id: ev.id, carregando: false, elencoGaloAno: v(0) || [], elencoAdv: v(1) || [], ultimoGalo: ehPre ? v(2) : null, ultimoAdv: ehPre ? v(3) : null });
        });
        return () => { vivo = false; };
      }, [ev && ev.id, ev && ev.estado]);
      const extrasProntos = ev && extras.id === ev.id && !extras.carregando;

      // Troca de jogo: abre o quadro salvo ou aguarda os dados para montar o inicial
      useEffect(() => {
        if (!selId) return;
        const salvo = store.get('quadro:' + selId);
        if (salvo && salvo.versao === 3) { quadro.carregar(salvo, { salvo: true }); pendente.current = null; }
        else { quadro.carregar(quadroVazio()); pendente.current = selId; }
        const e = mapa.current.get(selId);
        setMinutoEstado(e && e.estado === 'in' ? 999 : 0);
      }, [selId]);

      const buscarEm = (lista) => (id) => (lista || []).find((p) => p.id === id);

      // Escalação provável (próximo jogo) ou simulada (jogo sem escalação na ESPN)
      const montarSimulado = useCallback(() => {
        const x = extras;
        const ehPre = ev.estado === 'pre';
        const g = ehPre ? x.ultimoGalo : null;
        const elencoG = (x.elencoGaloAno || []).concat(g ? g.titulares.concat(g.reservas || []) : []);
        const formacao = g && FORMACOES[g.formacao] ? g.formacao : '4-2-3-1';
        const ids = sugerirProvavel(formacao, x.elencoGaloAno, g);
        const q = quadroVazio();
        q.fases[0].nome = ehPre ? 'Escalação provável' : 'Escalação simulada';
        q.simulada = !ehPre;
        q.provavel = { formacao, ids };
        let adv;
        if (x.ultimoAdv) adv = entidadesDaEscalacao(x.ultimoAdv.titulares, 'adv', x.ultimoAdv.formacao);
        else if ((x.elencoAdv || []).length >= 11) {
          const fa = '4-4-2';
          const ia = sugerirProvavel(fa, x.elencoAdv, null);
          q.provavelAdv = { formacao: fa, ids: ia };
          adv = entidadesProvaveis(fa, ia, buscarEm(x.elencoAdv), 'adv');
        } else { adv = entidadesModeloAdv('4-4-2'); q.advGenerico = true; }
        const galo = (x.elencoGaloAno || []).length || g ? entidadesProvaveis(formacao, ids, buscarEm(elencoG), 'galo') : entidadesModelo('4-2-3-1', 'galo');
        galo.concat(adv).forEach(({ x: px, y: py, ...ent }) => { q.entidades[ent.chave] = ent; q.fases[0].pos[ent.chave] = { x: px, y: py }; });
        return q;
      }, [extras, ev]);

      // Monta o quadro inicial quando os dados chegam
      useEffect(() => {
        if (!ev || pendente.current !== ev.id) return;
        if (temEscalacaoReal) {
          pendente.current = null;
          const m = ev.estado === 'in' ? resumoEf.fimJogo : 0;
          seguirAgora.current = ev.estado === 'in';
          setMinutoEstado(m);
          quadro.carregar(quadroDoJogo(resumoEf, m));
          return;
        }
        if (!pre && carregandoResumo) return;
        if (!pre && !gdPronto) return;   // antes de simular, procura a ficha no Galo Digital
        if (!extrasProntos) return;
        pendente.current = null;
        quadro.carregar(montarSimulado());
      }, [resumo, carregandoResumo, extras, gd, ev && ev.id]);

      // Minuto escolhido: atualiza nomes nas fichas (as posições ficam como estão)
      const seguirAgora = useRef(false);
      const dadosDoMinuto = (r, m) => {
        const dados = {};
        (r.escalacoes || []).forEach((esc) => {
          const time = esc.lado === 'galo' ? 'galo' : 'adv';
          timeNoMinuto(esc, m).forEach((p, i) => { dados[`${time}-s${i}`] = { numero: p.numero, nome: p.nome, atletaId: p.id, entrou: p.entrou, expulso: p.expulso, gd: p.gd || null, gdJogo: p.gdJogo || null }; });
        });
        return dados;
      };
      const setMinuto = (m) => {
        setMinutoEstado(m);
        if (!resumoEf) return;
        seguirAgora.current = !!ev && ev.estado === 'in' && m >= (resumoEf.fimJogo || 90);
        quadro.atualizarDados(dadosDoMinuto(resumoEf, m));
      };

      // Escalação sempre em dia: quando sai a confirmada, quando o jogo começa, a cada troca ao vivo
      // e quando o Sofascore/ESPN corrigem a súmula depois. As fichas mudam; desenhos e fases ficam.
      const [avisoAuto, setAvisoAuto] = useState('');
      useEffect(() => { setAvisoAuto(''); }, [selId]);
      useEffect(() => {
        if (!ev || !resumoEf || pendente.current === ev.id || !temEscalacaoReal) return;
        const sig = assinaturaEsc(resumoEf);
        const q = quadro.quadro();
        if (sig && q.escalacaoChave !== sig) {
          const m = ev.estado === 'in' ? resumoEf.fimJogo : 0;
          const novo = quadroDoJogo(resumoEf, m);
          quadro.definirEntidades(Object.values(novo.entidades).map((ent) => ({ ...ent, ...novo.fases[0].pos[ent.chave] })), ['galo', 'adv']);
          quadro.definirCampos({ escalacaoChave: sig, fonte: novo.fonte, simulada: false, provavel: null, provavelAdv: null, advGenerico: false });
          seguirAgora.current = ev.estado === 'in';
          setMinutoEstado(m);
          setAvisoAuto(`Escalação atualizada automaticamente às ${fHora.format(new Date())}, ${resumoEf.confirmada ? 'com o time confirmado' : ev.estado === 'in' ? 'com o jogo em andamento' : 'com a súmula'} ${novo.fonte === 'sofa' ? 'do Sofascore' : 'da ESPN'}.`);
          return;
        }
        // Ao vivo, seguindo o minuto atual: aplica trocas e expulsões novas (só se algo mudou)
        if (ev.estado === 'in' && seguirAgora.current) {
          const dados = dadosDoMinuto(resumoEf, resumoEf.fimJogo || 90);
          const mudou = Object.entries(dados).some(([k, d]) => { const e = q.entidades[k]; return e && (e.atletaId !== d.atletaId || !!e.expulso !== !!d.expulso); });
          if (mudou) { quadro.atualizarDados(dados); setMinutoEstado(resumoEf.fimJogo || 90); }
        }
      }, [resumoEf, temEscalacaoReal]);
      const minutoExibido = resumoEf ? Math.min(minuto, resumoEf.fimJogo || 90) : 0;

      // Formação estimada da escalação vinda do Galo Digital
      const trocarFormacaoGD = (lado, f) => {
        if (quadro.alterado && !window.confirm('Isso remonta o quadro e apaga as mudanças que você fez. Continuar?')) return;
        const novo = { ...formacoesGD, [lado]: f };
        setFormGD({ id: ev.id, ...novo });
        store.del('quadro:' + selId);
        setMinutoEstado(0);
        quadro.carregar(quadroDoJogo(resumoComGD(resumo, fichaGD, novo.galo, novo.adv), 0));
      };

      const recomecar = () => {
        if (quadro.alterado && !window.confirm('Isso apaga as mudanças que você fez no quadro deste jogo. Continuar?')) return;
        store.del('quadro:' + selId);
        if (temEscalacaoReal) { setMinutoEstado(0); quadro.carregar(quadroDoJogo(resumoEf, 0)); }
        else if (extrasProntos) quadro.carregar(montarSimulado());
        else quadro.carregar(quadroVazio());
      };

      const aplicarTime = (time, formacao, ids, buscar) => {
        const q = quadro.quadro();
        if (q.fases.length > 1 && !window.confirm('O quadro tem mais de uma fase. A nova escalação vale para todas elas. Continuar?')) return;
        quadro.definirEntidades(entidadesProvaveis(formacao, ids, buscar, time), [time]);
        quadro.definirProvavel({ formacao, ids }, time === 'galo' ? 'provavel' : 'provavelAdv');
      };
      const aplicarUltimoAdv = (t) => quadro.definirEntidades(entidadesDaEscalacao(t.titulares, 'adv', t.formacao), ['adv']);

      const contagem = quadro.contagem();
      const qAtual = quadro.quadro();
      const entSel = quadro.selecionado ? qAtual.entidades[quadro.selecionado] : null;
      const selAtletaId = entSel ? entSel.atletaId : null;
      const renderCartao = (ent, flutuante) => (
        <CartaoJogador key={ent.chave} ent={ent} ev={ev} resumo={resumo} elencoGalo={extras.elencoGaloAno} flutuante={flutuante}
          onEditar={(k, d) => quadro.editarEntidade(k, d)} onFechar={quadro.desselecionar} onAbrirPerfil={setPerfil}
          noCampo={calorNoCampo} setNoCampo={setCalorNoCampo} definirCamada={quadro.definirCamada} />
      );
      const quadroAntigo = false && temEscalacaoESPN && resumo && resumo.fonte === 'sofa' && qAtual.fonte !== 'sofa' && !qAtual.simulada && Object.keys(qAtual.entidades || {}).length > 0;
      const avisoQuadro = avisoAuto ? avisoAuto : quadroAntigo
        ? 'Este quadro foi salvo com a escalação antiga, da ESPN. Clique em "Usar escalação real" para refazer com a do Sofascore (seus desenhos deste jogo serão apagados).'
        : escalaGD && !qAtual.simulada
        ? 'Escalação da ficha técnica do Galo Digital (nem o Sofascore nem a ESPN têm este jogo). As posições seguem uma formação estimada.'
        : qAtual.simulada && ev && ev.fonte === 'gd'
        ? 'Jogo antigo sem ficha técnica no Galo Digital: as fichas são genéricas. Clique nelas para dar nome e número.'
        : qAtual.simulada
        ? `Escalação simulada: nem o Sofascore nem a ESPN têm a escalação deste jogo, então montei os times com os mais utilizados em ${ev ? anoDe(ev.data) : ''}.`
        : qAtual.advGenerico ? 'Sem dados do adversário na ESPN: as fichas cinzas são genéricas.' : '';

      return (
        <div className="flex flex-col lg:flex-row">
          <Sidebar
            temporada={temporada} setTemporada={setTemporada} comp={comp} setComp={setComp}
            proximos={proximos} resultados={resultados} selId={selId} onSelecionar={setSelId} confDe={confDe}
            carregando={carregando} progresso={progresso} erro={erro} onTentar={onTentar}
          />
          <main className="flex-1 min-w-0 flex flex-col">
            {ev ? (
              <Placar ev={ev} resumo={resumo} contagem={contagem} conf={confDe(ev)}
                onAddGalo={() => quadro.adicionar('galo')} onAddAdv={() => quadro.adicionar('adv')}
                onRecomecar={recomecar}
                rotuloRecomecar={pre ? 'Recomeçar escalação provável' : temEscalacaoReal ? 'Usar escalação real' : 'Recomeçar escalação simulada'} />
            ) : (
              <header className="listras bg-breu border-b border-white/5 px-6 py-8 text-neutral-400">
                {carregando ? 'Buscando os jogos do Galo…' : 'Escolha um jogo na lista.'}
              </header>
            )}

            <div className="space-y-5 p-5">
              <QuadroTatico api={quadro} canvasRef={canvasRef} ev={ev} renderCartao={renderCartao} aviso={avisoQuadro} maximizado={maximizado} setMaximizado={setMaximizado} />
              {ev && (
                <>
                  <div className="grid gap-5 2xl:grid-cols-2">
                    {temEscalacaoReal ? (
                      <PainelEscalacaoJogo ev={ev} resumo={resumoEf} minuto={minutoExibido} setMinuto={setMinuto}
                        formacoesGD={formacoesGD} onFormacaoGD={trocarFormacaoGD} urlGD={fichaGD && fichaGD.url} />
                    ) : pre || semEscalacao ? (
                      <PainelProvavel ev={ev} modo={pre ? 'provavel' : 'simulada'} extras={extras.id === ev.id ? extras : { carregando: true }}
                        provavel={qAtual.provavel} provavelAdv={qAtual.provavelAdv} onAplicar={aplicarTime} onAplicarUltimoAdv={aplicarUltimoAdv} />
                    ) : (
                      <Cartao titulo="Escalações"><Carregando texto={carregandoResumo ? 'Carregando a súmula…' : 'Procurando a ficha do jogo no Galo Digital…'} /></Cartao>
                    )}
                    {pre ? (
                      <TabelaJogadores ev={ev} resumo={resumo} elenco={extras.elencoGaloAno} selAtletaId={selAtletaId} onAbrirPerfil={setPerfil} />
                    ) : (
                      <GraficoMomento ev={ev} resumo={resumo} carregando={carregandoResumo} />
                    )}
                  </div>
                  {!pre && resumo && (
                    <div className="grid gap-5 2xl:grid-cols-2">
                      <MapaFinalizacoes ev={ev} resumo={resumo} />
                      <TabelaJogadores ev={ev} resumo={resumo} elenco={extras.elencoGaloAno} selAtletaId={selAtletaId} onAbrirPerfil={setPerfil} />
                    </div>
                  )}
                  <div className="grid gap-5 2xl:grid-cols-2">
                    <Retrospecto ev={ev} retrospecto={retrospecto} podeCarregarTudo={temporada !== 'todas'} onCarregarTudo={() => setTemporada('todas')} onSelecionar={setSelId}
                      gdConf={gd.id === ev.id ? { carregando: gd.carregandoConf, c: gd.conf, erro: gd.erroConf } : { carregando: true, c: null }} />
                    {fichaGD && <CartaoFichaGD ficha={fichaGD} ev={ev} />}
                  </div>
                </>
              )}
            </div>
          </main>
          {perfil && <PerfilJogador alvo={perfil} onFechar={() => setPerfil(null)} onVerNoGalo={onVerNoGalo} />}
        </div>
      );
    }

    /* =========================================================
       8. ABA JOGADORES
       ========================================================= */
    function Notas({ chave }) {
      const [texto, setTexto] = useState(() => (store.get('notas', {})[chave] || ''));
      const [salvo, setSalvo] = useState(true);
      useEffect(() => { setTexto(store.get('notas', {})[chave] || ''); setSalvo(true); }, [chave]);
      useEffect(() => {
        if (salvo) return;
        const t = setTimeout(() => {
          const n = store.get('notas', {});
          if (texto.trim()) n[chave] = texto; else delete n[chave];
          store.set('notas', n);
          setSalvo(true);
        }, 500);
        return () => clearTimeout(t);
      }, [texto, salvo, chave]);
      return (
        <label className="block">
          <span className="text-sm font-semibold text-neutral-300">Suas anotações</span>
          <textarea value={texto} onChange={(e) => { setTexto(e.target.value); setSalvo(false); }} rows={4}
            placeholder="Lembranças, jogos marcantes, curiosidades…"
            className="mt-2 w-full rounded-md border border-white/10 bg-breu px-3 py-2 text-sm text-neutral-100 placeholder:text-neutral-600" />
          <span className="text-xs text-neutral-500">{salvo ? 'Salvo neste navegador.' : 'Salvando…'}</span>
        </label>
      );
    }

    function BotaoFavorito({ ativo, onClick }) {
      return (
        <button onClick={onClick} aria-pressed={ativo} className={'rounded-md border px-3 py-1.5 text-sm transition-colors ' + (ativo ? 'border-ouro/60 bg-ouro/10 text-ouro' : 'border-white/15 text-neutral-300 hover:border-white/40')}>
          {ativo ? '★ Nos favoritos' : '☆ Favoritar'}
        </button>
      );
    }

    function Dado({ rotulo, valor }) {
      return (
        <div className="rounded-lg bg-breu/60 px-3 py-2">
          <div className="font-placar text-2xl leading-none text-white tabular-nums">{valor}</div>
          <div className="mt-1 text-xs text-neutral-500">{rotulo}</div>
        </div>
      );
    }

    const nomeClube = (nome) => {
      const p = PAISES[nome];
      if (!p) return nome;
      return p === 'Estados Unidos' ? 'Seleção dos Estados Unidos' : `Seleção ${p === 'Brasil' ? 'Brasileira' : p}`;
    };

    /* ---------- Temporada a temporada com as fontes ---------- */
    const FONTE_ROTULO = { sofa: 'Sofascore', gd: 'Galo Digital', espn: 'ESPN' };
    const fmtNota = (n) => (n ? n.toFixed(2).replace('.', ',') : '–');

    function TabelaTemporadasGalo({ temporadas, goleiro }) {
      const [aberto, setAberto] = useState(null);
      const linhas = [...temporadas].sort((a, b) => b.ano - a.ano);
      const fontesDe = (t) => {
        if (!t.comps) return 'ESPN';
        const f = [...new Set(Object.values(t.comps).map((c) => c.fonte))];
        return f.map((x) => FONTE_ROTULO[x]).join(' + ');
      };
      return (
        <div className="tabela-temporadas overflow-x-auto">
          <table className="w-full text-sm tabular-nums">
            <thead>
              <tr className="text-left text-xs text-neutral-500">
                <th className="py-1 pr-3 font-normal">Ano</th><th className="py-1 pr-3 font-normal">Jogos</th><th className="py-1 pr-3 font-normal">Tit.</th>
                <th className="py-1 pr-3 font-normal">Min.</th><th className="py-1 pr-3 font-normal">{goleiro ? 'Gols sofr.' : 'Gols'}</th><th className="py-1 pr-3 font-normal">Assist.</th>
                <th className="py-1 pr-3 font-normal">Cartões</th><th className="py-1 pr-3 font-normal">Nota</th><th className="py-1 font-normal">Fonte</th>
              </tr>
            </thead>
            <tbody>
              {linhas.map((t) => {
                const comps = t.comps ? Object.entries(t.comps).sort((a, b) => b[1].jogos - a[1].jogos) : [];
                const abre = aberto === t.ano;
                return (
                  <React.Fragment key={t.ano}>
                    <tr className="border-t border-white/5">
                      <td className="py-1.5 pr-3">
                        {comps.length ? (
                          <button onClick={() => setAberto(abre ? null : t.ano)} aria-expanded={abre} className="text-white hover:text-ouro">{abre ? '▾' : '▸'} {t.ano}</button>
                        ) : <span className="text-white">{t.ano}</span>}
                      </td>
                      <td className="py-1.5 pr-3">{t.jogos}</td>
                      <td className="py-1.5 pr-3 text-neutral-400">{t.titular ?? '–'}</td>
                      <td className="py-1.5 pr-3 text-neutral-400">{t.minutos ? t.minutos.toLocaleString('pt-BR') : '–'}</td>
                      <td className="py-1.5 pr-3">{goleiro ? (t.sofridos || '–') : t.gols}</td>
                      <td className="py-1.5 pr-3">{t.assist}</td>
                      <td className="py-1.5 pr-3 text-neutral-400">{t.amarelos || 0}{t.vermelhos ? <span className="text-red-300"> / {t.vermelhos}</span> : ''}</td>
                      <td className="py-1.5 pr-3 text-neutral-400">{fmtNota(t.nota)}</td>
                      <td className="py-1.5 text-xs text-neutral-500">{fontesDe(t)}</td>
                    </tr>
                    {abre && comps.map(([k, c]) => (
                      <tr key={k} className="text-xs text-neutral-400">
                        <td className="py-1 pl-5 pr-3">{nomeComp(k)}</td>
                        <td className="py-1 pr-3">{c.jogos}</td><td className="py-1 pr-3">{c.titular || '–'}</td>
                        <td className="py-1 pr-3">{c.minutos ? c.minutos.toLocaleString('pt-BR') : '–'}</td>
                        <td className="py-1 pr-3">{goleiro ? (c.sofridos || '–') : c.gols}</td><td className="py-1 pr-3">{c.assist}</td>
                        <td className="py-1 pr-3">{c.fonte === 'sofa' ? `${c.amarelos || 0}${c.vermelhos ? ` / ${c.vermelhos}` : ''}` : '–'}</td>
                        <td className="py-1 pr-3">{fmtNota(c.nota)}</td><td className="py-1">{FONTE_ROTULO[c.fonte]}</td>
                      </tr>
                    ))}
                  </React.Fragment>
                );
              })}
            </tbody>
          </table>
          <p className="mt-1 text-xs text-neutral-500">
            Cada competição vem do Sofascore quando ele tem os números daquele campeonato e ano; o que faltar (estaduais antigos, Copa do Brasil, amistosos e
            jogos que o Sofascore não registrou) vem do Galo Digital, que tem a tabela por atleta desde 2010. De 2007 a 2009 só há o Brasileirão, pela ESPN.
            Cartões e minutos só existem nos números do Sofascore. Clique no ano para ver por competição.
          </p>
        </div>
      );
    }

    function PerfilSofa({ id }) {
      const [p, setP] = useState(null);
      useEffect(() => { let vivo = true; setP(null); if (id) carregarJogadorSofa(id).then((x) => vivo && setP(x)).catch(() => {}); return () => { vivo = false; }; }, [id]);
      if (!p) return null;
      const itens = [['Altura', p.altura ? `${(p.altura / 100).toFixed(2).replace('.', ',')} m` : null], ['Pé preferido', p.pe], ['Clube atual', p.clube]].filter(([, v]) => v);
      if (!itens.length) return null;
      return (
        <p className="perfil-sofa text-sm text-neutral-400">
          {itens.map(([k, v]) => <span key={k} className="mr-4">{k}: <span className="text-neutral-200">{v}</span></span>)}
          {p.url && <a href={p.url} target="_blank" rel="noopener noreferrer" className="text-ouro hover:underline">Sofascore ↗</a>}
        </p>
      );
    }

    // Jogador que só aparece no Sofascore ou no Galo Digital (sem cadastro da ESPN)
    function DetalheCompleto({ j, favorito, onFavoritar }) {
      const goleiro = j.pos === 'G';
      return (
        <article className="space-y-5">
          <div>
            <h2 className="font-placar text-3xl font-bold leading-tight text-white">{j.nome}</h2>
            {j.completo && j.completo !== j.nome && <p className="text-sm text-neutral-500">{j.completo}</p>}
            <p className="mt-1 text-sm text-neutral-400">{posPt(j.pos)}. No Galo: {periodos(j.temporadas.map((t) => t.ano)).join(', ')}.</p>
            <div className="mt-3 flex flex-wrap gap-2"><BotaoFavorito ativo={favorito} onClick={onFavoritar} /></div>
          </div>
          <PerfilSofa id={j.sofaId} />
          <div className="grid grid-cols-2 sm:grid-cols-4 gap-2">
            <Dado rotulo="Jogos" valor={j.jogos} />
            <Dado rotulo={goleiro ? 'Gols sofridos' : 'Gols'} valor={goleiro ? j.temporadas.reduce((s, t) => s + (t.sofridos || 0), 0) : j.gols} />
            <Dado rotulo="Assistências" valor={j.assist} />
            <Dado rotulo="Cartões (amarelos/vermelhos)" valor={`${j.amarelos}/${j.vermelhos}`} />
          </div>

    function exportarDados() {
      const quadros = {};
      store.chaves('quadro:').forEach((k) => { quadros[k.slice('quadro:'.length)] = store.get(k); });
      const dados = { app: 'galoscopia', versao: 2, exportadoEm: new Date().toISOString(), notas: store.get('notas', {}), favoritos: store.get('favoritos', []), meusJogadores: store.get('meusJogadores', []), quadros };
      const blob = new Blob([JSON.stringify(dados, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      baixarArquivo(url, `galoscopia-${new Date().toISOString().slice(0, 10)}.json`);
      setTimeout(() => URL.revokeObjectURL(url), 1000);
    }
    function importarDados(arquivo, aoTerminar) {
      const r = new FileReader();
      r.onload = () => {
        try {
          const d = JSON.parse(r.result);
          if (d.app !== 'galoscopia' && d.app !== 'tactical-studio-galo') throw new Error('arquivo de outro app');
          store.set('notas', { ...store.get('notas', {}), ...(d.notas || {}) });
          store.set('favoritos', [...new Set([...store.get('favoritos', []), ...(d.favoritos || [])])]);
          const meus = store.get('meusJogadores', []);
          (d.meusJogadores || []).forEach((m) => { if (!meus.some((x) => x.id === m.id)) meus.push(m); });
          store.set('meusJogadores', meus);
          Object.entries(d.quadros || {}).forEach(([id, v]) => store.set('quadro:' + id, v));
          aoTerminar('Backup importado.');
        } catch (e) { aoTerminar('Não deu para importar: o arquivo não é um backup do Galoscópia.'); }
      };
      r.readAsText(arquivo);
    }

    function AbaJogadores({ alvo }) {
      const [indice, setIndice] = useState(null);
      const [extras, setExtras] = useState([]);
      const [completando, setCompletando] = useState(null);
      const [temporadaF, setTemporadaF] = useState('todas');
      const [perfil, setPerfil] = useState(null);
      const [progresso, setProgresso] = useState(null);
      const [erro, setErro] = useState('');
      const [grupo, setGrupo] = useState('espn');
      const [busca, setBusca] = useState('');
      const [pos, setPos] = useState('todas');
      const [ordem, setOrdem] = useState('jogos');
      const [limite, setLimite] = useState(100);
      const [sel, setSel] = useState(null);
      const [criando, setCriando] = useState(false);
      const [favoritos, setFavoritos] = useState(() => store.get('favoritos', []));
      const [meus, setMeus] = useState(() => store.get('meusJogadores', []));
      const [aviso, setAviso] = useState('');
      const [hist, setHist] = useState(null);
      const [histProg, setHistProg] = useState(null);
      const [histErro, setHistErro] = useState('');
      const [anoH, setAnoH] = useState('todas');
      const inputArquivo = useRef(null);
      const buscandoHist = useRef(false);

      // Jogadores de antes de 2007 (Galo Digital): só busca quando a lista é aberta
      const carregarHist = () => {
        if (buscandoHist.current) return;
        buscandoHist.current = true;
        setHistErro(''); setHistProg({ feitos: 0, total: 44 });
        carregarJogadoresHistoricos((feitos, total) => setHistProg({ feitos, total }))
          .then((r) => {
            setHist(r.lista);
            if (r.falhas) setAviso('Algumas fichas técnicas antigas não carregaram; os números ano a ano podem ficar incompletos. Recarregue para tentar de novo.');
          })
          .catch(() => setHistErro('Não foi possível buscar os jogadores antigos no Galo Digital. Confira a conexão.'))
          .finally(() => { buscandoHist.current = false; setHistProg(null); });
      };

      const carregar = () => {
        setErro(''); setProgresso({ feitos: 0, total: ANO_ATUAL - PRIMEIRO_ANO + 1 });
        carregarIndice((feitos, total) => setProgresso({ feitos, total }))
          .then(({ lista, falhas }) => {
            setIndice(lista); setProgresso(null);
            if (!lista.length) setErro('Não foi possível buscar os elencos. Confira a conexão.');
            else if (falhas) setAviso(`${falhas} temporada(s) não carregaram. Recarregue a página para tentar de novo.`);
            if (!lista.length) return;
            // Segunda etapa: números completos por competição (Sofascore e Galo Digital)
            setCompletando({ feitos: 0, total: ANO_ATUAL - PRIMEIRO_ANO_COMPLETO + 1 });
            completarIndice(lista, (feitos, total) => setCompletando({ feitos, total }))
              .then((r) => {
                setIndice(r.lista.map((j) => ({ ...j, completoCarregado: true })));
                setExtras(r.extras.map((j) => ({ ...j, completoCarregado: true })));
                if (r.falhas) setAviso(`${r.falhas} temporada(s) do Sofascore/Galo Digital não carregaram; nelas ficam os números da ESPN.`);
              })
              .catch(() => setAviso('Não foi possível completar com o Sofascore e o Galo Digital agora. Os números são só da ESPN.'))
              .finally(() => setCompletando(null));
          })
          .catch(() => { setProgresso(null); setErro('Não foi possível buscar os elencos. Confira a conexão.'); });
      };
      useEffect(() => { carregar(); }, []);
      useEffect(() => {
        if (!hist && (grupo === 'historia' || (grupo === 'favoritos' && favoritos.some((f) => f.startsWith('hist:'))))) carregarHist();
      }, [grupo]);

      const alternarFavorito = (chave) => {
        const nova = favoritos.includes(chave) ? favoritos.filter((x) => x !== chave) : [...favoritos, chave];
        setFavoritos(nova); store.set('favoritos', nova);
      };

      const itens = useMemo(() => {
        const porTemporada = temporadaF !== 'todas';
        const espn = (indice || []).map((j) => {
          const t = porTemporada ? j.temporadas.find((x) => x.ano === temporadaF) : j;
          if (!t) return null;
          return { chave: 'espn:' + j.id, tipo: 'espn', j, nome: j.nome, pos: j.pos, sub: porTemporada ? `${temporadaF}${t.numero ? `, camisa ${t.numero}` : ''}` : periodos(j.temporadas.map((x) => x.ano)).join(', '), jogos: t.jogos, gols: t.gols, assist: t.assist, amarelos: t.amarelos, vermelhos: t.vermelhos, recente: j.ultimo, atual: j.atual };
        }).filter(Boolean);
        const soCompletos = extras.map((j) => {
          const t = porTemporada ? j.temporadas.find((x) => x.ano === temporadaF) : j;
          if (!t) return null;
          return { chave: 'completo:' + j.id, tipo: 'completo', j, nome: j.nome, pos: j.pos, sub: porTemporada ? String(temporadaF) : periodos(j.temporadas.map((x) => x.ano)).join(', '), jogos: t.jogos, gols: t.gols, assist: t.assist, amarelos: t.amarelos, vermelhos: t.vermelhos, recente: j.ultimo, atual: j.atual };
        }).filter(Boolean);
        espn.push(...soCompletos);
        const lendas = LENDAS.map((j) => ({ chave: 'lenda:' + j.id, tipo: 'lenda', j, nome: j.nome, pos: j.pos, sub: j.periodo, jogos: j.jogos || 0, gols: j.gols || 0, assist: 0, amarelos: 0, vermelhos: 0, recente: 0 }));
        const lendaPorTitulo = new Map(LENDAS.filter((l) => l.gd).map((l) => [l.gd, l]));
        const histTodos = (hist || []).map((j) => ({
          chave: 'hist:' + j.id, tipo: 'hist', j, lenda: j.t ? lendaPorTitulo.get(j.t) || null : null, nome: j.n, pos: j.p,
          sub: periodoHist(j, true) + (j.so ? ', só nas fichas' : ''), jogos: j.j || 0, gols: j.p === 'G' ? 0 : j.g || 0,
          assist: 0, amarelos: 0, vermelhos: 0, recente: j.ate || j.de || 0, semGols: j.p === 'G', semJogos: !j.j,
        }));
        const histI = anoH === 'todas' ? histTodos
          : histTodos.filter(({ j }) => (j.de && j.de <= anoH && anoH <= (j.ate || j.de)) || (j.fichas && j.fichas[anoH]));
        const meusI = meus.map((j) => ({ chave: 'meu:' + j.id, tipo: 'meu', j, nome: j.nome, pos: j.pos, sub: j.periodo, jogos: j.jogos || 0, gols: j.gols || 0, assist: 0, amarelos: 0, vermelhos: 0, recente: 0 }));
        let base = grupo === 'espn' ? espn : grupo === 'historia' ? histI : grupo === 'lendas' ? lendas : grupo === 'meus' ? meusI : [...espn, ...histTodos, ...lendas, ...meusI].filter((x) => favoritos.includes(x.chave));
        const q = semAcento(busca);
        if (q) base = base.filter((x) => semAcento(x.nome + ' ' + (x.j.completo || '')).includes(q));
        if (pos !== 'todas') base = base.filter((x) => (x.pos || '').charAt(0) === pos);
        const cmp = {
          jogos: (a, b) => b.jogos - a.jogos || a.nome.localeCompare(b.nome, 'pt-BR'),
          gols: (a, b) => b.gols - a.gols || b.jogos - a.jogos,
          assist: (a, b) => b.assist - a.assist || b.jogos - a.jogos,
          amarelos: (a, b) => b.amarelos - a.amarelos || b.jogos - a.jogos,
          vermelhos: (a, b) => b.vermelhos - a.vermelhos || b.amarelos - a.amarelos,
          recentes: (a, b) => b.recente - a.recente || b.jogos - a.jogos,
          nome: (a, b) => a.nome.localeCompare(b.nome, 'pt-BR'),
        }[ordem];
        return [...base].sort(cmp);
      }, [indice, extras, meus, grupo, busca, pos, ordem, favoritos, temporadaF, hist, anoH]);

      useEffect(() => setLimite(100), [grupo, busca, pos, ordem, temporadaF, anoH]);

      // Vindo do perfil ("Ver trajetória no Galo"): seleciona o jogador na lista
      useEffect(() => {
        if (!alvo || !indice) return;
        const j = indice.find((x) => (x.ids || [x.id]).includes(String(alvo.id)));
        setGrupo('espn'); setTemporadaF('todas'); setPos('todas'); setCriando(false);
        if (j) { setBusca(''); setSel('espn:' + j.id); }
        else setBusca(alvo.nome || '');
      }, [alvo && alvo.t, indice]);

      const metrica = (x) => ({
        amarelos: `${x.amarelos} ${x.amarelos === 1 ? 'amarelo' : 'amarelos'}`,
        vermelhos: `${x.vermelhos} ${x.vermelhos === 1 ? 'vermelho' : 'vermelhos'}`,
        assist: `${x.assist} ${x.assist === 1 ? 'assistência' : 'assistências'}`,
      }[ordem] || (x.semJogos ? 'jogos não informados' : `${x.jogos} ${x.jogos === 1 ? 'jogo' : 'jogos'}` + (x.semGols ? '' : `, ${x.gols} ${x.gols === 1 ? 'gol' : 'gols'}`)));
      const selecionado = sel ? itens.find((x) => x.chave === sel) || null : null;

      const salvarNovo = (j) => {
        const lista = [...meus, j];
        setMeus(lista); store.set('meusJogadores', lista);
        setCriando(false); setGrupo('meus'); setSel('meu:' + j.id);
      };
      const excluirMeu = (id) => {
        if (!window.confirm('Excluir este registro? As anotações dele também somem.')) return;
        const lista = meus.filter((m) => m.id !== id);
        setMeus(lista); store.set('meusJogadores', lista);
        const n = store.get('notas', {}); delete n['meu:' + id]; store.set('notas', n);
        setSel(null);
      };

      const grupos = [['espn', 'Desde 2007'], ['historia', 'Antes de 2007'], ['lendas', 'Lendas antigas'], ['meus', 'Meus registros'], ['favoritos', 'Favoritos']];

      return (
        <div className="flex flex-col lg:flex-row">
          <aside className="lg:w-96 shrink-0 bg-carvao border-b lg:border-b-0 lg:border-r border-white/5 flex flex-col lg:h-[calc(100vh-57px)] lg:sticky lg:top-[57px]">
            <div className="p-4 space-y-3 border-b border-white/5">
              <div className="flex flex-wrap gap-1.5" role="tablist">
                {grupos.map(([k, rot]) => (
                  <button key={k} role="tab" aria-selected={grupo === k} onClick={() => { setGrupo(k); setCriando(false); }}
                    className={'rounded-md px-2.5 py-1 text-sm transition-colors ' + (grupo === k ? 'bg-ouro text-breu font-semibold' : 'bg-grafite/60 text-neutral-300 hover:bg-grafite')}>
                    {rot}
                  </button>
                ))}
              </div>
              <input value={busca} onChange={(e) => setBusca(e.target.value)} placeholder="Buscar por nome" aria-label="Buscar jogador"
                className="w-full rounded-md border border-white/10 bg-breu px-3 py-2 text-sm text-white placeholder:text-neutral-600" />
              <div className="grid grid-cols-2 gap-2">
                <select value={pos} onChange={(e) => setPos(e.target.value)} aria-label="Posição" className="rounded-md border border-white/10 px-2 py-1.5 text-sm text-white">
                  <option value="todas">Todas as posições</option>
                  {Object.entries(POSICOES).map(([k, v]) => <option key={k} value={k}>{v}s</option>)}
                </select>
                <select value={ordem} onChange={(e) => setOrdem(e.target.value)} aria-label="Ordenar" className="rounded-md border border-white/10 px-2 py-1.5 text-sm text-white">
                  <option value="jogos">Mais jogos</option>
                  <option value="gols">Mais gols</option>
                  <option value="assist">Mais assistências</option>
                  <option value="amarelos">Mais cartões amarelos</option>
                  <option value="vermelhos">Mais cartões vermelhos</option>
                  <option value="recentes">Mais recentes</option>
                  <option value="nome">Nome</option>
                </select>
              </div>
              {(grupo === 'espn' || grupo === 'favoritos') && (
                <select value={temporadaF} onChange={(e) => setTemporadaF(e.target.value === 'todas' ? 'todas' : Number(e.target.value))} aria-label="Filtrar por temporada" className="w-full rounded-md border border-white/10 px-2 py-1.5 text-sm text-white">
                  <option value="todas">Todas as temporadas (desde 2007)</option>
                  {Array.from({ length: ANO_ATUAL - PRIMEIRO_ANO + 1 }, (_, i) => ANO_ATUAL - i).map((a) => <option key={a} value={a}>Só a temporada {a}</option>)}
                </select>
              )}
              {grupo === 'historia' && (
                <select value={anoH} onChange={(e) => setAnoH(e.target.value === 'todas' ? 'todas' : Number(e.target.value))} aria-label="Filtrar por ano" className="w-full rounded-md border border-white/10 px-2 py-1.5 text-sm text-white">
                  <option value="todas">Todas as épocas (1909 a {ULTIMO_ANO_HISTORIA})</option>
                  {Array.from({ length: ULTIMO_ANO_HISTORIA - 1909 + 1 }, (_, i) => ULTIMO_ANO_HISTORIA - i).map((a) => <option key={a} value={a}>No Galo em {a}</option>)}
                </select>
              )}
              <p className="text-xs text-neutral-500">{itens.length} {itens.length === 1 ? 'jogador' : 'jogadores'}</p>
            </div>
            <div className="flex-1 overflow-y-auto px-3 py-3 max-h-[50vh] lg:max-h-none">
              {grupo === 'espn' && progresso && <Carregando texto="Montando a lista com os elencos de cada temporada…" progresso={progresso} />}
              {grupo === 'espn' && !progresso && completando && (
                <div className="mb-3"><Carregando texto="Completando os números com Sofascore e Galo Digital…" progresso={completando} /></div>
              )}
              {grupo === 'espn' && erro && (
                <div className="rounded-lg border border-red-400/30 bg-red-500/10 p-3 text-sm text-red-100">
                  {erro}<button onClick={carregar} className="mt-2 block rounded border border-red-300/40 px-3 py-1 text-xs hover:bg-red-500/20">Tentar de novo</button>
                </div>
              )}
              {grupo === 'historia' && histProg && <Carregando texto="Buscando os atletas e as fichas técnicas no Galo Digital (só na primeira vez)…" progresso={histProg} />}
              {grupo === 'historia' && histErro && !histProg && (
                <div className="rounded-lg border border-red-400/30 bg-red-500/10 p-3 text-sm text-red-100">
                  {histErro}<button onClick={carregarHist} className="mt-2 block rounded border border-red-300/40 px-3 py-1 text-xs hover:bg-red-500/20">Tentar de novo</button>
                </div>
              )}
              {grupo === 'historia' && hist && !histProg && (
                <p className="mb-2 px-1 text-xs text-neutral-500">
                  Pelo Galo Digital: os números são da carreira inteira no Galo, tirados da página de cada atleta. Quem não tem página aparece com os jogos das fichas técnicas. {anoH !== 'todas' && 'No filtro por ano entra quem estava no clube entre a estreia e o último jogo.'}
                </p>
              )}
              {grupo === 'meus' && (
                <button onClick={() => { setCriando(true); setSel(null); }} className="mb-3 w-full rounded-lg border border-dashed border-ouro/50 px-3 py-2.5 text-sm font-semibold text-ouro hover:bg-ouro/10">
                  Registrar jogador
                </button>
              )}
              {!progresso && itens.length === 0 && !(grupo === 'historia' && (histProg || !hist)) && (
                <p className="px-1 text-sm text-neutral-500">
                  {grupo === 'favoritos' ? 'Marque jogadores como favoritos para encontrá-los aqui.' : grupo === 'meus' ? 'Registre jogadores que não estão na base da ESPN e conte a história deles.' : 'Nenhum jogador encontrado.'}
                </p>
              )}
              <ul className="space-y-1">
                {itens.slice(0, limite).map((x) => (
                  <li key={x.chave}>
                    <button onClick={() => { setSel(x.chave); setCriando(false); }} aria-pressed={sel === x.chave}
                      className={'w-full rounded-lg border px-3 py-2 text-left transition-colors ' + (sel === x.chave ? 'border-ouro/70 bg-breu' : 'border-transparent hover:bg-grafite')}>
                      <div className="flex items-center gap-2">
                        <span className="flex-1 truncate font-placar text-lg leading-tight text-white">{x.nome}</span>
                        {favoritos.includes(x.chave) && <span className="text-ouro" aria-label="Favorito">★</span>}
                        {x.atual && <span className="rounded border border-ouro/40 px-1.5 text-[10px] text-ouro">atual</span>}
                      </div>
                      <div className="mt-0.5 flex justify-between gap-2 text-xs text-neutral-500">
                        <span className="truncate">{posPt(x.pos)}, {x.sub}</span>
                        <span className={'shrink-0 tabular-nums ' + (ordem === 'vermelhos' && x.vermelhos ? 'text-red-300' : ordem === 'amarelos' && x.amarelos ? 'text-yellow-300' : '')}>{metrica(x)}</span>
                      </div>
                    </button>
                  </li>
                ))}
              </ul>
              {itens.length > limite && (
                <button onClick={() => setLimite((l) => l + 150)} className="mt-3 w-full rounded-md border border-white/10 py-2 text-sm text-neutral-300 hover:border-white/30">
                  Mostrar mais ({itens.length - limite} restantes)
                </button>
              )}
            </div>
            <div className="flex flex-wrap items-center gap-2 border-t border-white/5 px-4 py-3 text-xs">
              <button onClick={exportarDados} className="rounded border border-white/15 px-2.5 py-1 text-neutral-300 hover:border-white/40">Exportar backup</button>
              <button onClick={() => inputArquivo.current && inputArquivo.current.click()} className="rounded border border-white/15 px-2.5 py-1 text-neutral-300 hover:border-white/40">Importar backup</button>
              <input ref={inputArquivo} type="file" accept="application/json,.json" className="hidden"
                onChange={(e) => { const f = e.target.files && e.target.files[0]; if (f) importarDados(f, (msg) => { setAviso(msg); setMeus(store.get('meusJogadores', [])); setFavoritos(store.get('favoritos', [])); }); e.target.value = ''; }} />
            </div>
          </aside>

          <main className="flex-1 min-w-0 p-5 md:p-8">
            {aviso && (
              <div className="mx-auto mb-4 flex max-w-3xl items-start justify-between gap-3 rounded-lg border border-ouro/30 bg-ouro/10 px-4 py-3 text-sm text-neutral-100">
                <span>{aviso}</span><button onClick={() => setAviso('')} className="text-neutral-400 hover:text-white" aria-label="Fechar aviso">✕</button>
              </div>
            )}
            <div className="mx-auto max-w-3xl bg-carvao rounded-xl border border-white/5 p-5 md:p-7">
              {criando ? (
                <NovoJogador onSalvar={salvarNovo} onCancelar={() => setCriando(false)} />
              ) : selecionado ? (
                selecionado.tipo === 'hist' ? (
                  <DetalheHistorico j={selecionado.j} lenda={selecionado.lenda} favorito={favoritos.includes(selecionado.chave)} onFavoritar={() => alternarFavorito(selecionado.chave)} />
                ) : selecionado.tipo === 'completo' ? (
                  <DetalheCompleto j={selecionado.j} favorito={favoritos.includes(selecionado.chave)} onFavoritar={() => alternarFavorito(selecionado.chave)} />
                ) : selecionado.tipo === 'espn' ? (
                  <DetalheEspn j={selecionado.j} favorito={favoritos.includes(selecionado.chave)} onFavoritar={() => alternarFavorito(selecionado.chave)} onAbrirPerfil={() => setPerfil({ id: selecionado.j.id, nome: selecionado.j.nome, teamId: GALO_ID })} />
                ) : (
                  <DetalheTexto j={selecionado.j} tipo={selecionado.tipo} favorito={favoritos.includes(selecionado.chave)} onFavoritar={() => alternarFavorito(selecionado.chave)}
                    onExcluir={selecionado.tipo === 'meu' ? () => excluirMeu(selecionado.j.id) : null} />
                )
              ) : (
                <div className="py-6">
                  <h2 className="font-placar text-3xl font-bold text-white">Quem já vestiu a camisa do Galo</h2>
                  <p className="mt-3 max-w-prose leading-relaxed text-neutral-300">
                    A lista junta os elencos da ESPN desde 2007 com os números por competição do Sofascore e, no que ele não tiver, do Galo Digital (amistosos, estaduais e copas antigas, desde 2010). Quem jogou antes de 2007 está em “Antes de 2007”, com os atletas e as fichas técnicas do Galo Digital desde 1909.
                  </p>
                  <p className="mt-3 text-sm text-neutral-500">Escolha um jogador na lista para ver a trajetória completa.</p>
                </div>
              )}
            </div>
          </main>
          {perfil && <PerfilJogador alvo={perfil} onFechar={() => setPerfil(null)} onVerNoGalo={null} />}
        </div>
      );
    }

    /* =========================================================
       9. APP PRINCIPAL
       ========================================================= */
    const PRIORIDADE = { pre: 0, in: 1, post: 2 };

    function App() {
      const [aba, setAba] = useState('jogos');
      const [temporada, setTemporada] = useState(ANO_ATUAL);
      const [carregando, setCarregando] = useState(true);
      const [progresso, setProgresso] = useState(null);
      const [erro, setErro] = useState('');
      const [atualizadoEm, setAtualizadoEm] = useState(null);
      const [atualizando, setAtualizando] = useState(false);
      const [selId, setSelId] = useState(null);
      const [versao, setVersao] = useState(0);
      const [jaAbriuJogadores, setJaAbriuJogadores] = useState(false);
      const [alvoJogador, setAlvoJogador] = useState(null);
      const [calSofa, setCalSofa] = useState(null);
      const verNoGalo = useCallback(({ id, nome }) => { setAlvoJogador({ id, nome, t: Date.now() }); setJaAbriuJogadores(true); setAba('jogadores'); window.scrollTo(0, 0); }, []);
      const mapa = useRef(new Map());
      const anosCarregados = useRef(new Set());
      const tudoCarregado = useRef(false);

      const juntar = useCallback((lista) => {
        lista.forEach((e) => {
          const atual = mapa.current.get(e.id);
          if (!atual || PRIORIDADE[e.estado] >= PRIORIDADE[atual.estado]) mapa.current.set(e.id, e);
        });
        setVersao((v) => v + 1);
      }, []);

      const escolherPadrao = useCallback(() => {
        const todos = [...mapa.current.values()];
        const vivo = todos.find((e) => e.estado === 'in');
        if (vivo) return vivo.id;
        const ultimo = todos.filter((e) => e.estado === 'post' && e.resultado).sort((a, b) => new Date(b.data) - new Date(a.data))[0];
        if (ultimo) return ultimo.id;
        const prox = todos.filter((e) => e.estado === 'pre').sort((a, b) => new Date(a.data) - new Date(b.data))[0];
        return prox ? prox.id : null;
      }, []);

      const atualizar = useCallback(async (forcar) => {
        setAtualizando(true);
        try {
          const [ano, prox] = await Promise.all([carregarAno(ANO_ATUAL, forcar), carregarProximos(forcar)]);
          // Jogo marcado que a ESPN não lista mais (remarcado com outro código ou cancelado) sai da lista
          if (!ano.falhas && prox.length) {
            const vistos = new Set([...ano.eventos, ...prox].map((e) => e.id));
            [...mapa.current.values()].forEach((e) => { if (e.estado === 'pre' && !vistos.has(e.id) && new Date(e.data) > Date.now()) mapa.current.delete(e.id); });
          }
          juntar([...ano.eventos, ...prox]);
          carregarCalendarioSofa(forcar).then(setCalSofa).catch(() => {});
          anosCarregados.current.add(ANO_ATUAL);
          setAtualizadoEm(new Date());
          return ano;
        } finally { setAtualizando(false); }
      }, [juntar]);

      useEffect(() => {
        atualizar(false)
          .then(() => { setSelId((s) => s || escolherPadrao()); setErro(''); })
          .catch(() => setErro('Não foi possível buscar os jogos. Confira a conexão com a internet.'))
          .finally(() => setCarregando(false));
        // Perto de um jogo (ou durante) o calendário é conferido a cada 2 min; fora disso, a cada 10 min
        let ultima = Date.now();
        const t = setInterval(() => {
          const agora = Date.now();
          const perto = [...mapa.current.values()].some((e) => e.estado === 'in'
            || (e.estado === 'pre' && new Date(e.data).getTime() - agora < 30 * 60e3 && agora - new Date(e.data).getTime() < 4 * 3600e3));
          if (perto || agora - ultima >= ATUALIZAR_A_CADA) { ultima = agora; atualizar(true).catch(() => {}); }
        }, 2 * 60e3);
        return () => clearInterval(t);
      }, []);

      const temAoVivo = useMemo(() => [...mapa.current.values()].some((e) => e.estado === 'in'), [versao]);
      useEffect(() => {
        if (!temAoVivo) return;
        const t = setInterval(() => carregarProximos(true).then(juntar).catch(() => {}), ATUALIZAR_AO_VIVO);
        return () => clearInterval(t);
      }, [temAoVivo]);

      const carregarTemporada = useCallback(() => {
        setErro('');
        if (temporada === 'todas') {
          if (tudoCarregado.current) return;
          setCarregando(true); setProgresso({ feitos: 0, total: 1 });
          carregarTudo((feitos, total) => setProgresso({ feitos, total }))
            .then(({ eventos, falhas }) => {
              juntar(eventos); tudoCarregado.current = true;
              for (let a = PRIMEIRO_ANO; a <= ANO_ATUAL; a++) anosCarregados.current.add(a);
              if (falhas) setErro(`${falhas} consultas falharam. Os jogos dessas temporadas podem estar incompletos.`);
            })
            .catch(() => setErro('Não foi possível buscar o histórico. Confira a conexão.'))
            .finally(() => { setCarregando(false); setProgresso(null); });
          return;
        }
        if (anosCarregados.current.has(temporada)) return;
        setCarregando(true);
        const p = temporada === ANO_ATUAL ? atualizar(false) : carregarAno(temporada, false).then(({ eventos, falhas }) => {
          juntar(eventos); anosCarregados.current.add(temporada);
          if (falhas && !eventos.length) setErro('Não foi possível buscar essa temporada. Confira a conexão.');
        });
        p.catch(() => setErro('Não foi possível buscar essa temporada. Confira a conexão.')).finally(() => setCarregando(false));
      }, [temporada, juntar, atualizar]);
      useEffect(() => { if (versao > 0 || temporada !== ANO_ATUAL) carregarTemporada(); }, [temporada]);

      const temporadaAnterior = useRef(temporada);
      useEffect(() => {
        if (temporada === 'todas' || temporadaAnterior.current === temporada) return;
        const doAno = [...mapa.current.values()].filter((e) => e.estado === 'post' && anoDe(e.data) === temporada).sort((a, b) => new Date(b.data) - new Date(a.data))[0];
        if (doAno) { setSelId(doAno.id); temporadaAnterior.current = temporada; }
      }, [temporada, versao]);

      const abrirAba = (k) => { setAba(k); if (k === 'jogadores') setJaAbriuJogadores(true); };

      return (
        <div className="min-h-screen bg-breu">
          <nav className="sticky top-0 z-20 flex h-[57px] items-center gap-4 border-b border-white/5 bg-breu/95 px-4 backdrop-blur">
            <div className="flex items-center gap-2.5">
              <div className="grid h-9 w-9 place-items-center rounded-full border-2 border-ouro bg-breu text-lg" aria-hidden="true">🐓</div>
              <div className="hidden sm:block leading-none">
                <span className="font-placar text-xl font-bold text-ouro">Galo</span><span className="font-placar text-xl font-bold text-white">scópia</span>
              </div>
            </div>
            <div className="flex gap-1" role="tablist">
              {[['jogos', 'Jogos'], ['jogadores', 'Jogadores']].map(([k, rot]) => (
                <button key={k} role="tab" aria-selected={aba === k} onClick={() => abrirAba(k)}
                  className={'rounded-md px-3 py-1.5 text-sm font-semibold transition-colors ' + (aba === k ? 'bg-grafite text-ouro' : 'text-neutral-400 hover:text-white')}>
                  {rot}
                </button>
              ))}
            </div>
            <div className="ml-auto flex items-center gap-3 text-xs text-neutral-500">
              {temAoVivo && <span className="hidden md:inline-flex items-center gap-1.5 text-red-200"><span className="ao-vivo" aria-hidden="true"></span>Galo em campo</span>}
              {atualizadoEm && <span className="hidden md:inline">Atualizado às {fHora.format(atualizadoEm)}</span>}
              <button onClick={() => atualizar(true).catch(() => setErro('Não foi possível atualizar agora.'))} disabled={atualizando}
                className="rounded border border-white/15 px-2.5 py-1 text-neutral-300 hover:border-white/40 disabled:opacity-50">
                {atualizando ? 'Atualizando…' : 'Atualizar'}
              </button>
            </div>
          </nav>

          <div className={aba === 'jogos' ? '' : 'hidden'}>
            <AbaJogos
              mapa={mapa} versao={versao} temporada={temporada} setTemporada={setTemporada}
              carregando={carregando} progresso={progresso} erro={erro} onTentar={carregarTemporada}
              selId={selId} setSelId={setSelId} onVerNoGalo={verNoGalo} calSofa={calSofa}
            />
          </div>
          {jaAbriuJogadores && <div className={aba === 'jogadores' ? '' : 'hidden'}><AbaJogadores alvo={alvoJogador} /></div>}
          <footer className="agradecimento border-t border-ouro/20 bg-carvao px-5 py-8 md:px-8">
            <div className="mx-auto max-w-4xl">
              <p className="text-xs font-semibold uppercase tracking-wide text-ouro">Agradecimento especial</p>
              <h2 className="mt-1 font-placar text-2xl font-bold text-white">Obrigado, Galo Digital</h2>
              <p className="mt-2 max-w-prose leading-relaxed text-neutral-300">
                A <a href="https://www.galodigital.com.br/enciclopedia/P%C3%A1gina_principal" target="_blank" rel="noopener noreferrer" className="font-semibold text-ouro hover:underline">Enciclopédia Galo Digital</a> foi uma das fontes que mais ajudaram a construir a Galoscópia. Feita por torcedores, ela guarda mais de um século
                de história do Galo: os jogos desde 1909, as fichas técnicas com escalações e gols, os retrospectos contra cada adversário e a trajetória de cada atleta que
                vestiu a camisa alvinegra. Os jogos antigos, os jogadores de antes de 2007, as fichas dos jogos e boa parte dos números por temporada vêm desse trabalho.
                Sem ele, a parte histórica deste site não existiria.
              </p>
              <p className="mt-3 text-xs text-neutral-500">
                Conteúdo do Galo Digital sob licença CC BY-NC-ND 4.0, lido direto da enciclopédia e sempre com link para a página original. Também usamos dados da ESPN e do
                Sofascore. Projeto de torcedor, sem fins comerciais e sem ligação oficial com o Clube Atlético Mineiro.
              </p>
            </div>
          </footer>
        </div>
      );
    }

    /* =========================================================
       10. RENDER
       ========================================================= */
    // O Fabric 5 usa o valor "alphabetical" (inválido) em textos; o Chrome avisa no console a cada desenho.
    try {
      const d = Object.getOwnPropertyDescriptor(CanvasRenderingContext2D.prototype, 'textBaseline');
      if (d && d.set) {
        Object.defineProperty(CanvasRenderingContext2D.prototype, 'textBaseline', {
          ...d, set(v) { d.set.call(this, v === 'alphabetical' ? 'alphabetic' : v); },
        });
      }
    } catch (e) {}

    const root = ReactDOM.createRoot(document.getElementById('root'));
    const faltando = [];
    if (!window.fabric) faltando.push('Fabric.js');
    if (!window.Recharts) faltando.push('Recharts');
    if (faltando.length) {
      root.render(
        <div className="min-h-screen grid place-items-center p-8">
          <div className="max-w-md text-center">
            <div className="text-4xl mb-3">🐓</div>
            <h1 className="font-placar text-2xl text-white">Não foi possível carregar: {faltando.join(', ')}</h1>
            <p className="mt-2 text-neutral-400">O app busca as bibliotecas na internet. Verifique a conexão e recarregue a página (F5).</p>
          </div>
        </div>
      );
    } else {
      root.render(<App />);
    }
  </script>
</body>
</html>
